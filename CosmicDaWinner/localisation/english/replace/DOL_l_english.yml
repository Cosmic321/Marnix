l_english:
 leutia_focus:0 "Leutian focus tree"
 DOL_address_the_slump:0 "Address the Slump"
 DOL_address_the_slump_desc:0 "The Desprian collapse and the communists have destroyed many homegrown economic sectors and trade routes. Whilst the colonial markets have helped us offload our manufactured goods, their demand has not nearly met our supply. Finding foreign markets to sell our goods to, or plugging in military production at the cost of state funds, is in order to fix the economic slump we find ourselves in."
 DOL_end_desprian_dependence:0 "End Desprian Dependence"
 DOL_end_desprian_dependence_desc:0 "Our old trade routes ran through Despria. With Despria in ruins, we can no longer trust them, and we must stop pretending those routes will ever return."
 DOL_seek_foreign_markets:0 "Seek Foreign Markets"
 DOL_seek_foreign_markets_desc:0 "Leutian merchants have always been able to sell to anyone. Send them out to find buyers for the goods piling up in our warehouses."
 DOL_state_funded_production:0 "State-Funded Production"
 DOL_state_funded_production_desc:0 "If the markets will not buy our goods, the state will. Military orders will keep the factories running, at the cost of state funds."
 DOL_colonial_markets:0 "Colonial Markets"
 DOL_colonial_markets_desc:0 "We are a colonial power after all. Open the colonial markets wider to our manufacturers."
 DOL_merchant_fleet:0 "The Merchant Fleet"
 DOL_merchant_fleet_desc:0 "Leutian ships carry the world's cargo. Expand the yards of Port Augustus to build more of them."
 DOL_wartime_subsidies:0 "Military Subsidies"
 DOL_wartime_subsidies_desc:0 "Direct state subsidies for military production keep our workers employed, if not our treasury."
 DOL_arsenal_of_the_duchy:0 "Arsenal of the Duchy"
 DOL_arsenal_of_the_duchy_desc:0 "The state now owns the arsenal. Another factory line is converted for military output."
 DOL_end_of_the_slump:0 "The Slump Ends"
 DOL_end_of_the_slump_desc:0 "The worst is over. Whichever road we chose, the economy is moving again."
 DOL_port_augustus_docks:0 "Port Augustus Expansion"
 DOL_port_augustus_docks_desc:0 "Port Augustus is the beating heart of Leutian trade. Give it the docks it deserves."
 DOL_aalstadt_exchange:0 "The Aalstadt Exchange"
 DOL_aalstadt_exchange_desc:0 "Aalstadt's merchants need a proper exchange to channel capital into Leutian industry."
 DOL_review_the_sentinel_act:0 "Review the Sentinel Act"
 DOL_review_the_sentinel_act_desc:0 "The sentinels are militia units that were formed to protect coastal cities. Primarily composed of old veterans, sailors and retired men, they have been a major part in slashing funds for the military, and the reason Leutia has a small standing army today. The Sentinels enjoy tax exemptions for continuous service, but have never been fully recognised as part of the army."
 DOL_incorporate_sentinels:0 "Incorporate the Sentinels"
 DOL_incorporate_sentinels_desc:0 "Incorporating the Sentinels into the army could expand our manpower base significantly in times of war, but it will strain our political power."
 DOL_sentinel_exemptions:0 "Exemptions and Training"
 DOL_sentinel_exemptions_desc:0 "Granting the Sentinels further exemptions, or at least giving them basic army training, ensures that we do not strain our small budget."
 DOL_token_militia:0 "Keep Them a Token Force"
 DOL_token_militia_desc:0 "Leave the Sentinels as they are: a token militia. It keeps our small funding intact, at the cost of a stronger army."
 DOL_sentinel_levies:0 "Sentinel Levies"
 DOL_sentinel_levies_desc:0 "The reserve is organised into regional levies that can be called up when the realm is in danger."
 DOL_sentinel_drill:0 "Sentinel Drill Halls"
 DOL_sentinel_drill_desc:0 "Old soldiers train the young in drill halls built in every coastal city."
 DOL_coastal_watch:0 "Coastal Watch"
 DOL_coastal_watch_desc:0 "A cheap, permanent watch along the shore is all the militia needs to do."
 DOL_small_but_sharp:0 "Small but Sharp"
 DOL_small_but_sharp_desc:0 "We cannot field masses, so we shall field the best. A small army, trained and equipped to break through."
 DOL_spearhead_academy:0 "Spearhead Academy"
 DOL_spearhead_academy_desc:0 "A staff college for officers of the small, hard-hitting Leutian army."
 DOL_breakthrough_doctrine:0 "Breakthrough Doctrine"
 DOL_breakthrough_doctrine_desc:0 "Break the line at one point and pour through the gap."
 DOL_audience_with_the_duchess:0 "Audience with the Duchess"
 DOL_audience_with_the_duchess_desc:0 "The Duchess is a popular monarch, one that encapsulates the will of her people within her final decisions. The cabinet she oversees is staffed with competent but realist men. Her ideals are a hindrance to the geopolitical situation Leutia finds itself in."
 DOL_convince_the_duchess:0 "Convince the Duchess"
 DOL_convince_the_duchess_desc:0 "It is important to convince the Duchess to kickstart military spending and choose a nation to align with. We cannot trust the Desprians anymore, and the communists are on our border. This will likely undermine the government's legitimacy and the huge stability our monarch offers."
 DOL_imperial_ambitions:0 "Dreams of an Empire"
 DOL_imperial_ambitions_desc:0 "The Duchess' ambitions could be steered towards a more hardline stance. We are a colonial power after all, and our status as a mere Duchy is outdated."
 DOL_kickstart_military_spending:0 "Kickstart Military Spending"
 DOL_kickstart_military_spending_desc:0 "Open the treasury to the armed forces."
 DOL_choose_a_patron:0 "Choose a Patron"
 DOL_choose_a_patron_desc:0 "Leutia can no longer stand alone. It is time to choose who we stand with, or to decide that we stand with no one."
 DOL_ally_with_itsany:0 "Ally with Itsany"
 DOL_ally_with_itsany_desc:0 "The Republic of Itsany shares our border, our trade and our distaste for the communists. An alliance with them is the natural choice."
 DOL_mercantile_league:0 "Mercantile League"
 DOL_mercantile_league_desc:0 "Bind our neutral trading neighbours, Skizopanoy and Binbop, to us with agreements that make war unprofitable for all."
 DOL_armed_neutrality:0 "Armed Neutrality"
 DOL_armed_neutrality_desc:0 "We choose no patron. Our flexible foreign policy is our greatest asset, and our small army will make sure no one takes it from us."
 DOL_guard_the_mortanian_border:0 "Guard the Mortanian Border"
 DOL_guard_the_mortanian_border_desc:0 "The communists are on our border. Fortify the frontier and make sure they know we are watching."
 DOL_crown_the_empress:0 "Crown the Empress"
 DOL_crown_the_empress_desc:0 "Declaring the Leutian Empire and crowning the Duchess Empress would make her a banner under which the hardline right-wing cabinet can rally the nation."
 DOL_colonial_charter:0 "The Colonial Charter"
 DOL_colonial_charter_desc:0 "Reorganise the colonies as the productive heart of the Empire."
 DOL_imperial_navy:0 "The Imperial Navy"
 DOL_imperial_navy_desc:0 "An empire needs a navy to match."
 DOL_banner_of_the_empire:0 "Banner of the Empire"
 DOL_banner_of_the_empire_desc:0 "Let the right wing of the cabinet rally the people to the Empress' banner."
 DOL_economic_slump:0 "Economic Slump"
 DOL_economic_slump_desc:0 "The Desprian collapse and the rise of the communists have destroyed many homegrown sectors and trade routes. The colonial markets help us offload our manufactured goods, but their demand has not come close to meeting our supply."
 DOL_slump_foreign_markets:0 "Slump: Seeking Foreign Markets"
 DOL_slump_foreign_markets_desc:0 "Our merchants are knocking on every door that will open. The glut of unsold goods is slowly being absorbed abroad."
 DOL_slump_state_funding:0 "Slump: State-Funded Production"
 DOL_slump_state_funding_desc:0 "The state is paying factories to keep working on military orders. It keeps the lights on, but the treasury bleeds."
 DOL_recovered_economy:0 "Recovered Economy"
 DOL_recovered_economy_desc:0 "The slump is behind us. Leutian industry is lean, diversified and ready for whatever comes next."
 DOL_colonial_markets:0 "Colonial Markets"
 DOL_colonial_markets_desc:0 "Our colonies absorb a steady share of Leutian manufactured goods."
 DOL_mercantile_nation:0 "Mercantile Nation"
 DOL_mercantile_nation_desc:0 "Leutia lives by trade. Its merchants, ports and shipwrights are known across the seas."
 DOL_sentinel_militia:0 "The Sentinel Militia"
 DOL_sentinel_militia_desc:0 "The Sentinels were raised to guard coastal cities. Made up of old veterans, sailors and retired men, they enjoy tax exemptions for continuous service but have never been recognised as part of the army. They are the reason Leutia has such a small standing army."
 DOL_sentinel_reserve:0 "Sentinel Reserve"
 DOL_sentinel_reserve_desc:0 "The Sentinels have been folded into the army as a proper reserve. Our manpower base grows, but the burden on the state grows with it."
 DOL_sentinel_exemptions:0 "Trained Sentinels"
 DOL_sentinel_exemptions_desc:0 "The Sentinels enjoy further exemptions and basic army training, making them a credible second line without straining the budget."
 DOL_coastal_watch:0 "Coastal Watch"
 DOL_coastal_watch_desc:0 "A cheap, permanent network of watchers along our shores."
 DOL_elite_spearhead:0 "Small but Sharp"
 DOL_elite_spearhead_desc:0 "Leutia cannot field masses, so it fields the best: a small, well-trained army built for breakthroughs."
 DOL_breakthrough_doctrine:0 "Breakthrough Doctrine"
 DOL_breakthrough_doctrine_desc:0 "Strike hard at a single point, then flow through the gap before the enemy can react."
 DOL_popular_duchess:0 "A Popular Duchess"
 DOL_popular_duchess_desc:0 "The Duchess embodies the will of her people. Her popularity gives the realm great stability, but her ideals are a hindrance in the geopolitical situation Leutia finds itself in."
 DOL_duchess_consents:0 "A Reluctant Duchess"
 DOL_duchess_consents_desc:0 "The Duchess has agreed to put the realm on a firmer footing. The cabinet is satisfied; the people are less certain."
 DOL_empress_banner:0 "Empress of Leutia"
 DOL_empress_banner_desc:0 "The Duchess has become an Empress, and the hardline cabinet marches under her banner."
 DOL_military_spending:0 "Military Spending"
 DOL_military_spending_desc:0 "The cabinet has convinced the Duchess to open the treasury to the armed forces."
 DOL_trade_league:0 "Mercantile League"
 DOL_trade_league_desc:0 "Leutia has bound itself to its neutral trading neighbours with a web of commercial agreements."
 DOL_armed_neutrality:0 "Armed Neutrality"
 DOL_armed_neutrality_desc:0 "Leutia bows to no patron. Its flexible foreign policy is backed by a small but ready army."
 DOL_border_watch:0 "Mortanian Border Watch"
 DOL_border_watch_desc:0 "The communists are on our border. Garrisons and fortifications now watch the frontier."
 DOL_colonial_charter:0 "Colonial Charter"
 DOL_colonial_charter_desc:0 "The colonies are reorganised as the productive heart of an empire."
 DOL_imperial_navy:0 "Imperial Navy"
 DOL_imperial_navy_desc:0 "A navy worthy of an empire, built in Leutian yards."
 DOL_hardline_cabinet:0 "Hardline Cabinet"
 DOL_hardline_cabinet_desc:0 "The right wing of the cabinet has the Empress' ear."
 DOL_empire:0 "Leutian Empire"
 DOL_empire_DEF:0 "the Leutian Empire"
 DOL_empire_ADJ:0 "Leutian"
 DOL_grain_and_timber_monopoly:0 "The Grain and Timber Monopoly"
 DOL_grain_and_timber_monopoly_desc:0 "Leutian grain and Leutian timber are sold through one board, at one price, and the difference stays in the Duchy."
 DOL_rail_to_the_interior:0 "Rail to the Interior"
 DOL_rail_to_the_interior_desc:0 "A line from Port Augustus into the hinterland, so that the interior finally counts for something."
 DOL_aalstadt_bourse:0 "The Aalstadt Bourse"
 DOL_aalstadt_bourse_desc:0 "A proper exchange in the capital, where Leutian money can be raised for Leutian industry."
 DOL_the_leutian_miracle:0 "The Leutian Miracle"
 DOL_the_leutian_miracle_desc:0 "The slump is over. Not through charity or luck, but through ten years of stubborn, unglamorous work."
 DOL_sentinel_artillery:0 "Sentinel Artillery"
 DOL_sentinel_artillery_desc:0 "Field guns for the Sentinel companies, cast in our own foundries."
 DOL_duchess_guard:0 "The Duchess's Guard"
 DOL_duchess_guard_desc:0 "A small, well-drilled brigade whose only loyalty is to the Duchess herself."
 DOL_forts_of_the_marches:0 "Forts of the Marches"
 DOL_forts_of_the_marches_desc:0 "Concrete and guns along the Mortanian frontier, where the last war was fought."
 DOL_an_army_to_be_reckoned_with:0 "An Army to be Reckoned With"
 DOL_an_army_to_be_reckoned_with_desc:0 "Small, sharp, and no longer a militia. Leutia can defend itself."
 DOL_the_hardline_cabinet:0 "A Hardline Cabinet"
 DOL_the_hardline_cabinet_desc:0 "The cautious ministers are replaced with men who will not be talked out of a decision."
 DOL_popular_court:0 "A Popular Court"
 DOL_popular_court_desc:0 "The Duchess is seen at every fair and every harvest. The dynasty becomes the nation's family."
 DOL_the_duchess_triumphant:0 "The Duchess Triumphant"
 DOL_the_duchess_triumphant_desc:0 "Court, cabinet and army answer to one woman, and she answers to no one."
 DOL_empress_reach:0 "The Empress's Reach"
 DOL_empress_reach_desc:0 "Every coaling station, every treaty port, every forgotten island flying the Leutian flag."
 DOL_grand_imperial_fleet:0 "The Grand Imperial Fleet"
 DOL_grand_imperial_fleet_desc:0 "A navy worth the name, built in Leutian yards to protect Leutian trade."
 DOL_banner_eternal:0 "An Eternal Banner"
 DOL_banner_eternal_desc:0 "The imperial standard is raised in every provincial town, and the children learn the anthem."
 DOL_the_empress_crowned:0 "The Empress Crowned"
 DOL_the_empress_crowned_desc:0 "The Duchy is gone. What remains is an empire, and the woman who rules it."
 DOL_compulsory_schooling:0 "Compulsory Schooling"
 DOL_compulsory_schooling_desc:0 "Every child in the Duchy in a classroom until fourteen, paid for by the state."
 DOL_universities_of_aalstadt:0 "The Universities of Aalstadt"
 DOL_universities_of_aalstadt_desc:0 "Two universities and a technical institute, so that Leutia stops sending its clever children abroad."
 DOL_civil_service_reform:0 "Civil Service Reform"
 DOL_civil_service_reform_desc:0 "Examinations instead of patronage. The ministries begin, slowly, to work."
 DOL_a_modern_duchy:0 "A Modern Duchy"
 DOL_a_modern_duchy_desc:0 "Literate, administered, and governed by men who can read a budget."
 DOL_port_expansion:0 "Port Expansion"
 DOL_port_expansion_desc:0 "New basins and cranes at Port Augustus, deep enough for ocean traffic."
 DOL_merchant_marine:0 "A Merchant Marine"
 DOL_merchant_marine_desc:0 "Leutian hulls carrying Leutian goods under the Leutian flag."
 DOL_leutian_railway:0 "The Leutian Railway"
 DOL_leutian_railway_desc:0 "A network rather than a line: Aalstadt to every provincial capital."
 DOL_heavy_industry:0 "Heavy Industry"
 DOL_heavy_industry_desc:0 "Iron, coal and the first blast furnace in the Duchy."
 DOL_textile_mills:0 "Textile Mills"
 DOL_textile_mills_desc:0 "Wool from the interior spun and woven at Aalstadt."
 DOL_agricultural_reform:0 "Agricultural Reform"
 DOL_agricultural_reform_desc:0 "Enclosure, drainage and better seed stock. Fewer farmers, more food."
 DOL_industrial_finance:0 "Industrial Finance"
 DOL_industrial_finance_desc:0 "Banks that will lend to a factory and not merely to a duke."
 DOL_duchys_treasury:0 "The Duchy's Treasury"
 DOL_duchys_treasury_desc:0 "One treasury, one budget, and a minister who can actually read it."
 DOL_an_industrial_duchy:0 "An Industrial Duchy"
 DOL_an_industrial_duchy_desc:0 "Leutia no longer sells only what it grows."
 DOL_reserve_corps:0 "The Reserve Corps"
 DOL_reserve_corps_desc:0 "Every Sentinel who has served stays on the rolls, with a rifle at home."
 DOL_field_artillery:0 "Field Artillery"
 DOL_field_artillery_desc:0 "Batteries of modern guns for the Sentinel brigades."
 DOL_frontier_forts:0 "Frontier Forts"
 DOL_frontier_forts_desc:0 "Steel and concrete on the Desprian and Mortanian marches."
 DOL_mobile_columns:0 "Mobile Columns"
 DOL_mobile_columns_desc:0 "Trucks, motorcycles and radios: the Sentinel moves as fast as the news."
 DOL_mountain_troops:0 "Mountain Troops"
 DOL_mountain_troops_desc:0 "Specialist battalions for the high passes on the eastern border."
 DOL_military_railways:0 "Military Railways"
 DOL_military_railways_desc:0 "Troops and shells moved to the frontier in hours instead of weeks."
 DOL_general_staff:0 "The General Staff"
 DOL_general_staff_desc:0 "A professional staff to plan for a war Leutia hopes never to fight."
 DOL_sentinel_air_arm:0 "The Sentinel Air Arm"
 DOL_sentinel_air_arm_desc:0 "Observation and liaison aircraft for the field armies."
 DOL_the_great_manoeuvre:0 "The Great Manoeuvre"
 DOL_the_great_manoeuvre_desc:0 "One exercise, the whole army, and a great many lessons learned."
 DOL_privy_council:0 "The Privy Council"
 DOL_privy_council_desc:0 "A small council of able men, and nobody else in the room."
 DOL_noble_privileges:0 "The Noble Privileges"
 DOL_noble_privileges_desc:0 "The great families keep their titles, their lands and their taxes, for now."
 DOL_bourgeois_ministers:0 "Bourgeois Ministers"
 DOL_bourgeois_ministers_desc:0 "Merchants and bankers in government, on merit rather than on blood."
 DOL_the_court:0 "The Duchy's Court"
 DOL_the_court_desc:0 "A court worth the name: music, ceremony and a great deal of politics."
 DOL_loyal_nobility:0 "A Loyal Nobility"
 DOL_loyal_nobility_desc:0 "The great families bind themselves to the Duchess by marriage and by office."
 DOL_the_new_men:0 "The New Men"
 DOL_the_new_men_desc:0 "A generation of administrators, engineers and clerks running the state."
 DOL_balance_of_the_court:0 "The Balance of the Court"
 DOL_balance_of_the_court_desc:0 "Old blood and new money, held in careful equilibrium."
 DOL_duchess_and_people:0 "The Duchess and the People"
 DOL_duchess_and_people_desc:0 "A monarch who is loved is a great deal harder to overthrow than one who is feared."
 DOL_coaling_stations:0 "Coaling Stations"
 DOL_coaling_stations_desc:0 "Bunkers and docks at every point on the route to the colonies."
 DOL_colonial_administration:0 "Colonial Administration"
 DOL_colonial_administration_desc:0 "A ministry for the colonies, and a school for its officials."
 DOL_tropical_trade:0 "Tropical Trade"
 DOL_tropical_trade_desc:0 "Cocoa, rubber and sugar moving through Leutian ports and Leutian hands."
 DOL_colonial_army:0 "The Colonial Army"
 DOL_colonial_army_desc:0 "Native regiments under Leutian officers, drilled to Leutian discipline."
 DOL_imperial_conference:0 "The Imperial Conference"
 DOL_imperial_conference_desc:0 "Delegates from every colony, summoned to Aalstadt once a year."
 DOL_trading_empire:0 "The Trading Empire"
 DOL_trading_empire_desc:0 "Leutian houses dominate the carrying trade of two oceans."
 DOL_imperial_ideal:0 "The Imperial Ideal"
 DOL_imperial_ideal_desc:0 "A small Duchy with a great destiny, and a great many people to convince."
 DOL_empress_of_seas:0 "Empress of the Seas"
 DOL_empress_of_seas_desc:0 "The Leutian flag on every sea lane that matters."
 DOL_public_schools:0 "Public Schools"
 DOL_public_schools_desc:0 "A school in every parish, paid for by the state."
 DOL_aalstadt_academy:0 "The Aalstadt Academy"
 DOL_aalstadt_academy_desc:0 "A learned society, a library and a museum in one building."
 DOL_public_health:0 "Public Health"
 DOL_public_health_desc:0 "Clean water, drains and a doctor in every district."
 DOL_the_press:0 "The Press"
 DOL_the_press_desc:0 "Newspapers that can be read by anyone, and bought by anyone."
 DOL_railways_for_all:0 "Railways for All"
 DOL_railways_for_all_desc:0 "Cheap fares and a line to every market town in the Duchy."
 DOL_labour_reform:0 "Labour Reform"
 DOL_labour_reform_desc:0 "Hours limited, factories inspected, children out of the mills."
 DOL_a_literate_duchy:0 "A Literate Duchy"
 DOL_a_literate_duchy_desc:0 "Almost everyone can read the newspaper and the ballot paper."
 DOL_one_nation:0 "One Nation"
 DOL_one_nation_desc:0 "Aalstadt and the provinces, the duke and the docker, all pulling the same way."
 DOL_leutian_embassies:0 "Leutian Embassies"
 DOL_leutian_embassies_desc:0 "Legations in every capital that matters."
 DOL_trade_treaties:0 "Trade Treaties"
 DOL_trade_treaties_desc:0 "Reciprocal tariffs with every neighbour who will sign."
 DOL_mediate_the_marches:0 "Mediate the Marches"
 DOL_mediate_the_marches_desc:0 "Leutia offers itself as the honest broker between Despria and Mortania."
 DOL_leutian_league:0 "The Leutian League"
 DOL_leutian_league_desc:0 "A customs union of the small states, with Aalstadt at its centre."
 DOL_guarantee_the_small:0 "Guarantee the Small"
 DOL_guarantee_the_small_desc:0 "Leutian guarantees to the little states that nobody else will defend."
 DOL_grand_alliance:0 "The Grand Alliance"
 DOL_grand_alliance_desc:0 "Ties with the powers that share Leutia's interest in a quiet continent."
 DOL_leutia_first:0 "Leutia First"
 DOL_leutia_first_desc:0 "The Duchy's interests, honestly stated and firmly defended."
 DOL_duchys_peace:0 "The Duchy's Peace"
 DOL_duchys_peace_desc:0 "A small nation that kept the peace of a continent, and was thanked for it."
 DOL_the_mortanian_question:0 "The Mortanian Question"
 DOL_the_mortanian_question_desc:0 "Aalstadt has papers proving that the Mortanian marches were leased, not sold, four centuries ago. The lawyers are confident. The army is keen."
 DOL_the_empire_expands:0 "The Empire Expands"
 DOL_the_empire_expands_desc:0 "The Empress does not annex. She protects, administers, and eventually forgets to leave."
 DOL_the_second_empire:0 "The Second Empire"
 DOL_the_second_empire_desc:0 "Beyond the horizon lie provinces that have never heard of the Duchess's justice. They will."
