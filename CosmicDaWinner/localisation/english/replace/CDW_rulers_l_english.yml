l_english:
 ALT_ruler:0 "Jorgen Bergbad I"
 ALT_ruler_desc:0 "King Jorgen Bergbad I of Alt came to a throne made of grain contracts and a fleet that could not be argued with. He has spent his reign selling Alt's harvests to every side of every quarrel on the map, and he is careful never to sell the one thing he cannot grow back: the Kingdom's independence."
