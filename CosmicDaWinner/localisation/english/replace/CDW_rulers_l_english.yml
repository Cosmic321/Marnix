 DPJ_ruler_neutral:0 "Marshal Berthold Kessler"
 DPJ_ruler_neutral_desc:0 "Kessler commanded the southern army group, signed the armistice, and has spent every year since insisting that soldiers have no business in politics while being the only person in the country with a say in them. He governs through committees he appoints and resigns from them whenever a decision turns out badly."
 DES_ruler_democratic:0 "Matthias Kern"
 DES_ruler_democratic_desc:0 "Kern was the empire's best constitutional lawyer before he was its first elected head of government, and he has the lawyer's faith that a badly drafted clause is a greater danger than a foreign army. He has drafted the crown's powers down to the point where the emperor's signature is decorative, and both he and the emperor are quietly relieved about it."
 DES_ruler_communist:0 "Rosa Feldt"
 DES_ruler_communist_desc:0 "Feldt spent the war printing pamphlets on a press she built herself and the peace organising the factory councils that eventually took the country. She is the only member of the new government who is genuinely uninterested in the old nobility, which the old nobility finds more frightening than hatred."
 SUN_ruler:0 "Elder Marta Khol"
 SUN_ruler_desc:0 "Sumni is the north of Vyratia with the politics taken out: a hundred thousand square kilometres of pasture, forest and villages that have never quite been governed by anyone. Marta Khol has been the closest thing to a government there for thirty years, and she intends to keep it that way."
 BRR_ruler:0 "Prime Minister Ilse Vardo"
 BRR_ruler_desc:0 "Barri is where Vyratia kept its factories, and now it keeps the factories instead. Vardo ran three of them before she ran the province, and she has no intention of letting the south tell her what to make."
 AFR_ruler:0 "Counsellor Piet Haven"
 AFR_ruler_desc:0 "Afria is a scatter of islands with more harbours than roads, and it has spent every century since its discovery being governed from somewhere else. Haven would like that to stop, preferably without a war."
 VYR_ruler:0 "Colonel Radomir Vesk"
 VYR_ruler_desc:0 "Vyrataria is the old heartland, minus the coast, minus the north and minus most of the reason anyone wanted the heartland in the first place. Vesk holds it with the only thing that came with it: the garrison."
 FGT_ruler:0 "Banner-Leader Osric Thal"
 FGT_ruler_desc:0 "Fighten is a stretch of the southeastern industrial belt that declared for the revolution and then found itself with no revolution left to belong to. Thal's columns hold the rail junctions and very little else."
 PPS_ruler:0 "The Central Committee"
 PPS_ruler_desc:0 "The Peoples State is what remains of the Directorate's leadership: a committee with no chairman, a party with no offices, and an army that has stopped fighting in lines because it no longer has any."
