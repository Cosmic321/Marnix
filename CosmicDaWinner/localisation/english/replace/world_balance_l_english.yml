l_english:
 overstretched_industry:0 "Overstretched Industry"
 overstretched_industry_desc:0 "Our industry has grown far beyond our administration, our railways and our skilled workforce. Half of everything we build is swallowed by consumer goods, factories stand idle waiting for coal that never arrives, and every new order drowns in paperwork. Until the industrial base is rationalised, our economy will never perform anywhere near its paper strength."
 overstretched_industry_triage:0 "Emergency Industrial Triage"
 overstretched_industry_triage_desc:0 "The planners have been brought in, the worst committees cut and the most obvious bottlenecks cleared. It is no longer chaos, but it is a long way from efficient."
 overstretched_industry_reformed:0 "Partially Rationalised Industry"
 overstretched_industry_reformed_desc:0 "Schedules have been rewritten and the bloated ministries trimmed. The economy is still clumsy, but it is no longer strangling itself."
 streamlined_industry:0 "Streamlined Industry"
 streamlined_industry_desc:0 "The reforms have paid off. Our factories now run on time, and the economy finally works the way the statistics always claimed it did."
 generic_rationalise_industry:0 "Rationalise the Industry"
 generic_rationalise_industry_desc:0 "The industrial base is too large to manage. Bring in the planners, cut the committees and force the factories to work as one machine. This will take years to do properly."
 generic_emergency_austerity:0 "Emergency Austerity"
 generic_emergency_austerity_desc:0 "Consumer goods are eating the budget alive. Rationing, price controls and a great deal of unpopularity will buy the factories the breathing space they need."
 generic_industrial_restructuring:0 "Industrial Restructuring"
 generic_industrial_restructuring_desc:0 "The old sprawling combines are broken up and rebuilt around a handful of genuinely productive centres. It is expensive, it is painful, and it is the only way forward."
 generic_modern_industrial_base:0 "A Modern Industrial Base"
 generic_modern_industrial_base_desc:0 "Finish the work. What is left of the old, bloated system is torn down and replaced with something modern, lean and effective."
