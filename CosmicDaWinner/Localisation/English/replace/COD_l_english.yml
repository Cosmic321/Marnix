l_english:
 cornish_focus:0 "Cornish focus tree"
 COD_the_new_duchy:0 "The Great Duchy Rises"
 COD_the_new_duchy_desc:0 "The Great Duchy of Cornwall rises as it deals with its major problems: a housing shortage, a tourist-based industry and its recent break-away from the old realm. We must start by removing these burdens, and only then can the Duchy truly grow."
 COD_housing_crisis:0 "The Housing Crisis"
 COD_housing_crisis_desc:0 "Too many holiday homes, too few homes. The Duchy cannot grow while its own people cannot find a roof."
 COD_council_homes:0 "Council Homes"
 COD_council_homes_desc:0 "The state will build homes for Cornish families."
 COD_new_towns:0 "The New Towns"
 COD_new_towns_desc:0 "Entire new towns around Truro and Liskeard, built for those who live and work here all year."
 COD_end_housing_shortage:0 "End the Housing Shortage"
 COD_end_housing_shortage_desc:0 "The last family has left the caravan. The Duchy has a home for everyone who wants one."
 COD_forge_a_nation:0 "Forge a Nation"
 COD_forge_a_nation_desc:0 "The break-away was only the beginning. Now we must give Cornwall institutions, a currency and a sense of itself."
 COD_cornish_pride:0 "One and All"
 COD_cornish_pride_desc:0 "The Duchy is proud of what it is. Let every town fly the black and gold."
 COD_rethink_tourism:0 "Rethink Tourism"
 COD_rethink_tourism_desc:0 "Pasties, surf schools and seaside tat. The summer crowds are our livelihood and our curse. The tourist economy must change."
 COD_diversify_economy:0 "Diversify the Economy"
 COD_diversify_economy_desc:0 "Welcome the visitors, but build something else besides. Harbour workshops, shipyards and small factories in every town."
 COD_grockle_control:0 "Operation Grockle-Away"
 COD_grockle_control_desc:0 "Every summer the roads clog and the locals mutter. The Duchy will cap visitor numbers, close the roads and keep the beaches for those who live here."
 COD_civilian_expansion:0 "Civilian Expansion"
 COD_civilian_expansion_desc:0 "With the old burdens gone, Cornwall can grow. Builders and engineers are in demand everywhere."
 COD_pasty_exports:0 "Pasty Exports"
 COD_pasty_exports_desc:0 "The Cornish pasty is the Duchy's great export. Organise it properly, with refrigerated ships, branded crates and trade missions."
 COD_ran_out_of_jam:0 "We Have Run Out of Jam"
 COD_ran_out_of_jam_desc:0 "The export drive has had one unfortunate side effect: there is no jam left in Cornwall."
 COD_reopen_the_mines:0 "Reopen the Mines"
 COD_reopen_the_mines_desc:0 "The old tin and copper mines are flooded, but not forgotten. Pump them out, and give the Duchy the raw materials it has always lacked."
 COD_china_clay_works:0 "The China Clay Works"
 COD_china_clay_works_desc:0 "The pale hills around St Austell hold clay, and under the clay, other things."
 COD_industrial_revival:0 "Industrial Revival"
 COD_industrial_revival_desc:0 "The mines, the clay pits and the yards are running again. For the first time, Cornwall has a real industrial base."
 COD_stay_the_course:0 "Stay the Course"
 COD_stay_the_course_desc:0 "The Duchy is democratic and intends to stay that way. A Cornwall with elections, pasties and plenty of arguments."
 COD_non_aligned_cornwall:0 "Cornwall Stands Alone"
 COD_non_aligned_cornwall_desc:0 "The Duchy has no patrons and wants none. Cornwall belongs to the Cornish."
 COD_cornish_empire:0 "The Cornish Empire"
 COD_cornish_empire_desc:0 "The Duchy was too small a name for what Cornwall has become. Crown the Duchy an Empire and let the black and gold be seen from Plynt to Newquay."
 COD_peoples_cornwall:0 "The People's Cornwall"
 COD_peoples_cornwall_desc:0 "The miners, fishermen and bakers have built this country. Let them run it."
 COD_youngest_in_the_world:0 "The Youngest Nation"
 COD_youngest_in_the_world_desc:0 "Cornwall is the youngest nation on the map. It has no old habits to unlearn and every reason to be the most modern."
 COD_technical_college:0 "The Technical College"
 COD_technical_college_desc:0 "A college at Truro for engineers and mechanics."
 COD_workshops_of_newquay:0 "Workshops of Newquay"
 COD_workshops_of_newquay_desc:0 "Tinkerers and surf-board makers turn out to be a fine start for an engineering workforce."
 COD_new_tech_cluster:0 "The Technology Cluster"
 COD_new_tech_cluster_desc:0 "College and workshops now feed each other."
 COD_harraldinhos_vision:0 "The Liberator's Vision"
 COD_harraldinhos_vision_desc:0 "Harraldinho, the Cornish Liberator, has drawn a map so big and so strange that his advisers are worried. But it is a very good map."
 COD_armoured_tradition:0 "Armoured Tradition"
 COD_armoured_tradition_desc:0 "Cornwall has no aircraft and little history of war, but it does have a lot of steel and some very stubborn engineers. If Cornwall must fight, it will fight with tanks."
 COD_air_what_air:0 "Air? What Air?"
 COD_air_what_air_desc:0 "Cornwall has no aviation tradition. We will start small, and learn everything we can."
 COD_tank_workshops:0 "The Tank Workshops"
 COD_tank_workshops_desc:0 "Bring the tank yards to the heart of the Duchy."
 COD_christmas_tank_incident:0 "The Christmas Tank Incident"
 COD_christmas_tank_incident_desc:0 "Three Santas on a tank in a Cornish village. Somebody has to explain that, and it might as well be the government."
 COD_advanced_armour:0 "Advanced Armour"
 COD_advanced_armour_desc:0 "Cornish engineers keep finding new ways to put more armour on more tracks."
 COD_housing_shortage:0 "Housing Shortage"
 COD_housing_shortage_desc:0 "There are simply not enough homes in Cornwall. Holiday lets and second homes have priced out the people who actually live here."
 COD_tourist_economy:0 "Tourist-Based Economy"
 COD_tourist_economy_desc:0 "Pasties, surf schools and seaside tat. Cornwall lives off the summer visitors, and has little heavy industry to show for it."
 COD_breakaway_fallout:0 "Break-Away Fallout"
 COD_breakaway_fallout_desc:0 "The recent break-away from the old realm left the new Duchy with tangled finances, divided loyalties and a lot of paperwork."
 COD_young_nation:0 "Youngest of Nations"
 COD_young_nation_desc:0 "Cornwall is the youngest state on the map, with no old habits to unlearn. Its universities, workshops and tinkerers are eager for anything new."
 COD_no_air_history:0 "No Aviation Tradition"
 COD_no_air_history_desc:0 "Cornwall has no history with aircraft beyond gulls. Its pilots and designers are starting from nothing."
 COD_diversified_economy:0 "Diversified Economy"
 COD_diversified_economy_desc:0 "Tourism is now just one sector among many. Workshops and small yards have appeared in every harbour town."
 COD_grockle_control:0 "Grockle Control"
 COD_grockle_control_desc:0 "The visitor numbers are capped, the roads are quiet and the locals are grumpily content. The treasury is less happy."
 COD_civilian_boom:0 "Civilian Industry Boom"
 COD_civilian_boom_desc:0 "Cornish builders and engineers are in demand everywhere."
 COD_pasty_exports:0 "Pasty Exports"
 COD_pasty_exports_desc:0 "The Cornish pasty has become a worldwide brand. Whole fleets of refrigerated ships carry it abroad."
 COD_jam_shortage:0 "Jam Shortage"
 COD_jam_shortage_desc:0 "The nation has run out of jam. The cream tea has become a matter of national security."
 COD_mad_cartographer:0 "The Mad Cartographer"
 COD_mad_cartographer_desc:0 "The leader is mentally insane from designing this map. Inspired lunacy and appalling paperwork follow in equal measure."
 COD_cornish_pride:0 "Cornish Pride"
 COD_cornish_pride_desc:0 "One and All. The Duchy is proud of what it is."
 COD_armoured_tradition:0 "Armoured Tradition"
 COD_armoured_tradition_desc:0 "If Cornwall must have an army, it will have tanks."
 COD_armour_doctrine:0 "Advanced Armour Doctrine"
 COD_armour_doctrine_desc:0 "Cornish engineers keep finding new ways to put more armour on more tracks."
 COD_air_lessons:0 "Lessons from the Sky"
 COD_air_lessons_desc:0 "Cornwall has started to learn the basics of flying, mostly from watching the seagulls."
 COD_tech_cluster:0 "Technology Cluster"
 COD_tech_cluster_desc:0 "Workshops and colleges from Truro to Newquay feed each other new ideas."
 COD_reopened_mines:0 "Reopened Mines"
 COD_reopened_mines_desc:0 "The old Cornish mines are open again, and pumping out ore."
 cod.1.t:0 "Break-Away Blues"
 cod.1.d:0 "The Great Duchy of Cornwall rises, but the split with the old realm has left a mess of ledgers, border posts and disputed pension schemes. Clerks in Truro report that nobody can say who owns the lighthouses."
 cod.1.a:0 "We will sort it out, one form at a time."
 cod.1.b:0 "Declare the paperwork finished by decree."
 cod.2.t:0 "Housing at Last"
 cod.2.d:0 "The first of the new estates is full, and for once the sound of hammers in Liskeard is a happy one. Fewer families are living in caravans, and fewer holiday cottages stand empty all winter."
 cod.2.a:0 "Homes for Cornish people first."
 cod.3.t:0 "The Grockle Question"
 cod.3.d:0 "Every summer the roads clog, the beaches fill and the locals mutter about \"grockles\". The Duchy must decide how to handle its visitors, and nobody is quite sure how many pasties one visitor eats before they become a problem."
 cod.3.a:0 "Diversify and welcome everyone."
 cod.3.b:0 "Close the roads. Operation Grockle-Away begins."
 cod.4.t:0 "Pasty Boom"
 cod.4.d:0 "Crates of pasties are leaving every harbour. Cornish bakers are working three shifts, and ambassadors in foreign capitals report that the pasty is now more famous than the Duchy itself."
 cod.4.a:0 "Export more!"
 cod.5.t:0 "We Have Run Out of Jam"
 cod.5.d:0 "A terrible discovery in St Austell: every pot of jam in the Duchy has been eaten, exported or hidden. The cream tea cannot be completed, and the people are restless.\n\nThe cream, of course, goes first. The jam goes second. There is no discussion."
 cod.5.a:0 "Ration what is left."
 cod.5.b:0 "Import jam from abroad at any cost."
 cod.5.c:0 "Jam? We never needed it."
 cod.6.t:0 "The Liberator's Vision"
 cod.6.d:0 "Harraldinho, the Cornish Liberator, has spent three nights awake drawing borders on a very large map. His advisers report that he mutters about coastlines, and is no longer sure which of his borders are real. The map is spectacular. The man is exhausted."
 cod.6.a:0 "Let him draw."
 cod.6.b:0 "Gently take away the pens."
 cod.7.t:0 "The Christmas Tank Incident"
 cod.7.d:0 "Three men in Santa suits, apparently drunk, have been seen riding an armoured vehicle through a Cornish village. Nobody is sure where they got it. Some say it was a training exercise, others that the Duchy's tank programme has gone a little too far."
 cod.7.a:0 "Give them a medal."
 cod.7.b:0 "Confiscate the tank and the hats."
 cod.8.t:0 "The Mines Reopen"
 cod.8.d:0 "The great shafts of Cornwall have been unwatered, the engine houses are working again and the first trains of ore are rolling. For a land that has long lived on summer visitors, it is a strange and welcome sound."
 cod.8.a:0 "Dig deep."
 COD_harraldinho:0 "Harraldinho"
 COD_harraldinho_desc:0 "Harraldinho, the Cornish Liberator, broke the Duchy free and now leads it. He is reported to be mentally insane from designing this map."
