l_english:
 cdw_barry_big_pp:0 "Barry big PP"
 cdw_barry_big_pp_desc:0 "Barry has been extremely forthcoming about his qualifications, and the recruitment office has long since stopped asking follow-up questions. The result is a battalion that drills twice a day, marches with a confidence the neighbouring duchies find frankly unsettling, and hits like a field artillery park.\n\nUnlocks the Femboy Battalion and the kit it carries: 100 soft attack per battalion."
 femboy:0 "Femboy Battalion"
 femboy_desc:0 "A thousand volunteers, one very confident quartermaster and enough firepower to flatten a fortified line. Each battalion wants 100 units of Barry's kit."
 cdw_femboy_equipment:0 "Barry's Kit"
 cdw_femboy_equipment_0:0 "Barry's Kit Mk. I"
 cdw_femboy_equipment_0_desc:0 "Everything a growing battalion needs. 100 soft attack per unit, and it is not subtle about it."
