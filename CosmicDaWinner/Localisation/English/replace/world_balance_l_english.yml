l_english:
 overstretched_industry:0 "Overstretched Industry"
 overstretched_industry_desc:0 "Our industry has grown faster than our administration, our railways or our skilled workforce. Factories stand idle waiting for coal that never arrives, and every new order drowns in paperwork. Until the industrial base is rationalised, our economy will never perform near its paper strength."
 overstretched_industry_reformed:0 "Partially Rationalised Industry"
 overstretched_industry_reformed_desc:0 "Committees have been cut, schedules rewritten and the worst bottlenecks cleared. The economy is still clumsy, but it is no longer strangling itself."
 streamlined_industry:0 "Streamlined Industry"
 streamlined_industry_desc:0 "The reforms have paid off. Our factories now run on time, and the economy finally works the way the statistics always claimed it did."
 generic_rationalise_industry:0 "Rationalise the Industry"
 generic_rationalise_industry_desc:0 "The industrial base is too large to manage. Bring in the planners, cut the committees and force the factories to work as one machine."
 generic_modern_industrial_base:0 "A Modern Industrial Base"
 generic_modern_industrial_base_desc:0 "Finish the work. What is left of the old, bloated system is torn down and replaced with something modern, lean and effective."
