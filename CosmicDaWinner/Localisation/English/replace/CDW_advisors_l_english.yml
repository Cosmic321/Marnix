 cdw_pol_01:0 "Silver Tongue"
 cdw_pol_01_desc:0 "Knows every back room in the capital, and who to flatter in each of them."
 cdw_pol_02:0 "Steady Hand"
 cdw_pol_02_desc:0 "Calm in a crisis; the country sleeps better with this one in the cabinet."
 cdw_pol_03:0 "War Hawk"
 cdw_pol_03_desc:0 "Whispers of old grievances and lost provinces, loudly and often."
 cdw_pol_04:0 "Frugal Treasurer"
 cdw_pol_04_desc:0 "Counts every coin twice and lets none of them go to waste."
 cdw_pol_05:0 "Factory Organiser"
 cdw_pol_05_desc:0 "Turns a shed and three lathes into a functioning works."
 cdw_pol_06:0 "Public Works Minister"
 cdw_pol_06_desc:0 "Believes roads, dams and telegraph poles are the true army of the state."
 cdw_pol_07:0 "Armaments Minister"
 cdw_pol_07_desc:0 "Keeps the arsenals fed and the quartermasters honest."
 cdw_pol_08:0 "Industrial Planner"
 cdw_pol_08_desc:0 "Draws five year plans on the back of envelopes, and they work."
 cdw_pol_09:0 "Patron of Learning"
 cdw_pol_09_desc:0 "Endows chairs, laboratories and libraries out of the state purse."
 cdw_pol_10:0 "Drillmaster"
 cdw_pol_10_desc:0 "Marches the army up and down the square until it forgets how to be afraid."
 cdw_pol_11:0 "Fortifications Expert"
 cdw_pol_11_desc:0 "Has never met a hill that could not be improved with concrete."
 cdw_pol_12:0 "Corps Reformer"
 cdw_pol_12_desc:0 "Rebuilds the officer corps from the bottom up."
 cdw_pol_13:0 "Air Advocate"
 cdw_pol_13_desc:0 "Argues for aerodromes where others argue for battleships."
 cdw_pol_14:0 "Air Defence Secretary"
 cdw_pol_14_desc:0 "Wants a listening post on every headland."
 cdw_pol_15:0 "Naval Lobbyist"
 cdw_pol_15_desc:0 "Speaks for the admirals and the shipyards that feed them."
 cdw_pol_16:0 "Recruiting Sergeant"
 cdw_pol_16_desc:0 "Signs up the young, the bored and the badly paid."
 cdw_pol_17:0 "Party Whip"
 cdw_pol_17_desc:0 "Keeps the caucus in line with a mixture of charm and menace."
 cdw_pol_18:0 "Conciliator"
 cdw_pol_18_desc:0 "Heals quarrels between factions before they reach the streets."
 cdw_ind_1:0 "Steel Magnate"
 cdw_ind_1_desc:0 "Owns the furnaces and reminds the government of it regularly."
 cdw_ind_2:0 "Shipbuilding Consortium"
 cdw_ind_2_desc:0 "Slipways, dry docks and a great many rivets."
 cdw_ind_3:0 "Construction Cartel"
 cdw_ind_3_desc:0 "Builds everything the state asks for, and several things it did not."
 cdw_ind_4:0 "Consumer Goods Board"
 cdw_ind_4_desc:0 "Rationalises the factories that keep the nation in pots and cloth."
 cdw_ind_5:0 "Munitions Trust"
 cdw_ind_5_desc:0 "Shells, cartridge cases and the occasional mountain of surplus cordite."
 cdw_ind_6:0 "Textile Combine"
 cdw_ind_6_desc:0 "Mills and looms turning raw fibre into uniforms and trade goods."
 cdw_ind_7:0 "Industrial Laboratory"
 cdw_ind_7_desc:0 "A research works attached to a factory floor."
 cdw_ind_8:0 "Rail and Freight Company"
 cdw_ind_8_desc:0 "Moves the ore to the furnace and the finished goods to the coast."
 cdw_ind_9:0 "Armour Works"
 cdw_ind_9_desc:0 "Rolling mills, tool rooms and a talent for heavy plate."
 cdw_mil_01:0 "Chief of the General Staff"
 cdw_mil_01_desc:0 "Runs the land war from behind a very large map."
 cdw_mil_02:0 "Defensive Doctrine"
 cdw_mil_02_desc:0 "Fights from prepared positions and makes the enemy pay for every field."
 cdw_mil_03:0 "Mobilisation Expert"
 cdw_mil_03_desc:0 "Can put a reserve army in the field in a fortnight."
 cdw_mil_04:0 "Grand Admiralty"
 cdw_mil_04_desc:0 "Fleet doctrine, refits and an obsession with coal bunkerage."
 cdw_mil_05:0 "Dockyard Board"
 cdw_mil_05_desc:0 "Keeps the slipways turning out hulls on schedule."
 cdw_mil_06:0 "Convoy Escort Doctrine"
 cdw_mil_06_desc:0 "Believes the war on the sea is won by the escort, not the battleship."
 cdw_mil_07:0 "Air Superiority Doctrine"
 cdw_mil_07_desc:0 "Every operation begins and ends with the air battle."
 cdw_mil_08:0 "Air Defence Network"
 cdw_mil_08_desc:0 "Searchlights, sound locators and a chain of reporting posts."
 cdw_mil_09:0 "Flight Training Programme"
 cdw_mil_09_desc:0 "Wants pilots with hours in their logbooks, not just enthusiasm."
 cdw_mil_10:0 "Offensive Spirit"
 cdw_mil_10_desc:0 "Attack is the only thing this staff college teaches."
 cdw_mil_11:0 "Trench Line Doctrine"
 cdw_mil_11_desc:0 "Field works, wire and interlocking fire."
 cdw_mil_12:0 "Fleet in Being"
 cdw_mil_12_desc:0 "A fleet that merely exists can win a war by never fighting one."
 cdw_mil_13:0 "Coastal Command"
 cdw_mil_13_desc:0 "Watching the sea lanes from a hundred little stations."
 cdw_mil_14:0 "Strategic Bombing"
 cdw_mil_14_desc:0 "The enemy's factories are the real front line."
 cdw_mil_15:0 "Interceptor Command"
 cdw_mil_15_desc:0 "Nothing crosses the border without being met."
 cdw_mil_16:0 "Infantry Theorist"
 cdw_mil_16_desc:0 "Writes long, combative pamphlets on the shape of the next war."
 cdw_mil_17:0 "Naval Theorist"
 cdw_mil_17_desc:0 "Reorganises the fleet on paper until it looks unbeatable."
 cdw_mil_18:0 "Air Theorist"
 cdw_mil_18_desc:0 "Aerodromes, airframes and a future nobody else can see yet."
 cdw_mil_19:0 "Industrial Theorist"
 cdw_mil_19_desc:0 "Standardisation, jigs and the science of making more with less."
