 AFR_the_schools:0 "Open the Schools"
 AFR_the_schools_desc:0 "Reading, arithmetic and a version of the last ten years that fits in one lesson."
 AFR_the_road:0 "The Road Out"
 AFR_the_road_desc:0 "One road to the capital, kept open, on the understanding that it runs both ways."
 AFR_the_treaty:0 "A Treaty or Two"
 AFR_the_treaty_desc:0 "The province will sign with anyone who recognises it, which is currently two countries and a shipping line."
 AFR_the_soldiers_pay:0 "Pay the Soldiers"
 AFR_the_soldiers_pay_desc:0 "An army that is paid on time is an army that does not have opinions about the government."
 AFR_the_old_elite:0 "The Old Families"
 AFR_the_old_elite_desc:0 "Every province has them, and every province has to decide whether to use them or replace them."
 AFR_the_harvest:0 "Bring In the Harvest"
 AFR_the_harvest_desc:0 "Whatever else happens, the province eats this winter or it does not have a government."
 AFR_the_question_again:0 "The Question of Vyratia, Again"
 AFR_the_question_again_desc:0 "The council has run out of other business."
 AFR_the_crown:0 "A Crown in the Room"
 AFR_the_crown_desc:0 "The royalists have a candidate and the candidate has a great many opinions about ports."
 AFR_the_offer:0 "The Offer from the Capital"
 AFR_the_offer_desc:0 "Vyratia has sent an envoy with a treaty and a photograph of the same envoy in uniform."
 AFR_the_vote:0 "Put It to the Vote"
 AFR_the_vote_desc:0 "A referendum nobody outside the province will recognise and everyone inside it will remember."
 AFR_rejoin:0 "Rejoin Vyratia"
 AFR_rejoin_desc:0 "Afria puts the question one last time."
 VYR_take_stock:0 "Take Stock"
 VYR_take_stock_desc:0 "What is left of the province, and who is going to count it."
 VYR_the_councils:0 "The Provincial Councils"
 VYR_the_councils_desc:0 "A government that meets in a real building and can be argued with."
 VYR_the_question:0 "The Question of Vyratia"
 VYR_the_question_desc:0 "Everybody knows the province cannot stand alone forever. Nobody wants to be the one who says so first."
 VYR_the_border:0 "Mark the Border"
 VYR_the_border_desc:0 "Posts, maps and a customs house, so that at least the argument is about something."
 VYR_rebuild:0 "Rebuild the Towns"
 VYR_rebuild_desc:0 "The war went through twice. The second time was worse."
 VYR_a_plant:0 "One Plant"
 VYR_a_plant_desc:0 "Not an industry: a plant, a boiler and a shift that knows what it is doing."
 VYR_the_treasury:0 "A Treasury"
 VYR_the_treasury_desc:0 "A province that prints its own scrip is not a province that stays in a union for long."
 VYR_the_militia:0 "The Militia"
 VYR_the_militia_desc:0 "Every village a section, every section a rifle, and nobody entirely sure who they belong to."
 VYR_the_garrison:0 "The Garrison"
 VYR_the_garrison_desc:0 "The old heartland has the coast on one side and the Republic on the other. Both are fortified."
 VYR_the_schools:0 "Open the Schools"
 VYR_the_schools_desc:0 "Reading, arithmetic and a version of the last ten years that fits in one lesson."
 VYR_the_road:0 "The Road Out"
 VYR_the_road_desc:0 "One road to the capital, kept open, on the understanding that it runs both ways."
 VYR_the_treaty:0 "A Treaty or Two"
 VYR_the_treaty_desc:0 "The province will sign with anyone who recognises it, which is currently two countries and a shipping line."
