 PDV_fa_c3_6_desc:0 "The claims are printed in the newspapers before they are made in the chancelleries."
 PDV_fa_c3_7:0 "The Reich in the World"
 PDV_fa_c3_7_desc:0 "The province takes its place in the world, and the world takes note."
 PDV_mo_review:0 "Letters to the Court"
 PDV_mo_review_desc:0 "Every officer dismissed since 1931 is pardoned in a single ceremony, and handed his commission with the pardon."
 PDV_mo_spine1:0 "The Household Troops"
 PDV_mo_spine1_desc:0 "A small, well-drilled, extremely loyal force whose real purpose is to make sure the army is never asked what it thinks."
 PDV_mo_spine2:0 "The Officers' Oath"
 PDV_mo_spine2_desc:0 "The oath is rewritten so that it is sworn to the crown rather than to the government of the day."
 PDV_mo_spine3:0 "The Royal Arsenal"
 PDV_mo_spine3_desc:0 "The old arsenal at the capital is reopened, and the nobility is invited to pay for it."
 PDV_mo_spine4:0 "The Old Regiments"
 PDV_mo_spine4_desc:0 "The historic regiments are restored with their numbers, their colours and their entirely fictional traditions."
 PDV_mo_spine5:0 "The King's Army"
 PDV_mo_spine5_desc:0 "An army that is small, slow, beautifully turned out and completely certain of who it obeys."
 PDV_mo_spine6:0 "The Crown Restored"
 PDV_mo_spine6_desc:0 "The crown is restored in law as well as in fact, and the state is re-founded on a document nobody has read since 1815."
 PDV_mo_final:0 "The Old Order Endures"
 PDV_mo_final_desc:0 "The crown has survived the century that was supposed to end it, and intends to survive the next one too."
