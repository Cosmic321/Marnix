 PDV_fa_c3_3:0 "The Civil War"
 PDV_fa_c3_3_desc:0 "The party's columns reach the capital at four in the morning. By six the leadership of the Directorate is dead, the provinces have declared for themselves, and the communists have raised a rival government in the south."
 PDV_fa_c3_4:0 "Renderbosch Infiltration"
 PDV_fa_c3_4_desc:0 "Letters are exchanged with the neighbours, and some of them are answered."
 PDV_fa_c3_5:0 "The Anti-Comintern Pact"
