 VYR_militia_law:0 "The Militia Law"
 VYR_militia_law_desc:0 "Every household is enrolled, every rifle is registered, and the province becomes expensive to invade."
 PDV_the_directorate:0 "The Peoples Directorate"
 PDV_the_directorate_desc:0 "Vyratia is the largest country on the map and the least governed of the large ones: a directorate of committees, a party of clerks, and an army that has spent twenty years being told it is not trusted."
 PDV_four_roads:0 "Four Roads Out"
 PDV_four_roads_desc:0 "The Directorate can be reformed, constitutionalised, seized or restored. Nobody in the chamber says the last two out loud."
 PDV_cm_review:0 "The Party Reviews Its Line"
 PDV_cm_review_desc:0 "The purge lists are withdrawn, the informers are retired and the officers are told - for the first time in twenty years - that they are expected to give orders."
 PDV_cm_spine1:0 "Rebuild the Divisions"
 PDV_cm_spine1_desc:0 "The hollow formations are filled out with men, equipment and a training cycle that assumes they will be used."
 PDV_cm_spine2:0 "The War College Reopens"
 PDV_cm_spine2_desc:0 "Lectures in a building that has been a stable since 1931, delivered by men who were banned from it."
 PDV_cm_spine3:0 "Refit the Depots"
 PDV_cm_spine3_desc:0 "The depots are emptied, counted, and filled again with things that work."
 PDV_cm_spine4:0 "Officers of the Republic"
 PDV_cm_spine4_desc:0 "The last of the old suspicion is dropped from the establishment lists: a man may now be trusted with a map."
 PDV_cm_spine5:0 "An Army Without Excuses"
 PDV_cm_spine5_desc:0 "The army has equipment, officers and a doctrine. What it does not have is an excuse."
 PDV_cm_spine6:0 "The Red Army of Vyratia"
 PDV_cm_spine6_desc:0 "A staff college, a general plan and a country that no longer apologises for its own army."
 PDV_cm_final:0 "The Permanent Revolution"
 PDV_cm_final_desc:0 "The road does not end. It is extended, every year, by another congress and another plan."
 PDV_cm_c0_0:0 "Reopen the Pits"
 PDV_cm_c0_0_desc:0 "The committees reopens the small workshops of the interior, and the tax they pay stays in the province."
 PDV_cm_c0_1:0 "The Second Five Year Plan"
 PDV_cm_c0_1_desc:0 "The counting houses are told what the plan expects of them, and given a year to meet it."
 PDV_cm_c0_2:0 "Steel for the Republic"
 PDV_cm_c0_2_desc:0 "Iron from the eastern hills is smelted at home instead of being sold abroad as scrap."
 PDV_cm_c0_3:0 "Grain Requisitions"
 PDV_cm_c0_3_desc:0 "Grain is bought at a fixed price, stored in state granaries and released when the towns get restless."
 PDV_cm_c0_4:0 "The Workers' Bank"
 PDV_cm_c0_4_desc:0 "A state bank with one branch, one ledger and a great deal of authority over who gets credit."
 PDV_cm_c0_5:0 "Rail to the Interior"
 PDV_cm_c0_5_desc:0 "The line to the interior is finished, which makes the interior worth arguing about."
 PDV_cm_c0_6:0 "Heavy Industry First"
 PDV_cm_c0_6_desc:0 "Heavy plant before anything that can be worn or eaten."
 PDV_cm_c0_7:0 "The People's Economy"
 PDV_cm_c0_7_desc:0 "The economy is spoken of as a machine, and the people who work it are told that they own it."
 PDV_cm_c1_0:0 "The Literacy Campaign"
 PDV_cm_c1_0_desc:0 "Schools open in buildings that were churches, barracks or nothing at all."
 PDV_cm_c1_1:0 "Housing for the Works"
 PDV_cm_c1_1_desc:0 "Housing is built to a single plan, from a single material, in a single colour."
 PDV_cm_c1_2:0 "Free Clinics"
 PDV_cm_c1_2_desc:0 "A clinic in every district, staffed by people who have read one book and are very keen."
 PDV_cm_c1_3:0 "The Women's Committees"
 PDV_cm_c1_3_desc:0 "Committees for the women of the province, with real budgets and no real power."
 PDV_cm_c1_4:0 "Cadre Schools"
 PDV_cm_c1_4_desc:0 "A school for the people who will run the province after the people who founded it are dead."
 PDV_cm_c1_5:0 "The Party Press"
 PDV_cm_c1_5_desc:0 "One newspaper, printed on the province's own press, for the province's own good."
 PDV_cm_c1_6:0 "Canteens and Creches"
 PDV_cm_c1_6_desc:0 "Canteens, creches and a working day that ends when the notice says it does."
 PDV_cm_c1_7:0 "A Society of Equals"
 PDV_cm_c1_7_desc:0 "A society of equals, in the sense that everyone is equally watched."
 PDV_cm_c2_0:0 "Rifles for Everyone"
 PDV_cm_c2_0_desc:0 "Every district is told how many rifles it owes, and by when."
 PDV_cm_c2_1:0 "The Tank Works"
 PDV_cm_c2_1_desc:0 "One plant, one design, one shift that knows exactly what it is doing."
 PDV_cm_c2_2:0 "Artillery Doctrine"
 PDV_cm_c2_2_desc:0 "The guns are grouped, ranged and given a doctrine that is written down."
 PDV_cm_c2_3:0 "Mass Mobilisation"
 PDV_cm_c2_3_desc:0 "The whole population is enrolled, counted and given a place in the plan."
 PDV_cm_c2_4:0 "Political Commissars"
 PDV_cm_c2_4_desc:0 "Commissars are attached to every staff, and every staff is told why."
 PDV_cm_c2_5:0 "The Southern Forts"
 PDV_cm_c2_5_desc:0 "Concrete, guns and a clear line of fire along the southern approaches."
 PDV_cm_c2_6:0 "Partisan Networks"
 PDV_cm_c2_6_desc:0 "A network in the hills, in the towns and in the factories, waiting."
 PDV_cm_c2_7:0 "The Armed People"
 PDV_cm_c2_7_desc:0 "The people are armed, which is either the point or the problem."
 PDV_cm_c3_0:0 "An Embassy in the East"
 PDV_cm_c3_0_desc:0 "An embassy is opened, staffed and, more importantly, listened to."
 PDV_cm_c3_1:0 "Trade with the Soviets"
 PDV_cm_c3_1_desc:0 "Trade delegations arrive with samples, contracts and an interest in the railways."
 PDV_cm_c3_2:0 "The Border Question"
 PDV_cm_c3_2_desc:0 "The border question is raised again, politely, and then less politely."
 PDV_cm_c3_3:0 "The Party Congress"
 PDV_cm_c3_3_desc:0 "Delegates from every committee meet in the capital for nine days. The arguments are real, the votes are counted, and the losers go home to serve."
 PDV_cm_c3_4:0 "Solidarity Committees"
 PDV_cm_c3_4_desc:0 "Letters are exchanged with the neighbours, and some of them are answered."
 PDV_cm_c3_5:0 "Revolutionary Diplomacy"
 PDV_cm_c3_5_desc:0 "A pact is offered that costs nothing on paper and a great deal in practice."
 PDV_cm_c3_6:0 "The Balkan Question"
 PDV_cm_c3_6_desc:0 "The claims are printed in the newspapers before they are made in the chancelleries."
 PDV_cm_c3_7:0 "The World Revolution"
 PDV_cm_c3_7_desc:0 "The province takes its place in the world, and the world takes note."
 PDV_dm_review:0 "A Speech in the Chamber"
 PDV_dm_review_desc:0 "A parliamentary commission publishes the purge lists, the names of the informers and the names of the dead. The army is put under review on the same day, and every officer is told he may speak."
 PDV_dm_spine1:0 "The Purge Commission Reports"
 PDV_dm_spine1_desc:0 "The commission names names, and the army discovers that being investigated is not the same as being purged. Half the establishment lists are rewritten in a single week."
 PDV_dm_spine2:0 "The Army Answers to the Chamber"
 PDV_dm_spine2_desc:0 "Budgets published, promotions gazetted, and a defence committee that actually reads the papers. The last of the old staff corps retires, loudly."
 PDV_dm_spine3:0 "A Republic With an Army"
 PDV_dm_spine3_desc:0 "The army is refitted, inspected and paraded, and for the first time since 1931 nobody in the chamber is afraid of it."
 PDV_dm_spine4:0 "The Federal Constitution"
 PDV_dm_spine4_desc:0 "One document, four provinces and a division of powers that took nine months and nearly broke the convention twice."
 PDV_dm_spine5:0 "The Federal Courts"
 PDV_dm_spine5_desc:0 "Four provinces, four legal systems and one supreme court that none of them trust yet."
 PDV_dm_spine6:0 "The Federal Republic of Vyratia"
 PDV_dm_spine6_desc:0 "The republic is proclaimed in a building that used to belong to the party, in front of people who used to belong to it too."
 PDV_dm_final:0 "A Republic Like Any Other"
 PDV_dm_final_desc:0 "The republic settles into the boring business of surviving its own founding, which is the hardest thing it will ever do."
 PDV_dm_c0_0:0 "The Free Press"
 PDV_dm_c0_0_desc:0 "The chamber reopens the small workshops of the interior, and the tax they pay stays in the province."
 PDV_dm_c0_1:0 "A Budget the Chamber Can Read"
 PDV_dm_c0_1_desc:0 "The counting houses are told what the plan expects of them, and given a year to meet it."
 PDV_dm_c0_2:0 "The Provincial Bank"
 PDV_dm_c0_2_desc:0 "Iron from the eastern hills is smelted at home instead of being sold abroad as scrap."
 PDV_dm_c0_3:0 "Land to the Tenants"
 PDV_dm_c0_3_desc:0 "Grain is bought at a fixed price, stored in state granaries and released when the towns get restless."
 PDV_dm_c0_4:0 "The Cooperative Movement"
 PDV_dm_c0_4_desc:0 "A state bank with one branch, one ledger and a great deal of authority over who gets credit."
 PDV_dm_c0_5:0 "A Modern Tax Code"
 PDV_dm_c0_5_desc:0 "The line to the interior is finished, which makes the interior worth arguing about."
 PDV_dm_c0_6:0 "Public Works"
 PDV_dm_c0_6_desc:0 "Heavy plant before anything that can be worn or eaten."
 PDV_dm_c0_7:0 "The Merchant Economy"
 PDV_dm_c0_7_desc:0 "The economy is spoken of as a machine, and the people who work it are told that they own it."
