 SUN_seize:0 "Seize the Ministries"
 SUN_seize_desc:0 "There is no vote and no negotiation. The provincial offices are occupied before dawn, the files are taken, and the men who ran them are told to keep working or leave."
 SUN_arsenal:0 "Take the Arsenals"
 SUN_arsenal_desc:0 "The garrisons are disarmed by their own officers, and the rifles in the depots are counted by people who intend to use them."
 SUN_railways:0 "Command the Railways"
 SUN_railways_desc:0 "Whoever holds the junctions holds the province. The railway committees are dissolved and replaced by a transport commissariat with a rifle behind every desk."
 SUN_militia:0 "Call Up the Militia"
 SUN_militia_desc:0 "Every district is told how many men it owes and by when. The quotas are met because the alternative is being named in the next list."
 SUN_bank:0 "The Provincial Bank"
