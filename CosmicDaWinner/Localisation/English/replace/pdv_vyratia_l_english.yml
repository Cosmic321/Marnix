l_english:
 PDV_the_directorate:0 "The Peoples Directorate"
 PDV_the_directorate_desc:0 "Vyratia is the largest country on the map and the least governed of the large ones: a directorate of committees, a party of clerks, and an army that has spent twenty years being told it is not trusted."
 PDV_four_roads:0 "Four Roads Out of the Directorate"
 PDV_four_roads_desc:0 "The committees have run out of things to agree on. Four arguments are now being had in the same building, and only one of them can win."
 PDV_cm_review:0 "Reopen the Files"
 PDV_cm_review_desc:0 "The purged officers were never replaced, only watched. The committees agree to read the files again, which is not the same as admitting anything."
 PDV_cm_officers:0 "Let the Officers Return"
 PDV_cm_officers_desc:0 "Bars are lifted, ranks restored, and eleven men who have spent a decade counting freight are handed divisions."
 PDV_cm_unpurge:0 "Close the Purge"
 PDV_cm_unpurge_desc:0 "The Directorate announces that the purge was a misunderstanding, that the officers were always loyal, and that the matter is closed. Officers are once again allowed to hold opinions."
 PDV_cm_supply:0 "Restore the Supply Corps"
 PDV_cm_supply_desc:0 "A hollow army is not a matter of courage. It is a matter of boots, shells and whether anyone has counted them since 1931."
 PDV_cm_doctrine:0 "Rewrite the Doctrine"
 PDV_cm_doctrine_desc:0 "The old manuals described an army that no longer exists, written by men who no longer exist, for a war that everyone assumed would not happen."
 PDV_cm_general_staff:0 "A General Staff Again"
 PDV_cm_general_staff_desc:0 "Promotion by competence, at least on paper; on paper is where it has to start."
 PDV_cm_second_plan:0 "The Second Five Year Plan"
 PDV_cm_second_plan_desc:0 "The first plan built the factories. The second is supposed to build the things the factories were for."
 PDV_cm_heavy_plant:0 "Heavy Plant in the East"
 PDV_cm_heavy_plant_desc:0 "The southeastern belt has coal, rail and a workforce that has been told it is the future of the country since before it was born."
 PDV_cm_grain:0 "Feed the Directorate"
 PDV_cm_grain_desc:0 "The cities are fed on quotas from the north. The north has noticed, and has started to ask what it gets back."
 PDV_cm_party_renewal:0 "Renew the Party"
 PDV_cm_party_renewal_desc:0 "A party of clerks does not survive a decade of emergency by being right. It survives by being replaced, quietly, from within."
 PDV_cm_fleet:0 "A Fleet Worth the Coast"
 PDV_cm_fleet_desc:0 "Vyratia has more coastline than any three of its neighbours and a navy that could be described, charitably, as a coastguard with ambitions."
 PDV_cm_finish:0 "The Directorate Delivers"
 PDV_cm_finish_desc:0 "Six years of committees, five year plans and very patient men, and the largest country on the map finally functions."
 PDV_dm_speech:0 "Free Speech, On Paper"
 PDV_dm_speech_desc:0 "The decree permits criticism of the state, provided it is written in the correct form and submitted to the correct office. It is a start."
 PDV_dm_press:0 "A Licensed Press"
 PDV_dm_press_desc:0 "Three new papers are licensed. Two of them are permitted to be interesting."
 PDV_dm_assembly:0 "The Right of Assembly"
 PDV_dm_assembly_desc:0 "Parades need a permit. So do funerals, apparently. The permits are, at least, now issued by civilians."
 PDV_dm_courts:0 "Independent Courts"
 PDV_dm_courts_desc:0 "Judges are no longer appointed by the committees that investigate the people they try."
 PDV_dm_unions:0 "Free Trade Unions"
 PDV_dm_unions_desc:0 "The official unions are given a rival. The rival is smaller, angrier and, for the first time in twenty years, legal."
 PDV_dm_elections:0 "Elections, Genuinely"
 PDV_dm_elections_desc:0 "Two candidates per seat. The committees campaign as though they might lose, which is the strangest thing about it."
 PDV_dm_referendum:0 "The Referendum"
 PDV_dm_referendum_desc:0 "One question on one ballot: whether Vyratia is to be a republic of citizens or of committees. The answer is not close."
 PDV_dm_unpicked:0 "Unpick the Directorate"
 PDV_dm_unpicked_desc:0 "With an elected parliament in the room, the emergency powers of the last twenty years are repealed one at a time, in public, and read out as they go."
 PDV_dm_split:0 "The Federal Question"
 PDV_dm_split_desc:0 "The north wants nothing to do with the capital, the east wants nothing to do with the north, and the islands want nothing to do with anybody. The parliament decides that they are all correct."
 PDV_dm_federal_buffs:0 "The Federal Republic of Vyratia"
 PDV_dm_federal_buffs_desc:0 "What is left is smaller, richer and governed. Every ministry is now answerable to a parliament that meets in the same building and does not defer to it."
 PDV_dm_federal_army:0 "A Smaller, Better Army"
 PDV_dm_federal_army_desc:0 "Fewer divisions, all of them paid, all of them properly equipped, and none of them commanded by a man who was appointed for his loyalty."
 PDV_dm_federal_industry:0 "The Compact Economy"
 PDV_dm_federal_industry_desc:0 "With the north gone the republic keeps the plants, the ports and the tax base, and loses the quotas it was forever being asked to meet."
 PDV_fa_cells1:0 "The First Cells"
 PDV_fa_cells1_desc:0 "A dozen men in a back room in the industrial belt, agreeing with each other about everything."
 PDV_fa_cells2:0 "The Street Corner"
 PDV_fa_cells2_desc:0 "Meetings move outdoors, uniforms are worn in public, and the police are told to keep an eye on them rather than to stop them."
 PDV_fa_cells3:0 "The Factory Floor"
 PDV_fa_cells3_desc:0 "Foremen, ex-officers and the permanently angry: the movement finds its natural constituency in the plants that the plan forgot."
 PDV_fa_cells4:0 "The Veterans Leagues"
 PDV_fa_cells4_desc:0 "Men who fought for the Directorate and were demobilised into poverty are offered a new uniform and a better explanation."
 PDV_fa_cells5:0 "The Press Barons"
 PDV_fa_cells5_desc:0 "Two newspapers discover that the movement has a great many readers and a very simple message."
 PDV_fa_cells6:0 "The Southeast Answers"
 PDV_fa_cells6_desc:0 "The industrial belt declares that it has been carrying the country for twenty years and would like to be paid for it."
 PDV_fa_civil_war:0 "The March on the Capital"
 PDV_fa_civil_war_desc:0 "The columns come down the rail lines from the southeast. The Directorate has the numbers, the party has the factories and the element of surprise, and neither side intends to lose."
 PDV_fa_clear_the_rails:0 "Clear the Rail Junctions"
 PDV_fa_clear_the_rails_desc:0 "Whoever holds the junctions holds the war. The party holds three of them and is buying the rest with promises it does not intend to keep."
 PDV_fa_rebuild_towns:0 "Rebuild What We Broke"
 PDV_fa_rebuild_towns_desc:0 "The war went through the same towns twice. The party that started it is now handing out the bricks."
 PDV_fa_civil_damage:0 "End the Emergency Economy"
 PDV_fa_civil_damage_desc:0 "Rationing, requisition and the military courts are all wound down, except the courts, which are kept."
 PDV_fa_unpurge:0 "The Party Needs Officers"
 PDV_fa_unpurge_desc:0 "Men who were shot at by the Directorate for twenty years are now the only people who know how to run an army. They are forgiven, publicly."
 PDV_fa_hollow_army:0 "A National Army"
 PDV_fa_hollow_army_desc:0 "The new army is the old army with the politics reversed and the paperwork kept."
 PDV_fa_war_sunni:0 "Bring the North to Heel"
 PDV_fa_war_sunni_desc:0 "Sumni declared for the Directorate and then discovered it had declared for a corpse. The columns are sent to explain the situation."
 PDV_fa_war_barri:0 "The Industrial Belt"
 PDV_fa_war_barri_desc:0 "Barri has the factories, the workers and a provincial government that thinks it is a country. It will be a country again when it is part of one."
 PDV_fa_war_peoples:0 "The Last Committee"
 PDV_fa_war_peoples_desc:0 "The Peoples State is what is left of the Directorate: no leader, no capital, and a war it intends to fight from cellars."
 PDV_fa_reich:0 "The Vyratian Reich"
 PDV_fa_reich_desc:0 "One country, one party, one flag with rather more gold thread on it than the last one. The Directorate is formally abolished for the third time in a decade."
 PDV_mo_letters:0 "Letters to Vrettia"
 PDV_mo_letters_desc:0 "A courier carries a letter from a man in the capital to a house in Vrettia where the old royal family has been living on a stipend and its own dignity."
 PDV_mo_legitimists:0 "The Legitimist Circles"
 PDV_mo_legitimists_desc:0 "Half the officer corps can name the king's grandchildren, and the other half can name their debts. Both are useful."
 PDV_mo_church:0 "The Old Church"
 PDV_mo_church_desc:0 "The church was never abolished, only ignored. It has a great many parishes and a long memory for who attends."
 PDV_mo_salons:0 "The Salons"
 PDV_mo_salons_desc:0 "The wives of the industrialists and the widows of the old officer class have been holding the same conversation for twenty years. It is finally fashionable."
 PDV_mo_pamphlets:0 "Pamphlets by Post"
 PDV_mo_pamphlets_desc:0 "Nothing radical: only the argument that a country with a crown is a country that knows what it is. It is more persuasive than it should be."
 PDV_mo_coup:0 "The Restoration"
 PDV_mo_coup_desc:0 "The garrison is paraded, the radio station is taken by two lieutenants and a boy with a bicycle, and by the evening the Directorate has been replaced by a king who has not set foot in the country in nineteen years."
 PDV_mo_court:0 "Recall the Court"
 PDV_mo_court_desc:0 "The royal household returns in three ships and one very long train. The furniture from the old palace has been in a warehouse since 1919."
 PDV_mo_officers:0 "The King's Officers"
 PDV_mo_officers_desc:0 "Commissions are reissued under the crown, which is a legal formality and a very clear message."
 PDV_mo_civil_service:0 "The Old Civil Service"
 PDV_mo_civil_service_desc:0 "Clerks who served four regimes discover they have a fifth to serve, and that their pensions are in it."
 PDV_mo_purge_undo:0 "Rehabilitate the Purged"
 PDV_mo_purge_undo_desc:0 "The men the Directorate shot at are given their ranks, their back pay and, where possible, their old houses."
 PDV_mo_army_reform:0 "The Royal Army"
 PDV_mo_army_reform_desc:0 "It is the same army. It is called something else and its officers are now permitted to think."
 PDV_mo_crown_lands:0 "Crown Lands"
 PDV_mo_crown_lands_desc:0 "The old royal estates are returned and, in a gesture nobody expected, half of them are handed to the tenants."
 PDV_mo_industry:0 "The King and the Plants"
 PDV_mo_industry_desc:0 "The industrialists are offered titles and asked, politely, to keep the plants running."
 PDV_mo_general_staff:0 "A Staff Worth the Name"
 PDV_mo_general_staff_desc:0 "Doctrine, maps, and a college that is no longer a holding pen for the politically unreliable."
 PDV_mo_somharhem1:0 "Cousins in the North"
 PDV_mo_somharhem1_desc:0 "Somharhem is ruled by a family that married into Vyratia's three times. The court has decided that this is a basis for a treaty."
 PDV_mo_somharhem2:0 "A Royal Marriage, Of Sorts"
 PDV_mo_somharhem2_desc:0 "Two second cousins, one cathedral and a great deal of coverage in the newspapers of both countries."
 PDV_mo_somharhem3:0 "The Northern Entente"
 PDV_mo_somharhem3_desc:0 "A treaty of friendship, arbitration and mutual defence that Somharhem signs because it costs nothing and because the alternative is worse."
 PDV_mo_somharhem4:0 "The Elder Brother"
 PDV_mo_somharhem4_desc:0 "The treaty is amended in one clause: Vyratia may speak for Somharhem in matters of war and peace. Somharhem is invited to notice this."
 PDV_mo_somharhem_pact:0 "The Crown of the North"
 PDV_mo_somharhem_pact_desc:0 "Somharhem is offered the status of a protected kingdom: its own crown, its own parliament, and a foreign policy written in Vyratia."
 PDV_mo_cod_faction:0 "An Offer to the Duchy"
 PDV_mo_cod_faction_desc:0 "The Cornish Duchy is a monarchy that has spent four hundred years pretending it is not. Vyratia offers it a faction, on the understanding that monarchs are cheaper to work with than committees."
 PDV_mo_rbd:0 "Infiltrate Renderbosch"
 PDV_mo_rbd_desc:0 "The Duchy of Renderbosch is small, rich and governable by anyone who can buy its press. Vyratia buys its press."
 PDV_af_doctrine:0 "A Doctrine of Our Own"
 PDV_af_doctrine_desc:0 "The army has been issuing manuals written by other countries for twenty years. This one is written here, badly, by people who have actually fought."
 PDV_af_tanks:0 "The Armoured School"
 PDV_af_tanks_desc:0 "Tanks bought in ones and twos, kept running by mechanics who have learned to make parts, and a school that teaches one coherent idea instead of four."
 PDV_af_artillery:0 "Guns Before Glory"
 PDV_af_artillery_desc:0 "Artillery is the one arm the Directorate was ever any good at, because it is the one arm that cannot be purged for disloyalty."
 PDV_af_infantry:0 "The Infantry First"
 PDV_af_infantry_desc:0 "Rifles, boots, and enough of both that a division can be formed from the ones that are actually equipped."
 PDV_af_plants:0 "The Plants That Feed the Army"
 PDV_af_plants_desc:0 "Two military plants, no more: the country cannot afford the guns it would like to build."
 PDV_af_air:0 "An Air Arm"
 PDV_af_air_desc:0 "Not an air force: an arm of the army that happens to fly, and for now it will fly whatever it can buy."
 PDV_af_fighter:0 "Interceptors for the Cities"
 PDV_af_fighter_desc:0 "The cities are the only thing worth defending and the only thing that cannot be moved."
 PDV_af_ground_attack:0 "Ground Attack"
 PDV_af_ground_attack_desc:0 "The army has asked for aircraft that can hit a column on a road. It will get aircraft that can hit a road."
 PDV_nv_yards:0 "The Yards at the Coast"
 PDV_nv_yards_desc:0 "Vyratia has the coast and the timber. What it does not have is anything that floats and matters."
 PDV_nv_doctrine:0 "A Coastal Doctrine"
 PDV_nv_doctrine_desc:0 "The navy is not going to fight for the ocean. It is going to make the coast expensive."
 PDV_nv_destroyers:0 "Destroyers"
 PDV_nv_destroyers_desc:0 "Fast, cheap, and built to a design that three yards can actually produce."
 PDV_nv_cruisers:0 "Cruisers"
 PDV_nv_cruisers_desc:0 "One cruiser is a statement. Two is a navy."
 PDV_nv_subs:0 "The Silent Arm"
 PDV_nv_subs_desc:0 "Submarines are the cheapest way for a poor country to be inconvenient."
 PDV_nv_yard_two:0 "A Second Slipway"
 PDV_nv_yard_two_desc:0 "One more dockyard, and that is the last one the budget will bear."
 PDV_nv_marines:0 "Coastal Defence Regiments"
 PDV_nv_marines_desc:0 "Men who know every inlet on the coast, which is more than the general staff does."
 PDV_nv_trade:0 "Protect the Trade"
 PDV_nv_trade_desc:0 "A merchant marine that is worth more than the navy, and a navy that exists mostly to keep it afloat."

 # Vyratia: cosmetic tags, spirits, events, decisions and the splinter trees.
 PDV_FED:0 "Federal Republic of Vyratia"
 PDV_FED_DEF:0 "the Federal Republic of Vyratia"
 PDV_FED_ADJ:0 "Vyratian"
 PDV_REICH:0 "The Vyratian Reich"
 PDV_REICH_DEF:0 "the Vyratian Reich"
 PDV_REICH_ADJ:0 "Vyratian"

 PDV_rebuilt_staff:0 "A Rebuilt Staff"
 PDV_rebuilt_staff_desc:0 "Officers are appointed for competence again, and the ones who cannot be trusted with a division have been given desks with a view."
 PDV_civil_war_scars:0 "The Scars of the Civil War"
 PDV_civil_war_scars_desc:0 "Rail junctions, plants and three of the largest cities have been fought over twice. Nothing works and everybody remembers who started it."
 PDV_federal_republic:0 "The Federal Republic"
 PDV_federal_republic_desc:0 "A smaller country with a parliament that actually votes, a treasury that actually balances, and provinces that are allowed to disagree."
 PDV_reich:0 "The Vyratian Reich"
 PDV_reich_desc:0 "One country, one party, one flag with a great deal more gold thread on it than the last one."
 PDV_leaderless:0 "Leaderless"
 PDV_leaderless_desc:0 "The party's leadership was killed in a single night. What is left fights on without orders, without coordination and without any plan beyond the next week."
 PDV_peoples_defence:0 "A War Without a Front"
 PDV_peoples_defence_desc:0 "There is no line to hold and no capital to lose. The state fights from cellars, forests and the parts of the country that no army has ever bothered to occupy."
 PDV_rbd_infiltration:0 "Vyratian Money"
 PDV_rbd_infiltration_desc:0 "The newspapers of Renderbosch have new owners, and the new owners have a great deal of sympathy for the crown."

 pdv_vyratia.1.t:0 "The Night of the Long Knives"
 pdv_vyratia.1.d:0 "The party's columns reached the capital at four in the morning, and by six the entire leadership of the Directorate had been shot in a courtyard that is not on any map. What is left of the communist state has an army, a territory and no head."
 pdv_vyratia.1.a:0 "There is nobody left to negotiate with."
 pdv_vyratia.2.t:0 "The Country Comes Apart"
 pdv_vyratia.2.d:0 "Thirty days of fighting and the map has stopped making sense. The north has declared for nobody, the islands have declared for themselves, and two new statelets have appeared in the industrial belt - one of them flying a flag nobody has seen before."
 pdv_vyratia.2.a:0 "Let them go. They will come back."
 pdv_vyratia.3.t:0 "An Offer from the South"
 pdv_vyratia.3.d:0 "Vyratia has offered Somharhem the status of a protected kingdom: its own crown, its own parliament, and a foreign policy written in a language it does not speak."
 pdv_vyratia.3.a:0 "We accept the crown's protection."
 pdv_vyratia.3.b:0 "We are not anybody's protected kingdom."

 PDV_invite_faction_category:0 "The Crowned Diplomacy"
 PDV_invite_rbd:0 "Invite Renderbosch to the Faction"
 PDV_invite_rbd_desc:0 "Renderbosch has been drifting towards the crown for years, helped along by Vyratian money. It is time to make the arrangement formal."

 SUN_take_stock:0 "Take Stock"
 SUN_take_stock_desc:0 "What is left of the province, and who is going to count it."
 SUN_the_councils:0 "The Provincial Councils"
 SUN_the_councils_desc:0 "A government that meets in a real building and can be argued with."
 SUN_the_question:0 "The Question of Vyratia"
 SUN_the_question_desc:0 "Everybody knows the province cannot stand alone forever. Nobody wants to be the one who says so first."
 SUN_the_border:0 "Mark the Border"
 SUN_the_border_desc:0 "Posts, maps and a customs house, so that at least the argument is about something."
 SUN_rebuild:0 "Rebuild the Towns"
 SUN_rebuild_desc:0 "The war went through twice. The second time was worse."
 SUN_a_plant:0 "One Plant"
 SUN_a_plant_desc:0 "Not an industry: a plant, a boiler and a shift that knows what it is doing."
 SUN_the_treasury:0 "A Treasury"
 SUN_the_treasury_desc:0 "A province that prints its own scrip is not a province that stays in a union for long."
 SUN_the_militia:0 "The Militia"
 SUN_the_militia_desc:0 "Every village a section, every section a rifle, and nobody entirely sure who they belong to."
 SUN_the_garrison:0 "The Garrison"
 SUN_the_garrison_desc:0 "A small army with good ground and nowhere to retreat to."
 SUN_the_schools:0 "Open the Schools"
 SUN_the_schools_desc:0 "Reading, arithmetic and a version of the last ten years that fits in one lesson."
 SUN_the_road:0 "One More Plant"
 SUN_the_road_desc:0 "Inland and without a port, the province has exactly one way to matter: make something the capital needs."
 SUN_the_treaty:0 "A Treaty or Two"
 SUN_the_treaty_desc:0 "The province will sign with anyone who recognises it, which is currently two countries and a shipping line."
 SUN_the_soldiers_pay:0 "Pay the Soldiers"
 SUN_the_soldiers_pay_desc:0 "An army that is paid on time is an army that does not have opinions about the government."
 SUN_the_old_elite:0 "The Old Families"
 SUN_the_old_elite_desc:0 "Every province has them, and every province has to decide whether to use them or replace them."
 SUN_the_harvest:0 "Bring In the Harvest"
 SUN_the_harvest_desc:0 "Whatever else happens, the province eats this winter or it does not have a government."
 SUN_the_question_again:0 "The Question of Vyratia, Again"
 SUN_the_question_again_desc:0 "The council has run out of other business."
 SUN_the_crown:0 "A Crown in the Room"
 SUN_the_crown_desc:0 "The royalists have a candidate and the candidate has a great many opinions about ports."
 SUN_the_offer:0 "The Offer from the Capital"
 SUN_the_offer_desc:0 "Vyratia has sent an envoy with a treaty and a photograph of the same envoy in uniform."
 SUN_the_vote:0 "Put It to the Vote"
 SUN_the_vote_desc:0 "A referendum nobody outside the province will recognise and everyone inside it will remember."
 SUN_rejoin:0 "Rejoin Vyratia"
 SUN_rejoin_desc:0 "Sumni puts the question one last time."
