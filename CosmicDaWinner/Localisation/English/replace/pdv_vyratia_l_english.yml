 AFR_rebuild:0 "Rebuild the Towns"
 AFR_rebuild_desc:0 "The war went through twice. The second time was worse."
 AFR_a_plant:0 "Repair the Harbour"
 AFR_a_plant_desc:0 "The islands live off the water and the water has been mined since 1936. Repairing the harbour is the whole economy."
 AFR_the_treasury:0 "A Treasury"
 AFR_the_treasury_desc:0 "A province that prints its own scrip is not a province that stays in a union for long."
 AFR_the_militia:0 "The Militia"
