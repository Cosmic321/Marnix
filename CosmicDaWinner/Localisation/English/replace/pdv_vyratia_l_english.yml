 PDV_the_directorate:0 "The Peoples Directorate"
 PDV_the_directorate_desc:0 "Vyratia is the largest country on the map and the least governed of the large ones: a directorate of committees, a party of clerks, and an army that has spent twenty years being told it is not trusted."
 PDV_four_roads:0 "Four Roads Out"
 PDV_four_roads_desc:0 "The Directorate can be reformed, constitutionalised, seized or restored. Nobody in the chamber says the last two out loud, and everybody has counted the colonels."
 PDV_cm_review:0 "The Party Reviews Its Line"
 PDV_cm_review_desc:0 "The commission withdraws the purge lists, retires the informers and hands the officer corps back its authority. Not out of mercy: a state that has spent twenty years distrusting its colonels has spent twenty years without an army."
 PDV_cm_spine1:0 "Rebuild the Divisions"
 PDV_cm_spine1_desc:0 "The hollow cadres are filled with men, rifles and a training cycle that assumes they will be used. The party wants the army loyal, but it wants it whole first."
 PDV_cm_spine2:0 "The War College Reopens"
 PDV_cm_spine2_desc:0 "Lectures return to a building that has been a stable since 1931. The men teaching were banned from it, which is exactly why they are the ones who know what to teach."
 PDV_cm_spine3:0 "Refit the Depots"
 PDV_cm_spine3_desc:0 "Every depot is emptied, counted and filled again with things that work. The country turns out not to be short of equipment, only short of an inventory."
 PDV_cm_spine4:0 "Officers of the Republic"
 PDV_cm_spine4_desc:0 "A man may be trusted with a map again. The establishment lists are rewritten around competence and the last of the 1931 suspicion is struck out of them."
 PDV_cm_spine5:0 "An Army Without Excuses"
 PDV_cm_spine5_desc:0 "Equipment, officers and a doctrine, all at once. The party's line is that the army no longer has an excuse, and it says so in every garrison."
 PDV_cm_spine6:0 "The Red Army of Vyratia"
 PDV_cm_spine6_desc:0 "A staff college, a general plan and a country that has stopped apologising for its own army. The party intends to be obeyed by that army, not by the ministries."
 PDV_cm_final:0 "The Permanent Revolution"
 PDV_cm_final_desc:0 "The party declares the revolution unfinished and the state an instrument for finishing it. At home that means nobody may settle; abroad it means no border is final."
 PDV_cm_c0_0:0 "Reopen the Pits"
 PDV_cm_c0_0_desc:0 "The small pits of the interior were shut in 1932 to save a budget nobody now remembers. They reopen first because coal is the one thing the party can produce without asking anyone abroad."
 PDV_cm_c0_1:0 "The Second Five Year Plan"
 PDV_cm_c0_1_desc:0 "The first plan built the plants; the second is meant to make them pay. Every counting house gets a quota, a year, and a clear idea of which of the two gets blamed."
 PDV_cm_c0_2:0 "Steel for the Republic"
 PDV_cm_c0_2_desc:0 "Eastern ore has been sold abroad as scrap for a decade because the furnaces were in the wrong province. The furnaces move to the ore, and the provinces learn who owns the future."
 PDV_cm_c0_3:0 "Grain Requisitions"
 PDV_cm_c0_3_desc:0 "The towns vote with their stomachs and the countryside with its grain. A fixed price and a state granary answer both, and neither is popular."
 PDV_cm_c0_4:0 "The Workers' Bank"
 PDV_cm_c0_4_desc:0 "Credit has belonged to men who lend to their cousins. One bank with one ledger decides who builds, and more usefully, who quietly does not."
 PDV_cm_c0_5:0 "Rail to the Interior"
 PDV_cm_c0_5_desc:0 "The interior has coal, timber and no way to move either. The line comes before the plan that will use it, on the theory that a plan without a railway is a pamphlet."
 PDV_cm_c0_6:0 "Heavy Industry First"
 PDV_cm_c0_6_desc:0 "Plant before boots, deliberately. Boots wear out; a country that can build a furnace can build what the furnace makes, and build it again."
 PDV_cm_c0_7:0 "The People's Economy"
 PDV_cm_c0_7_desc:0 "Mines, mills, credit and rails in one ledger. The party finally has an economy it can plan, rather than an economy it has to argue with."
 PDV_cm_c1_0:0 "The Literacy Campaign"
 PDV_cm_c1_0_desc:0 "An army that cannot read a timetable is a militia. Schools open in churches, barracks and buildings that were nothing, because the party needs clerks more than it needs empty churches."
 PDV_cm_c1_1:0 "Housing for the Works"
 PDV_cm_c1_1_desc:0 "The mills have workers and the workers have nowhere to sleep. Housing goes up to one plan in one material: faster than building it well, and everyone involved knows which."
 PDV_cm_c1_2:0 "Free Clinics"
 PDV_cm_c1_2_desc:0 "A district that loses a third of its children to fever loses a third of its workforce. The clinics are cheap, popular, and quietly booked as industrial policy."
 PDV_cm_c1_3:0 "The Women's Committees"
 PDV_cm_c1_3_desc:0 "The committees get real budgets and no real power, on purpose. They cost little and they give the party an answer whenever a town asks who was supposed to meet the plan."
 PDV_cm_c1_4:0 "Cadre Schools"
 PDV_cm_c1_4_desc:0 "The founders are old and the party has too few people who can run anything. A school is cheaper than the purges that used to solve the same problem."
 PDV_cm_c1_5:0 "The Party Press"
 PDV_cm_c1_5_desc:0 "One newspaper, printed on the province's own press. The point is not that people believe it, but that the version of the plan reaching the village is the party's version."
 PDV_cm_c1_6:0 "Canteens and Creches"
 PDV_cm_c1_6_desc:0 "A worker queueing for bread is not at the bench. The canteen and the creche are described as welfare and paid for out of the industrial budget, which is what they are."
 PDV_cm_c1_7:0 "A Society of Equals"
 PDV_cm_c1_7_desc:0 "The party's last claim to rule is that the clerk and the miner are now the same kind of citizen. It spends what it takes to make that true enough to photograph."
 PDV_cm_c2_0:0 "Rifles for Everyone"
 PDV_cm_c2_0_desc:0 "Every district is told how many rifles it owes and by what date. A militia is not a joke when there is an army next door, and the army knows the militia is being counted."
 PDV_cm_c2_1:0 "The Tank Works"
 PDV_cm_c2_1_desc:0 "One plant, one design, one shift, in the province that has the steel and the grievance. The army asked for four designs; the party gave it one that works."
 PDV_cm_c2_2:0 "Artillery Doctrine"
 PDV_cm_c2_2_desc:0 "Guns grouped, ranged and written down. The Directorate was always good at artillery because gunners are hard to accuse of politics, and the party keeps what worked."
 PDV_cm_c2_3:0 "Mass Mobilisation"
 PDV_cm_c2_3_desc:0 "The whole population is enrolled, counted and given a place in the plan. It is efficient, and it means the state knows where everyone is when the order comes."
 PDV_cm_c2_4:0 "Political Commissars"
 PDV_cm_c2_4_desc:0 "A commissar at every staff, and every staff told exactly why. The party remembers 1931 too well to hand the army back without a witness in the room."
 PDV_cm_c2_5:0 "The Southern Forts"
 PDV_cm_c2_5_desc:0 "Concrete and guns along the southern approaches. The forts are ugly, permanent, and impossible to explain away as a defensive gesture, which is the point."
 PDV_cm_c2_6:0 "Partisan Networks"
 PDV_cm_c2_6_desc:0 "Cells in the hills, the towns and the factories, trained to fight on after the front has gone past them. The cheapest available answer to being invaded."
 PDV_cm_c2_7:0 "The Armed People"
 PDV_cm_c2_7_desc:0 "Every worker a rifleman, every village a strongpoint. It makes the country expensive to occupy and, the party privately notes, expensive to govern."
 PDV_cm_c3_0:0 "An Embassy in the East"
 PDV_cm_c3_0_desc:0 "An embassy is opened, staffed, and more usefully listened to. The party's first foreign policy is not a doctrine but a set of ears."
 PDV_cm_c3_1:0 "Trade with the Soviets"
 PDV_cm_c3_1_desc:0 "Delegations arrive with samples, contracts and an interest in the railways. The party buys machines it cannot build and sells the one thing it has too much of: ore."
 PDV_cm_c3_2:0 "The Border Question"
 PDV_cm_c3_2_desc:0 "The border is raised politely, and then less politely. Every neighbour is told the question exists, so that no future settlement can pretend it was settled."
 PDV_cm_c3_3:0 "The Party Congress"
 PDV_cm_c3_3_desc:0 "Nine days in the capital, with real arguments and counted votes. The losers go home and serve, which is the only reason the winners can afford to lose next time."
 PDV_cm_c3_4:0 "Solidarity Committees"
 PDV_cm_c3_4_desc:0 "Letters to the neighbouring parties, some of them answered. Internationalism is cheap at this stage: it costs paper and buys an argument."
 PDV_cm_c3_5:0 "Revolutionary Diplomacy"
 PDV_cm_c3_5_desc:0 "A pact is offered that costs nothing on paper and a great deal in practice. The party signs because a treaty with a revolutionary state is a claim to be one."
 PDV_cm_c3_6:0 "The Balkan Question"
 PDV_cm_c3_6_desc:0 "The party takes an interest in the small states to the south, where the great powers are not looking. An interest taken early is a claim made cheaply."
 PDV_cm_c3_7:0 "The World Revolution"
 PDV_cm_c3_7_desc:0 "The party announces that Vyratia is a base, not a homeland. It is a promise it cannot keep and cannot stop making, and the army is told to be ready for either."
 PDV_dm_review:0 "A Speech in the Chamber"
 PDV_dm_review_desc:0 "The commission publishes the purge lists, the informers and the dead, and puts the army under review the same day. The chamber's arithmetic is simple: a country cannot be governed by people it will not name."
 PDV_dm_spine1:0 "The Purge Commission Reports"
 PDV_dm_spine1_desc:0 "Names are named, and the army discovers that being investigated is not the same as being purged. Half the establishment lists are rewritten in a week, faster than the officers expected."
 PDV_dm_spine2:0 "The Army Answers to the Chamber"
 PDV_dm_spine2_desc:0 "Budgets published, promotions gazetted, a defence committee that reads the papers. The last of the old staff corps retires loudly, and the chamber lets it."
 PDV_dm_spine3:0 "A Republic With an Army"
 PDV_dm_spine3_desc:0 "The army is refitted, inspected and paraded, and for the first time since 1931 nobody in the chamber is afraid of it. That is the whole achievement, and it is enough."
 PDV_dm_spine4:0 "The Federal Constitution"
 PDV_dm_spine4_desc:0 "One document, four provinces, a division of powers that took nine months and nearly broke the convention twice. It survives because every province got something it can point at."
 PDV_dm_spine5:0 "The Federal Courts"
 PDV_dm_spine5_desc:0 "Four provinces, four legal systems, one supreme court none of them trust yet. The court's first job is to be boring, because a court that makes news is a court at war."
 PDV_dm_spine6:0 "The Federal Republic of Vyratia"
 PDV_dm_spine6_desc:0 "The republic is proclaimed in a building that used to belong to the party, before people who used to belong to it. The symbolism is deliberate and slightly cruel."
 PDV_dm_final:0 "A Republic Like Any Other"
 PDV_dm_final_desc:0 "No mission, no revolution, no destiny: a state that balances its books and holds elections on time. The chamber considers this the most radical thing it has done."
 PDV_dm_c0_0:0 "The Free Press"
 PDV_dm_c0_0_desc:0 "A press that may print the purge lists is a press that may print anything. The chamber decides the risk of scandal is smaller than the cost of nobody knowing anything."
 PDV_dm_c0_1:0 "A Budget the Chamber Can Read"
 PDV_dm_c0_1_desc:0 "Rows, totals, and a line for what the army actually spends. Publishing it is the first time the chamber can argue with the treasury using the treasury's own numbers."
 PDV_dm_c0_2:0 "The Provincial Bank"
 PDV_dm_c0_2_desc:0 "The provinces have been borrowing from the capital at rates set in the capital. A provincial bank with its own credit is the cheapest federalism on offer."
 PDV_dm_c0_3:0 "Land to the Tenants"
 PDV_dm_c0_3_desc:0 "The great estates are broken up and sold to the people who farm them, at a price they can pay. The chamber does the arithmetic twice, because the nobility will do it once, loudly."
 PDV_dm_c0_4:0 "The Cooperative Movement"
 PDV_dm_c0_4_desc:0 "Credit and storage in the hands of the people who use them. Cooperatives are slower than a state bank and much harder to seize, which is why they are chosen."
 PDV_dm_c0_5:0 "A Modern Tax Code"
 PDV_dm_c0_5_desc:0 "One code, published, with rates nobody has to guess. The chamber's theory is that people evade a tax they cannot read and pay one that they can."
 PDV_dm_c0_6:0 "Public Works"
 PDV_dm_c0_6_desc:0 "Bridges, drains and roads built by the state for wages rather than for contracts. Expensive, popular, and the only programme that reaches the countryside in winter."
 PDV_dm_c0_7:0 "The Merchant Economy"
 PDV_dm_c0_7_desc:0 "A country with a coast should have ships. Freight pays for the navy that protects it, and the treasury stops having to choose between the two."
 PDV_dm_c1_0:0 "Universal Schooling"
 PDV_dm_c1_0_desc:0 "Every child, every district, in one language and four accents. The chamber pays for it because a republic that cannot read its own laws is a republic of rumours."
 PDV_dm_c1_1:0 "The Health Service"
 PDV_dm_c1_1_desc:0 "Clinics funded from the centre and run by the provinces. The compromise is inefficient and survives, mostly because nobody can agree who would run it better."
 PDV_dm_c1_2:0 "Housing the Workers"
 PDV_dm_c1_2_desc:0 "The mills have workers and the workers have nowhere to live. The republic builds slowly, to a standard, and is criticised for both."
 PDV_dm_c1_3:0 "The Women's Vote"
 PDV_dm_c1_3_desc:0 "The franchise is extended and the chamber's arithmetic changes overnight. Half the old parties discover they had been representing a minority of the country."
 PDV_dm_c1_4:0 "Trade Union Rights"
 PDV_dm_c1_4_desc:0 "Unions legal, strikes legal, and a government that has to negotiate. The chamber accepts it because a country that can strike without shooting is cheaper to run."
 PDV_dm_c1_5:0 "The Civic Associations"
 PDV_dm_c1_5_desc:0 "Choirs, clubs, cooperatives and burial societies, registered and left alone. The republic's idea of itself needs people who join things voluntarily."
 PDV_dm_c1_6:0 "A Free University"
 PDV_dm_c1_6_desc:0 "The university gets a charter, a budget and the right to be inconvenient. The chamber funds it out of the education vote and reads its pamphlets with alarm."
 PDV_dm_c1_7:0 "The Open Society"
 PDV_dm_c1_7_desc:0 "A press, a parliament, a court and a university that all contradict each other in public. The republic calls this stability and means it."
 PDV_dm_c2_0:0 "A Smaller Army"
 PDV_dm_c2_0_desc:0 "The army is cut to what the budget can actually pay for, and told the truth about it. A small army that works beats a large one owed three months' wages."
 PDV_dm_c2_1:0 "The National Guard"
 PDV_dm_c2_1_desc:0 "A territorial force under the provinces, not the general staff. Cheap, local, and it means the capital cannot be taken by a single column again."
 PDV_dm_c2_2:0 "Officer Examinations"
 PDV_dm_c2_2_desc:0 "Promotion by examination, sat by everyone, marked blind. The old families object on principle, which is taken as evidence the examinations work."
 PDV_dm_c2_3:0 "A Modern Staff"
 PDV_dm_c2_3_desc:0 "A staff that plans instead of memorising. The republic hires the officers the commission cleared and gives them tables, maps and permission to disagree."
 PDV_dm_c2_4:0 "The Defence Committee"
 PDV_dm_c2_4_desc:0 "A committee of the chamber with the army's plans in front of it. Civilian control is not a slogan here; it is four people who can read a mobilisation table."
 PDV_dm_c2_5:0 "The Air Militia"
 PDV_dm_c2_5_desc:0 "A flying club with a military budget. Cheap pilots, cheap aircraft, and a country that spots an intrusion before the general staff does."
 PDV_dm_c2_6:0 "The Coastal Watch"
 PDV_dm_c2_6_desc:0 "Lookouts, launches and a telephone line down the coast. The navy cannot be everywhere, so the fishermen are paid to be where it is not."
 PDV_dm_c2_7:0 "The Republic in Arms"
 PDV_dm_c2_7_desc:0 "Mobilisation plans that assume the country will be defended by its citizens, not delivered by its officers. The chamber signs it and hopes never to test it."
 PDV_dm_c3_0:0 "The Neighbourhood Policy"
 PDV_dm_c3_0_desc:0 "Embassies in the small states first, before the great ones. The republic's doctrine is that a country with no weight should have many friends."
 PDV_dm_c3_1:0 "Trade with Somharhem"
 PDV_dm_c3_1_desc:0 "Treaties of commerce with the southern kingdom, signed while the border question is still open. Trade first is how the republic makes a border boring."
 PDV_dm_c3_2:0 "The Island Question"
 PDV_dm_c3_2_desc:0 "An island nobody has garrisoned since 1911 is claimed, charted and given a customs post. Small enough to be settled, large enough to matter."
 PDV_dm_c3_3:0 "The Federal Settlement"
 PDV_dm_c3_3_desc:0 "Four provinces get their own governments, budgets and flags; the republic keeps the railways, the army and the foreign ministry. Everyone goes home claiming victory."
 PDV_dm_c3_4:0 "Letters to Renderbosch"
 PDV_dm_c3_4_desc:0 "Correspondence with the neighbouring court, polite and constant. A neighbour you talk to weekly is a neighbour you do not mobilise against."
 PDV_dm_c3_5:0 "The League of Small Nations"
 PDV_dm_c3_5_desc:0 "A league of states too small to be feared, with a secretariat, a court and no army. It cannot stop a war; it can make one harder to start quietly."
 PDV_dm_c3_6:0 "Neutral Ground"
 PDV_dm_c3_6_desc:0 "The republic offers itself as a place where other people's disputes can be settled. Neutrality is a policy, not a virtue, and it is priced accordingly."
 PDV_dm_c3_7:0 "The Vyratian Century"
 PDV_dm_c3_7_desc:0 "The republic begins to speak of a century of its own, quietly and in trade figures. It is the least aggressive form of ambition the chamber could find."
 PDV_fa_review:0 "The Cells Take Root"
 PDV_fa_review_desc:0 "The party's cells are in the works, the barracks and the docks, and they have stopped hiding. The Directorate's answer has always been a committee; the party's answer is a column."
 PDV_fa_spine1:0 "The New Divisions"
 PDV_fa_spine1_desc:0 "The army is not reformed, it is rebuilt around men the party trusts. Loyalty is checked before competence, and the party insists the order is deliberate."
 PDV_fa_spine2:0 "The War Academy"
 PDV_fa_spine2_desc:0 "A school for officers who will not question the state that taught them. The curriculum is short, physical and entirely about obedience under fire."
 PDV_fa_spine3:0 "Steel and Discipline"
 PDV_fa_spine3_desc:0 "Depots filled, training brutal, results published. The party understands that a nation is convinced by visible strength, so it makes the strength visible."
 PDV_fa_spine4:0 "The Blackshirt Cadres"
 PDV_fa_spine4_desc:0 "The militia is folded into the army and told it was always the army. The generals are told the same thing, more firmly."
 PDV_fa_spine5:0 "The Reich Reborn"
 PDV_fa_spine5_desc:0 "The last hollowness is hammered out of the army: depots, schools and plans that run past next Tuesday. The party wants a state that can be expected to last."
 PDV_fa_spine6:0 "The Vyratian Reich"
 PDV_fa_spine6_desc:0 "Renamed, reflagged and re-founded before the ink on the constitution dries. The point of the renaming is that nobody can remember what it was called before."
 PDV_fa_final:0 "The Thousand Year Reich"
 PDV_fa_final_desc:0 "The Reich announces its own permanence and immediately begins building monuments to prove it. Permanence, in practice, requires a great deal of concrete."
 PDV_fa_c0_0:0 "The Corporate State"
 PDV_fa_c0_0_desc:0 "Industry is organised into corporations that bargain with the state and never with each other. Strikes become illegal at exactly the moment they become unnecessary."
 PDV_fa_c0_1:0 "The Arms Budget"
 PDV_fa_c0_1_desc:0 "The army gets a budget it can plan with, not a figure it must argue for. A state that cannot afford an army will not have to worry about anything else for long."
 PDV_fa_c0_2:0 "Autarky"
 PDV_fa_c0_2_desc:0 "Imports cut to what cannot be made at home, which turns out to be a short list and an expensive one. The party prefers an expensive economy to a dependent one."
 PDV_fa_c0_3:0 "The Eastern Plantations"
 PDV_fa_c0_3_desc:0 "The east is organised into large estates worked to a plan. Efficient in the way a barracks is efficient, and about as popular."
 PDV_fa_c0_4:0 "The Party Bank"
 PDV_fa_c0_4_desc:0 "Credit controlled by the party and lent to the party's projects. The bankers who object are given directorships in the corporations, where they can object less publicly."
 PDV_fa_c0_5:0 "The Motorways"
 PDV_fa_c0_5_desc:0 "Roads built for columns, not for commerce, and paid for out of the commerce budget. The highways are designed to put an army on the border in a day."
 PDV_fa_c0_6:0 "The War Economy"
 PDV_fa_c0_6_desc:0 "The whole economy is put on a war footing before there is a war. The party argues the transition is cheaper if it is made early and quietly."
 PDV_fa_c0_7:0 "The Thousand Year Industry"
 PDV_fa_c0_7_desc:0 "The economy is described as a machine the people own, and the people are told they work it. Ownership, in this formulation, is a duty rather than a right."
 PDV_fa_c1_0:0 "The Youth Movement"
 PDV_fa_c1_0_desc:0 "Boys and girls in uniform, marching, camping and being counted. The party wants the next generation to remember exactly who organised its childhood."
 PDV_fa_c1_1:0 "The Party Schools"
 PDV_fa_c1_1_desc:0 "Schools that teach the state's version of history, arithmetic and obedience. The results are examined, ranked and published, which is the only part the parents respect."
 PDV_fa_c1_2:0 "The Press Law"
 PDV_fa_c1_2_desc:0 "One law, one press, one line. The party does not pretend the newspapers are free; it pretends they are the voice of the nation, which is cheaper to enforce."
 PDV_fa_c1_3:0 "Mother and Child"
 PDV_fa_c1_3_desc:0 "Medals, allowances and clinics for mothers, and a state that has decided the birth rate is a strategic resource. Popular, and completely cynical."
 PDV_fa_c1_4:0 "The Labour Front"
 PDV_fa_c1_4_desc:0 "One union, one wage scale, no right to strike. The party buys the workforce with canteens, holidays and the certainty that no competitor will undercut its wages."
 PDV_fa_c1_5:0 "The Village Movement"
 PDV_fa_c1_5_desc:0 "The countryside is organised into cells, cooperatives and rallies. The party needs the villages to belong to something and does not much care which."
 PDV_fa_c1_6:0 "The New Man"
 PDV_fa_c1_6_desc:0 "Canteens, creches, sport and a working day that ends when the notice says. The new man is fitter, better fed and watched more closely than the old one."
 PDV_fa_c1_7:0 "The National Community"
 PDV_fa_c1_7_desc:0 "A society of equals, in the sense that everyone is equally watched. The party calls it unity, and the word does a great deal of work in every speech."
 PDV_fa_c2_0:0 "The Stormtroops"
 PDV_fa_c2_0_desc:0 "Strong-arm columns made into a formation and given a uniform. The generals are told they are auxiliary; the columns are told something else."
 PDV_fa_c2_1:0 "The Tank Corps"
 PDV_fa_c2_1_desc:0 "Tanks concentrated rather than scattered, and a corps that exists to be a fist. The party has read the same foreign pamphlets as everyone else and drawn a harder conclusion."
 PDV_fa_c2_2:0 "The Bomber Wing"
 PDV_fa_c2_2_desc:0 "Bombers bought before fighters, on the theory that a country which threatens cities need not defend its own. The theory is untested."
 PDV_fa_c2_3:0 "The Officer Caste"
 PDV_fa_c2_3_desc:0 "Officers get status, land and the right to be obeyed. The party makes them a caste because a caste, unlike a profession, can be held responsible."
 PDV_fa_c2_4:0 "Fortress Vyratia"
 PDV_fa_c2_4_desc:0 "Concrete, guns and a doctrine that assumes the country will be attacked from the south. The forts are a statement as much as a defence."
 PDV_fa_c2_5:0 "The Militia Law"
 PDV_fa_c2_5_desc:0 "Every man liable, every district armed, every rifle registered. The party wants a nation that can be mobilised in a week and counted in a day."
 PDV_fa_c2_6:0 "The Reichswehr"
 PDV_fa_c2_6_desc:0 "A network in the hills, the towns and the factories, waiting for orders it has already been given. The party's army has a shadow, and the shadow is the party."
 PDV_fa_c2_7:0 "Total War"
 PDV_fa_c2_7_desc:0 "The people are armed, which is either the point or the problem. The party settles on calling it the point and orders more rifles."
 PDV_fa_c3_0:0 "The Southern Question"
 PDV_fa_c3_0_desc:0 "The south is spoken of as a question, which is the polite form of a claim. The newspapers are briefed before the chancelleries are."
 PDV_fa_c3_1:0 "The Somharhem Protectorate"
 PDV_fa_c3_1_desc:0 "Somharhem is offered protection: its own crown, its own parliament, and a foreign policy in a language it does not speak. The offer is not designed to be refused."
 PDV_fa_c3_2:0 "The Cornish Faction"
 PDV_fa_c3_2_desc:0 "Money and printers go to the party's friends in Cornwall. The party's foreign policy is to own a movement abroad before it owns a border."
 PDV_fa_c3_3:0 "The Civil War"
 PDV_fa_c3_3_desc:0 "Columns reach the capital at four in the morning; by six the Directorate is dead, the provinces have declared for themselves and the communists have raised a government in the north-west. The party gains a country and loses a third of it."
 PDV_fa_c3_4:0 "Renderbosch Infiltration"
 PDV_fa_c3_4_desc:0 "Newspapers in Renderbosch get new owners with old sympathies. The party buys the country next door one masthead at a time."
 PDV_fa_c3_5:0 "The Anti-Comintern Pact"
 PDV_fa_c3_5_desc:0 "A pact with anyone who hates the same enemy, signed without reading the small print. The party gains allies it does not like and a war it did not plan."
 PDV_fa_c3_6:0 "The Eastern Marches"
 PDV_fa_c3_6_desc:0 "Claims printed in the newspapers before they are made in the chancelleries. Make a retreat politically impossible before you ask for anything."
 PDV_fa_c3_7:0 "The Reich in the World"
 PDV_fa_c3_7_desc:0 "The state takes its place among the powers and is taken seriously, mostly because it has stopped being polite. The world takes note and starts counting divisions."
 PDV_mo_review:0 "Letters to the Court"
 PDV_mo_review_desc:0 "The court has been writing to the provinces for twenty years and being answered by clerks. Now the letters are opened, the old families are invited back, and the crown is told it has friends."
 PDV_mo_spine1:0 "The Household Troops"
 PDV_mo_spine1_desc:0 "The household regiments are brought up to strength and given a place at court. The crown wants a force that answers to a person, not to a ministry."
 PDV_mo_spine2:0 "The Officers' Oath"
 PDV_mo_spine2_desc:0 "The oath is rewritten to the crown rather than to the government of the day. A small change in the text and a very large one in the barracks."
 PDV_mo_spine3:0 "The Royal Arsenal"
 PDV_mo_spine3_desc:0 "The old arsenal reopens and the nobility is invited to pay for it. Patriotism that costs the gentry money is, the court notes, the only kind they believe."
 PDV_mo_spine4:0 "The Old Regiments"
 PDV_mo_spine4_desc:0 "Historic regiments restored with their numbers, their colours and their entirely fictional traditions. Soldiers fight better for a story than for a budget line."
 PDV_mo_spine5:0 "The King's Army"
 PDV_mo_spine5_desc:0 "Small, slow, beautifully turned out and completely certain whom it obeys. The crown prefers an army it can trust to an army it can use."
 PDV_mo_spine6:0 "The Crown Restored"
 PDV_mo_spine6_desc:0 "The crown is restored in law as well as fact, on a document nobody has read since 1815. An old constitution is safer than a new one because fewer people remember it."
 PDV_mo_final:0 "The Old Order Endures"
 PDV_mo_final_desc:0 "The crown has survived the century that was supposed to end it and intends to survive the next one. A modest ambition that has outlived every government which called it one."
 PDV_mo_c0_0:0 "The Crown Estates"
 PDV_mo_c0_0_desc:0 "The estates are surveyed, mapped and put on a proper footing. Land is the one asset the crown has never had to invent, only to stop losing."
 PDV_mo_c0_1:0 "The Royal Bank"
 PDV_mo_c0_1_desc:0 "A crown bank lends to the crown's friends at rates the treasury cannot match. Corrupt, effective, and older than the treasury."
 PDV_mo_c0_2:0 "The Corn Laws"
 PDV_mo_c0_2_desc:0 "Grain is protected, a fixed price is guaranteed, and the towns pay for it. The countryside is loyal and the towns are hungry, which the court considers a fair trade."
 PDV_mo_c0_3:0 "The Guilds Restored"
 PDV_mo_c0_3_desc:0 "The old guilds get charters, monopolies and a place in the procession. Inefficient, and the most reliable friends the crown has."
 PDV_mo_c0_4:0 "The Royal Roads"
 PDV_mo_c0_4_desc:0 "Roads built from the capital outward, so that everything ends up in the capital. The court calls it integration; the provinces call it a tax with a surface."
 PDV_mo_c0_5:0 "The Silver Standard"
 PDV_mo_c0_5_desc:0 "The currency goes back onto silver at the old rate, which is expensive and reassuring. Confidence, the court argues, is worth more than the difference."
 PDV_mo_c0_6:0 "The Court Economy"
 PDV_mo_c0_6_desc:0 "The court, the estates and the treasury run as one household. Archaic, it works, and it makes the budget impossible for anyone outside to audit."
 PDV_mo_c0_7:0 "The King's Peace"
 PDV_mo_c0_7_desc:0 "A country where prices are stable and everyone knows their place is described as peaceful. The crown's definition of peace is order, and order can be enforced."
 PDV_mo_c1_0:0 "The Church Schools"
 PDV_mo_c1_0_desc:0 "The church gets the schools back and teaches obedience, literacy and the catechism in that order. The crown gets an institution that has been doing this for four hundred years."
 PDV_mo_c1_1:0 "Royal Charity"
 PDV_mo_c1_1_desc:0 "Hospitals, orphanages and bread kitchens, funded by the crown and named after it. Generosity with a coat of arms on it."
 PDV_mo_c1_2:0 "The Old Poor Law"
 PDV_mo_c1_2_desc:0 "The parishes are made responsible for their own poor again. Cheaper than a ministry, and it makes the parish, not the state, the thing people are grateful to."
 PDV_mo_c1_3:0 "The Nobility's Duties"
 PDV_mo_c1_3_desc:0 "The aristocracy is given obligations as well as privileges: schools, roads and a regiment each. A class with duties, the court argues, can be defended."
 PDV_mo_c1_4:0 "The Village Fairs"
 PDV_mo_c1_4_desc:0 "Fairs, festivals and feast days, restored with their old names. The crown's politics is largely ceremonial, and the ceremony is the politics."
 PDV_mo_c1_5:0 "The Royal Academy"
 PDV_mo_c1_5_desc:0 "A learned society under royal patronage, with a charter and no political power. It gives the crown scientists, and the scientists give the crown respectability."
 PDV_mo_c1_6:0 "The Ceremonies"
 PDV_mo_c1_6_desc:0 "Coronations, reviews and processions, staged with great care and paid for by subscription. A crown that is seen is a crown that is believed."
 PDV_mo_c1_7:0 "The Realm United"
 PDV_mo_c1_7_desc:0 "The provinces get their old charters back and are told they were never separate. Everything belongs to the crown, and the crown belongs to everyone."
 PDV_mo_c2_0:0 "The Royal Guard"
 PDV_mo_c2_0_desc:0 "A guard loyal to the person of the king and useless in the field. The court keeps it anyway: a king who is not guarded is not a king for long."
 PDV_mo_c2_1:0 "The Cavalry Tradition"
 PDV_mo_c2_1_desc:0 "Horses bought, stables built, a tradition maintained. The cavalry is obsolete and politically untouchable, which the court finds symbolic."
 PDV_mo_c2_2:0 "The Fortress Line"
 PDV_mo_c2_2_desc:0 "Fortresses on the old frontier, restored rather than redesigned. They are monuments as much as defences, and the crown has always preferred monuments."
 PDV_mo_c2_3:0 "The Admiralty"
 PDV_mo_c2_3_desc:0 "A navy board, a budget and a fleet that stays in harbour. The crown wants a navy for the same reason it wants a crown: to be seen with one."
 PDV_mo_c2_4:0 "The Officer Families"
 PDV_mo_c2_4_desc:0 "Commissions go to families the court knows, on the understanding that loyalty is inherited. Not efficient; dependable."
 PDV_mo_c2_5:0 "The Royal Engineers"
 PDV_mo_c2_5_desc:0 "Engineers, signallers and a corps that builds rather than fights. The crown's army is at its best holding a spade."
 PDV_mo_c2_6:0 "The Reserve Regiments"
 PDV_mo_c2_6_desc:0 "A network in the hills, the towns and the factories, loyal to the crown rather than to the state. The court's answer to a general strike is a list of names."
 PDV_mo_c2_7:0 "The Crown in Arms"
 PDV_mo_c2_7_desc:0 "Every man a subject, every subject liable. The crown arms its people with reluctance and keeps the list of who has what."
 PDV_mo_c3_0:0 "The Somharhem Marriage"
 PDV_mo_c3_0_desc:0 "A marriage, a dowry and a claim nobody will press for a generation. The court's foreign policy is dynastic because dynastic claims never expire."
 PDV_mo_c3_1:0 "The Cornish Envoy"
 PDV_mo_c3_1_desc:0 "An envoy to Cornwall, with presents and a very old treaty. The crown collects small allies the way it collects small titles."
 PDV_mo_c3_2:0 "The Renderbosch Question"
 PDV_mo_c3_2_desc:0 "A neighbouring court claims a border province and is answered with genealogies. The crown disputes the claim rather than the army: cheaper, and slower."
 PDV_mo_c3_3:0 "The Royal Coup"
 PDV_mo_c3_3_desc:0 "The palace guard closes the roads at midnight; by morning the cabinet has resigned, the chamber is dissolved and the king has a prime minister who is also his cousin. The crown calls it a restoration."
 PDV_mo_c3_4:0 "The Old Alliance"
 PDV_mo_c3_4_desc:0 "The old alliance is revived with the old wording, because the wording is the point. The court signs treaties the way other states sign contracts."
 PDV_mo_c3_5:0 "The Vrettian Claim"
 PDV_mo_c3_5_desc:0 "A claim on Vrettia, revived from a marriage in 1802. The court knows it cannot be enforced and finds that no reason not to raise it."
 PDV_mo_c3_6:0 "The Diplomatic Corps"
 PDV_mo_c3_6_desc:0 "Embassies staffed by the nobility, briefed by the foreign ministry and charming beyond their instructions. Diplomacy conducted by people who have never had a job."
 PDV_mo_c3_7:0 "The Crown's Reach"
 PDV_mo_c3_7_desc:0 "The crown takes its place in the world as an old institution among new ones. It is respected, it is invited everywhere, and it is obeyed nowhere."
 PDV_af_root:0 "A Doctrine for the Army"
 PDV_af_root_desc:0 "The army has spent twenty years being told it is not trusted. It is now told what it is for, in writing, by people who have read a map."
 PDV_af_armour:0 "The Armour School"
 PDV_af_armour_desc:0 "Tanks in ones and twos, kept running by mechanics who make their own parts. A school that teaches one idea instead of four is the cheapest reform available."
 PDV_af_guns:0 "The Gun School"
 PDV_af_guns_desc:0 "Artillery is the one arm the Directorate was ever good at, because gunners cannot be purged for disloyalty. The school builds on the only competence the state still has."
 PDV_af_hulls:0 "A Plant for Hulls"
 PDV_af_hulls_desc:0 "A plant for hulls in the province with the steel and the unemployment. The army asked for the plant; the province asked for the jobs."
 PDV_af_columns:0 "Mobile Columns"
 PDV_af_columns_desc:0 "A brigade that can move is worth three that sit in garrison, and cheaper than either. The army learns mobility because it cannot afford numbers."
 PDV_af_combined:0 "Combined Arms"
 PDV_af_combined_desc:0 "Tanks, guns and infantry in the same plan, which nobody has attempted since 1919. The army tries it because the alternative is losing the next war the same way."
 PDV_af_barrels:0 "A Plant for Barrels"
 PDV_af_barrels_desc:0 "A second plant, and the last military factory the budget will bear this decade. Everything after this has to be paid for by the war it is meant to prevent."
 PDV_af_battery:0 "The Heavy Battery"
 PDV_af_battery_desc:0 "Siege guns taken out of the museum, inspected, and found to be perfectly serviceable. Old guns with new sights are the army's cheapest artillery."
 PDV_af_counterbattery:0 "Counter-Battery Fire"
 PDV_af_counterbattery_desc:0 "Find the enemy guns before they find yours. The doctrine the army actually needs, taught by the officers who survived the last war."
 PDV_af_manual:0 "The Field Manual"
 PDV_af_manual_desc:0 "Whatever the army has chosen, it now has a manual, a school and a budget line that agree with each other. That has not happened before."
 PDV_af_air:0 "An Air Arm"
 PDV_af_air_desc:0 "Not an air force: an arm of the army that happens to fly, and for now flies whatever it can buy. The army wants observers, not bombers."
 PDV_af_fighters:0 "Interceptors for the Cities"
 PDV_af_fighters_desc:0 "Interceptors bought for the cities, because a hostile bomber over the capital is a political event. The generals would rather have tanks; the government insists."
 PDV_af_cas:0 "Ground Attack"
 PDV_af_cas_desc:0 "Ground attack is the army's idea of air power: aircraft as artillery that can see. Unglamorous, and it wins the battles the army actually fights."
 PDV_af_radar:0 "Radar and Reporting"
 PDV_af_radar_desc:0 "Radar and a reporting chain, so the first warning is not a formation overhead. The army pays for it because it is cheaper than standing patrols."
 PDV_af_wing:0 "The Fighter Wing"
 PDV_af_wing_desc:0 "The fighter wing gets squadrons, doctrine and a permanent budget. The air arm stops being an experiment and starts being a career."
 PDV_af_strike:0 "The Strike Wing"
 PDV_af_strike_desc:0 "A strike wing bought for one job: to make the enemy's advance expensive before it reaches the forts. Everything about it is a delaying plan."
 PDV_af_divebomber:0 "The Dive Bomber"
 PDV_af_divebomber_desc:0 "Dive bombers bought abroad and copied at home. The army's theory is that a tank column needs a gun that can follow it."
 PDV_af_airfields:0 "The Airfields"
 PDV_af_airfields_desc:0 "Airfields in the interior, out of reach of the coast. The air arm is dispersed because the country is large and the enemy is not expected to be polite."
 PDV_af_airdoctrine:0 "The Air Doctrine"
 PDV_af_airdoctrine_desc:0 "A doctrine that ties the schools, the plants and the squadrons together. The army stops buying aircraft and starts building an air arm."
 PDV_af_capstone:0 "The Vyratian Air Force"
 PDV_af_capstone_desc:0 "The Vyratian Air Force exists as a service, with its own staff and its own arguments with the army. Small, competent, and finally somebody's responsibility."
 PDV_nv_root:0 "Rebuild the Yards"
 PDV_nv_root_desc:0 "Three slips, two cranes and a dry dock that has been a warehouse since 1929. The yards come first because a navy without yards is a purchase, not a policy."
 PDV_nv_surface:0 "Ships That Are Seen"
 PDV_nv_surface_desc:0 "Two cruisers and a flotilla of destroyers, painted properly, visiting every port that will have them. The navy's first duty is to be seen."
 PDV_nv_subs:0 "Ships That Are Not"
 PDV_nv_subs_desc:0 "Submarines are the cheapest way for a poor country to be inconvenient, and being inconvenient is the whole strategy. The admiralty argues for them on cost alone."
 PDV_nv_cruisers:0 "The Cruiser Programme"
 PDV_nv_cruisers_desc:0 "Two hulls laid down slowly, paid for by subscription in the coastal towns. The navy is financed by the people who will watch it leave."
 PDV_nv_destroyers:0 "The Destroyer Flotilla"
 PDV_nv_destroyers_desc:0 "Eight hulls that can be built in a year and lost in an afternoon. The destroyer is the only ship a small navy can afford to lose."
 PDV_nv_battleline:0 "The Battle Line"
 PDV_nv_battleline_desc:0 "One old battleship, modernised, which is either a fleet or a very expensive harbour ornament. The navy keeps her because a flag needs a mast."
 PDV_nv_screen:0 "The Screen"
 PDV_nv_screen_desc:0 "The screen learns that its most useful ships are the ones that find the submarines first. Escort duty is dull, essential and universally resented."
 PDV_nv_pens:0 "The Submarine Pens"
 PDV_nv_pens_desc:0 "Concrete, cranes and a roof thick enough to make the point. The submarines need somewhere to be invisible, and the coast is too shallow to hide them."
 PDV_nv_wolfpack:0 "The Wolfpack"
 PDV_nv_wolfpack_desc:0 "Submarines used in groups rather than singly. The doctrine is cheap and the admiralty knows exactly what it is asking for."
 PDV_nv_mines:0 "Mine Warfare"
 PDV_nv_mines_desc:0 "The southern approaches are shallow, narrow and, with a little work, impassable. Mines are the cheapest fleet in the world."
 PDV_nv_silent:0 "The Silent Service"
 PDV_nv_silent_desc:0 "A branch of the navy that does not appear in the newspapers and prefers it that way. The silent service gets the budget it wants and no publicity."
 PDV_nv_doctrine:0 "The Naval Doctrine"
 PDV_nv_doctrine_desc:0 "Whatever the admiralty has chosen, the fleet now has a plan that fits the ships it actually has. The plan is short, because the fleet is."
 PDV_nv_coast:0 "Coastal Defence"
 PDV_nv_coast_desc:0 "The coast is long, the navy is small and the forts are cheaper than either. Coastal defence is what the navy does when it is honest."
 PDV_nv_marines:0 "The Marines"
 PDV_nv_marines_desc:0 "A battalion that can be landed anywhere, mostly useful for making other people nervous. Its political value exceeds its military one."
 PDV_nv_convoys:0 "The Convoy System"
 PDV_nv_convoys_desc:0 "A merchant marine worth more than the navy, and a navy that exists mostly to keep it afloat. The admiralty discovers its real job is insurance."
 PDV_nv_tradewar:0 "The Trade War"
 PDV_nv_tradewar_desc:0 "The fleet is given a list of foreign shipping and a very broad interpretation of international law. Commerce raiding is how a small navy hurts a large one."
 PDV_nv_admiralty:0 "The Admiralty"
 PDV_nv_admiralty_desc:0 "A building, a board and a budget, which is more than the navy has had since the Directorate began. The navy's first victory is administrative."
 PDV_nv_academy:0 "The Naval Academy"
 PDV_nv_academy_desc:0 "Officers who have been to sea, taught by officers who have been to sea. Small, and it produces the only people who can run the fleet."
 PDV_nv_fleetair:0 "The Fleet Air Arm"
 PDV_nv_fleetair_desc:0 "Aircraft that belong to the navy, which the army will resent for the rest of the decade. A bureaucratic victory before it is a military one."
 PDV_nv_law:0 "The Navy Law"
 PDV_nv_law_desc:0 "A ten-year programme, published, funded and impossible to cancel without looking weak. The navy's real guarantee is that the next government cannot quietly abandon it."
