 PDV_mo_c3_2:0 "The Renderbosch Question"
 PDV_mo_c3_2_desc:0 "The border question is raised again, politely, and then less politely."
 PDV_mo_c3_3:0 "The Royal Coup"
 PDV_mo_c3_3_desc:0 "The palace guard closes the roads at midnight. By morning the cabinet has resigned, the chamber is dissolved, and the king has a new prime minister who is also his cousin."
 PDV_mo_c3_4:0 "The Old Alliance"
 PDV_mo_c3_4_desc:0 "Letters are exchanged with the neighbours, and some of them are answered."
 PDV_mo_c3_5:0 "The Vrettian Claim"
 PDV_mo_c3_5_desc:0 "A pact is offered that costs nothing on paper and a great deal in practice."
 PDV_mo_c3_6:0 "The Diplomatic Corps"
 PDV_mo_c3_6_desc:0 "The claims are printed in the newspapers before they are made in the chancelleries."
 PDV_mo_c3_7:0 "The Crown's Reach"
 PDV_mo_c3_7_desc:0 "The province takes its place in the world, and the world takes note."
 PDV_af_root:0 "A Doctrine for the Army"
 PDV_af_root_desc:0 "The army has spent twenty years being told it is not trusted. It is now told what it is for instead."
 PDV_af_armour:0 "The Armour School"
 PDV_af_armour_desc:0 "Tanks in ones and twos, kept running by mechanics who make their own parts, and a school that teaches one idea instead of four."
 PDV_af_guns:0 "The Gun School"
 PDV_af_guns_desc:0 "Artillery is the one arm the Directorate was ever any good at, because it is the one arm that cannot be purged for disloyalty."
 PDV_af_hulls:0 "A Plant for Hulls"
 PDV_af_hulls_desc:0 "One plant, one design, one shift that knows exactly what it is doing."
 PDV_af_columns:0 "Mobile Columns"
 PDV_af_columns_desc:0 "A brigade that can move is worth three that sit in garrison, and cheaper than either."
 PDV_af_combined:0 "Combined Arms"
 PDV_af_combined_desc:0 "Tanks, guns and infantry in the same plan, which nobody in the army has attempted since 1919."
 PDV_af_barrels:0 "A Plant for Barrels"
 PDV_af_barrels_desc:0 "A second plant, and the last military factory the budget will bear this decade."
 PDV_af_battery:0 "The Heavy Battery"
 PDV_af_battery_desc:0 "The siege guns are taken out of the museum, inspected, and found to be perfectly serviceable."
 PDV_af_counterbattery:0 "Counter-Battery Fire"
 PDV_af_counterbattery_desc:0 "The doctrine the army actually needs: find the enemy guns before they find yours."
 PDV_af_manual:0 "The Field Manual"
 PDV_af_manual_desc:0 "Whatever the army has chosen, it now has a manual, a school and a budget line that agree with each other."
 PDV_af_air:0 "An Air Arm"
 PDV_af_air_desc:0 "Not an air force: an arm of the army that happens to fly, and for now it flies whatever it can buy."
 PDV_af_fighters:0 "Interceptors for the Cities"
 PDV_af_fighters_desc:0 "The cities are the only thing worth defending and the only thing that cannot be moved."
 PDV_af_cas:0 "Ground Attack"
 PDV_af_cas_desc:0 "The army asked for aircraft that can hit a column on a road. It will get aircraft that can hit a road."
 PDV_af_radar:0 "Radar and Reporting"
 PDV_af_radar_desc:0 "A chain of observers, telephones and one very expensive set of aerials."
 PDV_af_wing:0 "The Fighter Wing"
 PDV_af_wing_desc:0 "One wing, properly equipped, rather than four squadrons sharing a single airfield."
 PDV_af_strike:0 "The Strike Wing"
 PDV_af_strike_desc:0 "A squadron that exists to be pointed at a crossroads and told to be accurate."
 PDV_af_divebomber:0 "The Dive Bomber"
 PDV_af_divebomber_desc:0 "The aircraft the army wants is small, slow, and extremely good at hitting one bridge."
 PDV_af_airfields:0 "The Airfields"
 PDV_af_airfields_desc:0 "Four fields, one of them paved, and a fuel depot nobody has yet set on fire."
 PDV_af_airdoctrine:0 "The Air Doctrine"
 PDV_af_airdoctrine_desc:0 "The army has decided what aircraft are for. It took four years and a great deal of arguing."
 PDV_af_capstone:0 "The Vyratian Air Force"
 PDV_af_capstone_desc:0 "A separate service, a separate budget and a separate set of arguments with the army."
 PDV_nv_root:0 "Rebuild the Yards"
 PDV_nv_root_desc:0 "Three slips, two cranes and a dry dock that has been a warehouse since 1929."
 PDV_nv_surface:0 "Ships That Are Seen"
 PDV_nv_surface_desc:0 "Two cruisers and a flotilla of destroyers, painted properly, visiting every port that will have them."
 PDV_nv_subs:0 "Ships That Are Not"
 PDV_nv_subs_desc:0 "Submarines are the cheapest way for a poor country to be inconvenient, and being inconvenient is the whole strategy."
 PDV_nv_cruisers:0 "The Cruiser Programme"
 PDV_nv_cruisers_desc:0 "Two hulls, laid down slowly, paid for by subscription in the coastal towns."
 PDV_nv_destroyers:0 "The Destroyer Flotilla"
 PDV_nv_destroyers_desc:0 "Eight hulls that can be built in a year and lost in an afternoon."
 PDV_nv_battleline:0 "The Battle Line"
 PDV_nv_battleline_desc:0 "One old battleship, modernised, which is either a fleet or a very expensive harbour ornament."
 PDV_nv_screen:0 "The Screen"
 PDV_nv_screen_desc:0 "The fleet learns that its most useful ships are the ones that find the submarines first."
 PDV_nv_pens:0 "The Submarine Pens"
 PDV_nv_pens_desc:0 "Concrete, cranes and a roof thick enough to make the point."
 PDV_nv_wolfpack:0 "The Wolfpack"
 PDV_nv_wolfpack_desc:0 "Submarines are cheap, and a doctrine that uses them in groups is cheaper still."
 PDV_nv_mines:0 "Mine Warfare"
 PDV_nv_mines_desc:0 "The southern approaches are shallow, narrow and, with a little work, impassable."
 PDV_nv_silent:0 "The Silent Service"
 PDV_nv_silent_desc:0 "A branch of the navy that does not appear in the newspapers and prefers it that way."
 PDV_nv_doctrine:0 "The Naval Doctrine"
 PDV_nv_doctrine_desc:0 "Whatever the admiralty has chosen, the fleet now has a plan that fits the ships it actually has."
 PDV_nv_coast:0 "Coastal Defence"
 PDV_nv_coast_desc:0 "The coast is long, the navy is small, and the forts are cheaper than either."
 PDV_nv_marines:0 "The Marines"
 PDV_nv_marines_desc:0 "A battalion that can be landed anywhere, which is mostly useful for making other people nervous."
 PDV_nv_convoys:0 "The Convoy System"
 PDV_nv_convoys_desc:0 "A merchant marine worth more than the navy, and a navy that exists mostly to keep it afloat."
 PDV_nv_tradewar:0 "The Trade War"
 PDV_nv_tradewar_desc:0 "The fleet is given a list of foreign shipping and a very broad interpretation of international law."
 PDV_nv_admiralty:0 "The Admiralty"
 PDV_nv_admiralty_desc:0 "A building, a board and a budget, which is more than the navy has had since the Directorate began."
 PDV_nv_academy:0 "The Naval Academy"
 PDV_nv_academy_desc:0 "Officers who have actually been to sea, taught by officers who have actually been to sea."
 PDV_nv_fleetair:0 "The Fleet Air Arm"
 PDV_nv_fleetair_desc:0 "Aircraft that belong to the navy, which the army will resent for the rest of the decade."
 PDV_nv_law:0 "The Navy Law"
 PDV_nv_law_desc:0 "A ten-year programme, published, funded and impossible to cancel without looking weak."
