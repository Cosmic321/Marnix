 PDV_dm_c1_0_desc:0 "Schools open in buildings that were churches, barracks or nothing at all."
 PDV_dm_c1_1:0 "The Health Service"
 PDV_dm_c1_1_desc:0 "Housing is built to a single plan, from a single material, in a single colour."
 PDV_dm_c1_2:0 "Housing the Workers"
 PDV_dm_c1_2_desc:0 "A clinic in every district, staffed by people who have read one book and are very keen."
 PDV_dm_c1_3:0 "The Women's Vote"
 PDV_dm_c1_3_desc:0 "Committees for the women of the province, with real budgets and no real power."
 PDV_dm_c1_4:0 "Trade Union Rights"
 PDV_dm_c1_4_desc:0 "A school for the people who will run the province after the people who founded it are dead."
 PDV_dm_c1_5:0 "The Civic Associations"
 PDV_dm_c1_5_desc:0 "One newspaper, printed on the province's own press, for the province's own good."
 PDV_dm_c1_6:0 "A Free University"
 PDV_dm_c1_6_desc:0 "Canteens, creches and a working day that ends when the notice says it does."
 PDV_dm_c1_7:0 "The Open Society"
 PDV_dm_c1_7_desc:0 "A society of equals, in the sense that everyone is equally watched."
 PDV_dm_c2_0:0 "A Smaller Army"
 PDV_dm_c2_0_desc:0 "Every district is told how many rifles it owes, and by when."
 PDV_dm_c2_1:0 "The National Guard"
 PDV_dm_c2_1_desc:0 "One plant, one design, one shift that knows exactly what it is doing."
 PDV_dm_c2_2:0 "Officer Examinations"
 PDV_dm_c2_2_desc:0 "The guns are grouped, ranged and given a doctrine that is written down."
 PDV_dm_c2_3:0 "A Modern Staff"
 PDV_dm_c2_3_desc:0 "The whole population is enrolled, counted and given a place in the plan."
 PDV_dm_c2_4:0 "The Defence Committee"
 PDV_dm_c2_4_desc:0 "Commissars are attached to every staff, and every staff is told why."
 PDV_dm_c2_5:0 "The Air Militia"
 PDV_dm_c2_5_desc:0 "Concrete, guns and a clear line of fire along the southern approaches."
 PDV_dm_c2_6:0 "The Coastal Watch"
 PDV_dm_c2_6_desc:0 "A network in the hills, in the towns and in the factories, waiting."
 PDV_dm_c2_7:0 "The Republic in Arms"
 PDV_dm_c2_7_desc:0 "The people are armed, which is either the point or the problem."
 PDV_dm_c3_0:0 "The Neighbourhood Policy"
 PDV_dm_c3_0_desc:0 "An embassy is opened, staffed and, more importantly, listened to."
 PDV_dm_c3_1:0 "Trade with Somharhem"
 PDV_dm_c3_1_desc:0 "Trade delegations arrive with samples, contracts and an interest in the railways."
 PDV_dm_c3_2:0 "The Island Question"
 PDV_dm_c3_2_desc:0 "The border question is raised again, politely, and then less politely."
 PDV_dm_c3_3:0 "The Federal Settlement"
 PDV_dm_c3_3_desc:0 "The four provinces are offered their own governments, their own budgets and their own flags, on the understanding that the republic keeps the railways, the army and the foreign ministry."
 PDV_dm_c3_4:0 "Letters to Renderbosch"
 PDV_dm_c3_4_desc:0 "Letters are exchanged with the neighbours, and some of them are answered."
 PDV_dm_c3_5:0 "The League of Small Nations"
 PDV_dm_c3_5_desc:0 "A pact is offered that costs nothing on paper and a great deal in practice."
 PDV_dm_c3_6:0 "Neutral Ground"
 PDV_dm_c3_6_desc:0 "The claims are printed in the newspapers before they are made in the chancelleries."
 PDV_dm_c3_7:0 "The Vyratian Century"
 PDV_dm_c3_7_desc:0 "The province takes its place in the world, and the world takes note."
 PDV_fa_review:0 "The Cells Take Root"
 PDV_fa_review_desc:0 "The party's own lists are shorter than the Directorate's, which is the only mercy in the file."
 PDV_fa_spine1:0 "The New Divisions"
 PDV_fa_spine1_desc:0 "The hollow formations are dissolved and raised again, with new numbers, new flags and no history."
 PDV_fa_spine2:0 "The War Academy"
 PDV_fa_spine2_desc:0 "Doctrine is taught in a building with the party's eagle over the door and the army's colours in the hall."
 PDV_fa_spine3:0 "Steel and Discipline"
 PDV_fa_spine3_desc:0 "The depots are filled, the training is brutal and the results are published."
 PDV_fa_spine4:0 "The Blackshirt Cadres"
 PDV_fa_spine4_desc:0 "The militia is folded into the army and told it was always the army."
 PDV_fa_spine5:0 "The Reich Reborn"
 PDV_fa_spine5_desc:0 "The last of the old army's hollowness is hammered out of it: depots filled, schools reopened, plans made past next Tuesday."
 PDV_fa_spine6:0 "The Vyratian Reich"
 PDV_fa_spine6_desc:0 "The state is renamed, the army is renamed with it, and the flags are reprinted before the ink on the constitution is dry."
 PDV_fa_final:0 "The Thousand Year Reich"
 PDV_fa_final_desc:0 "The Reich announces that it will last a thousand years, and immediately begins building the monuments to prove it."
