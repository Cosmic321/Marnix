l_english:

 # Vyratia: cosmetic tags, spirits, events, decisions and the splinter trees.
 PDV_FED:0 "Federal Republic of Vyratia"
 PDV_REICH:0 "The Vyratian Reich"

 PDV_rebuilt_staff:0 "A Rebuilt Staff"
 PDV_rebuilt_staff_desc:0 "Officers are appointed for competence again, and the ones who cannot be trusted with a division have been given desks with a view."
 PDV_civil_war_scars:0 "The Scars of the Civil War"
 PDV_civil_war_scars_desc:0 "Rail junctions, plants and three of the largest cities have been fought over twice. Nothing works and everybody remembers who started it."
 PDV_federal_republic:0 "The Federal Republic"
 PDV_federal_republic_desc:0 "A smaller country with a parliament that actually votes, a treasury that actually balances, and provinces that are allowed to disagree."
 PDV_reich:0 "The Vyratian Reich"
 PDV_reich_desc:0 "One country, one party, one flag with a great deal more gold thread on it than the last one."
 PDV_leaderless:0 "Leaderless"
 PDV_leaderless_desc:0 "The party's leadership was killed in a single night. What is left fights on without orders, without coordination and without any plan beyond the next week."
 PDV_peoples_defence:0 "A War Without a Front"
 PDV_peoples_defence_desc:0 "There is no line to hold and no capital to lose. The state fights from cellars, forests and the parts of the country that no army has ever bothered to occupy."
 PDV_rbd_infiltration:0 "Vyratian Money"
 PDV_rbd_infiltration_desc:0 "The newspapers of Renderbosch have new owners, and the new owners have a great deal of sympathy for the crown."

 pdv_vyratia.1.t:0 "The Night of the Long Knives"
 pdv_vyratia.1.d:0 "The party's columns reached the capital at four in the morning, and by six the entire leadership of the Directorate had been shot in a courtyard that is not on any map. What is left of the communist state has an army, a territory and no head."
 pdv_vyratia.1.a:0 "There is nobody left to negotiate with."
 pdv_vyratia.2.t:0 "The Country Comes Apart"
 pdv_vyratia.2.d:0 "Thirty days of fighting and the map has stopped making sense. Every province the Directorate used to govern has declared for itself, and in the industrial belt two statelets - one of them flying a flag nobody has seen before - have dug in behind their own militias."
 pdv_vyratia.2.a:0 "Let them go. They will come back."
 pdv_vyratia.3.t:0 "An Offer from the South"
 pdv_vyratia.3.d:0 "Vyratia has offered Somharhem the status of a protected kingdom: its own crown, its own parliament, and a foreign policy written in a language it does not speak."
 pdv_vyratia.3.a:0 "We accept the crown's protection."
 pdv_vyratia.3.b:0 "We are not anybody's protected kingdom."


 SUN_province:0 "Sumni declares for itself"
 SUN_province_desc:0 "The northern provinces stop answering the capital. There is no vote, no ultimatum and no ceremony: the committees simply begin issuing their own papers."
 SUN_army_merged:0 "The Provincial Army"
 SUN_army_merged_desc:0 "Four branches of provincial policy come together into one force: depots, regiments, officers and a staff that answers to the province."
 SUN_state_merged:0 "The Provincial State"
 SUN_state_merged_desc:0 "The province now has a treasury, a railway, a militia and a bureaucracy that all answer to the same room."
 BRR_province:0 "Barri declares for itself"
 BRR_province_desc:0 "The eastern provinces follow the railway committees out of the Directorate, and take the junctions, the depots and the argument with them."
 BRR_army_merged:0 "The Provincial Army"
 BRR_army_merged_desc:0 "Four branches of provincial policy come together into one force: depots, regiments, officers and a staff that answers to the province."
 BRR_state_merged:0 "The Provincial State"
 BRR_state_merged_desc:0 "The province now has a treasury, a railway, a militia and a bureaucracy that all answer to the same room."
 AFR_province:0 "Afria declares for itself"
 AFR_province_desc:0 "The islands and the western coast declare for nobody but themselves, which they have been doing quietly for two hundred years."
 AFR_army_merged:0 "The Provincial Army"
 AFR_army_merged_desc:0 "Four branches of provincial policy come together into one force: depots, regiments, officers and a staff that answers to the province."
 AFR_state_merged:0 "The Provincial State"
 AFR_state_merged_desc:0 "The province now has a treasury, a railway, a militia and a bureaucracy that all answer to the same room."
 VYR_province:0 "Vyrataria declares for itself"
 VYR_province_desc:0 "The south-west declares for itself in the name of the old province, and the old province has not existed since 1919."
 VYR_army_merged:0 "The Provincial Army"
 VYR_army_merged_desc:0 "Four branches of provincial policy come together into one force: depots, regiments, officers and a staff that answers to the province."
 VYR_state_merged:0 "The Provincial State"
 VYR_state_merged_desc:0 "The province now has a treasury, a railway, a militia and a bureaucracy that all answer to the same room."
 SUN_seize:0 "Seize the Ministries"
 SUN_seize_desc:0 "There is no vote and no negotiation. The provincial offices are occupied before dawn, the files are taken, and the men who ran them are told to keep working or leave."
 SUN_arsenal:0 "Take the Arsenals"
 SUN_arsenal_desc:0 "The garrisons are disarmed by their own officers, and the rifles in the depots are counted by people who intend to use them."
 SUN_railways:0 "Command the Railways"
 SUN_railways_desc:0 "Whoever holds the junctions holds the province. The railway committees are dissolved and replaced by a transport commissariat with a rifle behind every desk."
 SUN_militia:0 "Call Up the Militia"
 SUN_militia_desc:0 "Every district is told how many men it owes and by when. The quotas are met because the alternative is being named in the next list."
 SUN_bank:0 "The Provincial Bank"
 SUN_bank_desc:0 "The branch is taken over, the ledgers are audited by people who cannot read them, and the vault is opened on the same day."
 SUN_regiments:0 "Stand Up the Regiments"
 SUN_regiments_desc:0 "Three regiments, raised from the militia, officered by anybody who can pass a map test."
 SUN_estates:0 "Requisition the Estates"
 SUN_estates_desc:0 "The great houses are emptied, their land divided, and their grain sold to pay for the works."
 SUN_officers:0 "Officers of the Old Army"
 SUN_officers_desc:0 "The men who were purged are offered commands and told, plainly, that refusing is also a political act."
 SUN_books:0 "Balance the Books"
 SUN_books_desc:0 "The province now pays for itself, on paper, and the paper is signed by someone whose name people know."
 SUN_plant:0 "Expand the Plant"
 SUN_plant_desc:0 "One more hall, one more shift, and the province stops importing what it can make."
 SUN_works:0 "Clear the Northern Road"
 SUN_works_desc:0 "The road north is the only road north, and it is rebuilt with conscripted labour and military engineers."
 SUN_ammunition:0 "Ammunition Shops"
 SUN_ammunition_desc:0 "Small workshops in every town, making shells and cartridges to a single design issued from the capital."
 SUN_bureaucracy:0 "A Loyal Bureaucracy"
 SUN_bureaucracy_desc:0 "The clerks are kept, the commissions are abolished, and everybody is told the same thing: the province is a state now."
 SUN_standing:0 "A Standing Force"
 SUN_standing_desc:0 "A real division, with a real staff, which can be moved without asking anybody's permission."
 SUN_roads:0 "The Roads Inland"
 SUN_roads_desc:0 "The province is now connected to the rest of the country by something better than a rumour."
 SUN_cadre:0 "The Party Cadre"
 SUN_cadre_desc:0 "A school for the people who will run the province after the people who founded it are dead."
 SUN_provincial_army:0 "A Provincial Army"
 SUN_provincial_army_desc:0 "What began as militia is now a provincial army with its own depots and its own idea of itself."
 SUN_university:0 "The Provincial University"
 SUN_university_desc:0 "One faculty, four chairs, and a charter that says the province is entitled to its own research."
 SUN_rejoin:0 "Rejoin Vyratia"
 SUN_rejoin_desc:0 "The province has done what it needed to do. The Directorate is offered its territory back - with the province's committees, its factories and its army intact, and with the men who ran them keeping their seats."
 SUN_militia_law:0 "The Militia Law"
 SUN_militia_law_desc:0 "Every household is enrolled, every rifle is registered, and the province becomes expensive to invade."
