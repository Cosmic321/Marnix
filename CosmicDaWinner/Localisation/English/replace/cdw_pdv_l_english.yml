l_english:
 PDV_hollow_army:0 "Hollow Army"
 PDV_hollow_army_desc:0 "The Directorate's divisions exist mostly on paper: under-strength battalions, worn-out equipment and commanders who have learned that initiative is punished. They attack badly and they hold worse."
 PDV_purged_officer_corps:0 "Purged Officer Corps"
 PDV_purged_officer_corps_desc:0 "Three years of denunciations have removed every officer who was good at his job and replaced him with one who is good at reporting. The staff college stands empty and the men know it."
 PDV_reopen_the_staff_college:0 "Reopen the Staff College"
 PDV_reopen_the_staff_college_desc:0 "Bring the survivors back from exile, hand them a lectern and hope the Directorate's surveillance apparatus does not notice that the lectures are useful."
 PDV_rebuild_the_field_army:0 "Rebuild the Field Army"
 PDV_rebuild_the_field_army_desc:0 "Fill out the battalions, issue the equipment, and let the officers who remain actually command. The army will still be a poor thing, but it will be an army."
 PDV_officers_returning:0 "Officers Returning"
 PDV_officers_returning_desc:0 "Some of the men who were purged, exiled or quietly forgotten are back in uniform. The staff corps still does not trust itself, but it is no longer afraid of its own paperwork."
 PDV_army_rebuilding:0 "Army Rebuilding"
 PDV_army_rebuilding_desc:0 "The divisions have equipment, a training cycle and officers who are allowed to give orders. It is not yet an army anyone should be proud of, but it is no longer hollow."
