l_english:
 DES_the_young_emperor:0 "The Young Emperor"
 DES_the_young_emperor_desc:0 "He is nineteen, he has never commanded anything, and the portrait on every wall shows a boy trying not to blink. The court will rule through him, and everyone in the room knows it."
 DES_the_court_of_the_child_king:0 "The Court of the Child King"
 DES_the_court_of_the_child_king_desc:0 "Chamberlains, aunts and generals orbit the throne. Whoever holds the boy's ear holds the state."
 DES_silence_the_agitators:0 "Silence the Agitators"
 DES_silence_the_agitators_desc:0 "The communist cells in the mill towns and the liberal salons in the capital are, officially, the same problem."
 DES_the_imperial_question:0 "The Imperial Question"
 DES_the_imperial_question_desc:0 "Federation or restoration. The court has argued about it for a year; the emperor must now choose."
 DES_federate_the_empire:0 "Federate the Empire"
 DES_federate_the_empire_desc:0 "Cave to the protesters: an imperial federation with real provincial rights, and every acre of the old empire written into the constitution as core territory."
 DES_proclaim_the_restoration:0 "Proclaim the Restoration"
 DES_proclaim_the_restoration_desc:0 "Banners, a coronation, and a speech written by five different men."
 DES_purge_the_staff:0 "Purge the Rotting Staff"
 DES_purge_the_staff_desc:0 "The defeat at Vrettian hands was not the emperor's fault, but the men who lost it are still drawing salaries."
 DES_the_new_model_army:0 "The New Model Army"
 DES_the_new_model_army_desc:0 "Promotion by competence, at least on paper, and a general staff that has actually read a map."
 DES_the_vrettian_question:0 "The Vrettian Question"
 DES_the_vrettian_question_desc:0 "Vrettia swears fealty and plots anyway, and the Generalissimo grows tired of the boy on the throne."
 DES_reclaim_the_margravate:0 "Reclaim the Margravate"
 DES_reclaim_the_margravate_desc:0 "The Mortanian fields fed a third of the empire. Their loss is measured in bread prices in the capital."
 DES_requisition_the_estates:0 "Requisition the Estates"
 DES_requisition_the_estates_desc:0 "The noble houses have grain, horses and sons. The war effort requires all three."
 DES_reopen_the_pits:0 "Reopen the Northern Pits"
 DES_reopen_the_pits_desc:0 "The southern mines went with the Itsany republic. What is left is thin, deep and expensive, but it is ours."
 DES_rationalise_the_railways:0 "Rationalise the Railways"
 DES_rationalise_the_railways_desc:0 "One gauge, one timetable, one ministry. The provinces will complain about all three."
 DES_the_old_order:0 "The Old Order"
 DES_the_old_order_desc:0 "No federation and no concessions: the empire is to be restored as it was, and the whole faction bound to it."
 DES_bind_the_duchies:0 "Bind the Duchies"
 DES_bind_the_duchies_desc:0 "Strength in numbers. Every partner of the empire is given a reason to stay."
 DES_the_question_of_the_junta:0 "The Question of the Junta"
 DES_the_question_of_the_junta_desc:0 "Two years of pretending. The Junta holds ten states and calls itself a caretaker. The empire answers with artillery."
 DES_the_empire_reborn:0 "The Empire Reborn"
 DES_the_empire_reborn_desc:0 "One crown, one army, one border."
 DES_fortify_the_east:0 "Fortify the East"
 DES_fortify_the_east_desc:0 "The Directorate is the largest nation on the globe and it has not stopped looking west."
 DPJ_the_generalissimo:0 "The Generalissimo"
 DPJ_the_generalissimo_desc:0 "He has the army, the telephones and the loyalty of nine men. What he does not have is the capital."
 DPJ_martial_law:0 "Martial Law"
 DPJ_martial_law_desc:0 "The streets are patrolled, the newspapers are censored, and the curfew is announced by a man who has clearly never walked home after dark."
 DPJ_silence_the_street:0 "Silence the Street"
 DPJ_silence_the_street_desc:0 "The communist agitators and the liberal petitioners are given the same answer, and it is not an answer."
 DPJ_the_junta_army:0 "The Army of the Junta"
 DPJ_the_junta_army_desc:0 "The only institution in the country that still works. It will be the model for everything else."
 DPJ_court_the_vrettians:0 "Court the Vrettians"
 DPJ_court_the_vrettians_desc:0 "Vrettia replaced Despria as hegemon of Alteria. Hegemons are cheaper to borrow from than to fight."
 DPJ_accept_the_vrettian_offer:0 "Accept the Vrettian Offer"
 DPJ_accept_the_vrettian_offer_desc:0 "Rifles, instructors and machine tools, delivered on credit and with conditions attached."
 DPJ_the_price_of_aid:0 "The Price of Aid"
 DPJ_the_price_of_aid_desc:0 "The Junta signs. Vrettia gains a satellite; the Generalissimo gains his equipment and loses his independence."
 DPJ_refuse_the_vrettian_offer:0 "Refuse the Vrettian Offer"
 DPJ_refuse_the_vrettian_offer_desc:0 "No credit, no instructors, no conditions. The Junta will arm itself, badly, and owe nobody anything."
 DPJ_a_message_to_vrettia:0 "A Message to Vrettia"
 DPJ_a_message_to_vrettia_desc:0 "The Generalissimo does not intend to beg. He intends to be inconvenient."
 DPJ_the_empire_without_them:0 "The Empire Without Them"
 DPJ_the_empire_without_them_desc:0 "Every state the Junta holds becomes core territory: a Despria that belongs to its own people rather than to a treaty."
 DPJ_the_child_emperor:0 "The Child Emperor"
 DPJ_the_child_emperor_desc:0 "The boy is in the palace, surrounded by courtiers and entirely without an army. Something must be decided about him."
 DPJ_the_emperor_in_our_pocket:0 "The Emperor in Our Pocket"
 DPJ_the_emperor_in_our_pocket_desc:0 "He keeps the throne, the title and the ceremonial sword. The Generalissimo keeps the government."
 DPJ_the_generalissimo_crowned:0 "The Generalissimo Crowned"
 DPJ_the_generalissimo_crowned_desc:0 "The boy is retired, quietly. The Junta's commander takes the crown by right of holding the only divisions that work."
 DPJ_march_on_the_capital:0 "March on the Capital"
 DPJ_march_on_the_capital_desc:0 "Two years of interim government and the succession is still unresolved. The Junta will resolve it."
 DPJ_the_second_desprian_state:0 "The Second Desprian State"
 DPJ_the_second_desprian_state_desc:0 "The Empire is gone and the Junta has won. What it builds is a soldiers' state from the first paragraph of its constitution."
 DPJ_prepare_for_the_directorate:0 "Prepare for the Directorate"
 DPJ_prepare_for_the_directorate_desc:0 "Vyratia is the largest nation in the world and its agitators are already in the border towns."
 DES_dismembered_empire:0 "The Dismembered Empire"
 DES_dismembered_empire_desc:0 "The western farmlands are communist, the southern mines are Itsany, and the Mortanian margravate is gone. The north starves on imported grain and its factories idle for want of steel."
 DES_rotting_staff:0 "The Rotting Staff"
 DES_rotting_staff_desc:0 "The army that lost to Vrettia is still the army that exists. Its colonels bought their commissions and its logistics are a rumour."
 DES_federated_empire:0 "The Federated Empire"
 DES_federated_empire_desc:0 "An empire of provinces rather than of subjects. Uglier than the old constitution, and it works."
 DES_new_army:0 "The New Model Army"
 DES_new_army_desc:0 "A staff that plans, officers promoted for competence, and a supply system that has been read by more than one person."
 DES_vrettian_revanchism:0 "Vrettian Revanchism"
 DES_vrettian_revanchism_desc:0 "The defeat is remembered, and the men who remember it are now being handed rifles."
 DES_requisitions:0 "Requisitions"
 DES_requisitions_desc:0 "The estates are emptied into the war effort. The peasants notice, the noble houses complain, and the granaries are full."
 DES_northern_pits:0 "The Northern Pits"
 DES_northern_pits_desc:0 "Thin seams, deep shafts and coal bought at the price of men. It keeps the mills turning."
 DES_railways:0 "Rationalised Railways"
 DES_railways_desc:0 "One timetable for the whole empire, for the first time in its history."
 DES_restored_order:0 "The Old Order"
 DES_restored_order_desc:0 "The empire as it was: crown, hierarchy and obedience, with no federal nonsense to dilute any of it."
 DES_imperial_cause:0 "The Imperial Cause"
 DES_imperial_cause_desc:0 "The empire's partners have been given a stake in its restoration, and a reason to fight for it."
 DES_empire_reborn:0 "The Empire Reborn"
 DES_empire_reborn_desc:0 "One crown, one army, one border, and a staff that no longer loses wars by accident."
 DES_eastern_wall:0 "The Eastern Wall"
 DES_eastern_wall_desc:0 "Concrete, wire and dug-in guns along the Directorate border, because the Directorate is coming."
 DPJ_government_that_does_not_exist:0 "A Government That Does Not Exist"
 DPJ_government_that_does_not_exist_desc:0 "The Junta administers ten states without a constitution, a parliament or any legal basis beyond martial law and momentum."
 DPJ_junta_army:0 "The Junta's Army"
 DPJ_junta_army_desc:0 "The officer corps of the caretaker government: competent, political, and personally loyal to the Generalissimo."
 DPJ_vrettian_sponsorship:0 "Vrettian Sponsorship"
 DPJ_vrettian_sponsorship_desc:0 "Vrettian rifles and machine tools arrive on credit. The officers grumble about the strings attached, and then sign for the shipment."
 DPJ_vrettian_satellite:0 "A Vrettian Satellite"
 DPJ_vrettian_satellite_desc:0 "The Junta governs, but Vrettia decides what it may govern. The rifles are being paid for in sovereignty."
 DPJ_self_reliance:0 "Self-Reliance"
 DPJ_self_reliance_desc:0 "No credit, no instructors, no conditions. The Junta's army is small, badly equipped and entirely its own."
 DPJ_self_made_empire:0 "The Self-Made Empire"
 DPJ_self_made_empire_desc:0 "The Junta's land is legally its own, cored state by cored state, without a foreign signature on any of it."
 DPJ_puppet_emperor:0 "The Emperor in Our Pocket"
 DPJ_puppet_emperor_desc:0 "The child keeps his throne and the Junta keeps the country. The arrangement suits everyone except the emperor."
 DPJ_generalissimo_emperor:0 "The Generalissimo Crowned"
 DPJ_generalissimo_emperor_desc:0 "The boy is gone and the soldier wears the crown. Half the nation cheers and the other half starts writing letters."
 DPJ_second_state:0 "The Second Desprian State"
 DPJ_second_state_desc:0 "The Junta has won the succession, and the state it builds is a soldiers' state."
 DPJ_junta_cause:0 "The Junta's Cause"
 DPJ_junta_cause_desc:0 "The faction's partners have been given a stake in the new order and a reason to hold it."
 DPJ_eastern_watch:0 "The Eastern Watch"
 DPJ_eastern_watch_desc:0 "Dug in along the Directorate border, waiting for the largest army in the world to look west."
 VRE_desprian_client:0 "Desprian Client State"
 VRE_desprian_client_desc:0 "The Vrettian Junta has a client in the Desprian south, and the Generalissimo in Vrettia finds that very reassuring."
 DPJ_na_directorate:0 "The Directorate of the Nation"
 DPJ_na_directorate_desc:0 "The emergency is over and the Junta has to become something. It chooses to become the thing that never has to apologise: a national directorate, above parties, in nobody's camp."
 DPJ_na_end_emergency:0 "End the Emergency"
 DPJ_na_end_emergency_desc:0 "The curfew goes, the censorship boards go, and the army is told that it has won and can stop behaving as though it has not."
 DPJ_na_constitution:0 "A Constitution of Sorts"
 DPJ_na_constitution_desc:0 "Eleven articles, two of them about the army, and one that quietly declares the directorate permanent."
 DPJ_na_provincial_councils:0 "Reconvene the Provinces"
 DPJ_na_provincial_councils_desc:0 "The provincial councils are restored with the powers they had before the war, which is to say almost none, but they are restored."
 DPJ_na_licence_the_press:0 "Licence the Press"
 DPJ_na_licence_the_press_desc:0 "Three newspapers are permitted. Two of them are permitted to be interesting."
 DPJ_na_president_in_uniform:0 "A President in Uniform"
 DPJ_na_president_in_uniform_desc:0 "The directorate needs a face, and the only face the country trusts is one that has never been photographed without a collar."
 DPJ_na_guarantor_state:0 "The Guarantor State"
 DPJ_na_guarantor_state_desc:0 "The army stops being a government and becomes a guarantee: it will not rule, but it will decide who does."
 DPJ_na_demobilise:0 "Demobilise the War Economy"
 DPJ_na_demobilise_desc:0 "Two million men go home and the factories that fed them are told to make something else. Nobody is quite sure what."
 DPJ_na_grain_quota:0 "The Grain Quota"
 DPJ_na_grain_quota_desc:0 "The quotas are set low enough that the countryside can meet them and high enough that the cities notice."
 DPJ_na_vrettian_trade:0 "Trade with Vrettia"
 DPJ_na_vrettian_trade_desc:0 "Vrettia sells machine tools and buys wheat. It is a better arrangement than the one that was signed at rifle-point."
 DPJ_na_national_bank:0 "A National Bank"
 DPJ_na_national_bank_desc:0 "A central bank that answers to the directorate, which answers to nobody. The currency steadies almost immediately, out of relief."
 DPJ_na_roads:0 "Roads and Rails"
 DPJ_na_roads_desc:0 "The war built nothing that was not a trench. The directorate builds roads, and the countryside forgives it a little."
 DPJ_na_steady_hand:0 "A Steady Hand on the Economy"
 DPJ_na_steady_hand_desc:0 "No experiments, no five year plans, no ideology in the tariff schedule. It is the least exciting recovery in Alterian history."
 DPJ_na_officers_oath:0 "The Officers' Oath"
 DPJ_na_officers_oath_desc:0 "The oath is to the nation rather than to the Generalissimo, which is a small change on paper and a very large one in a barracks."
 DPJ_na_trim_the_staff:0 "Trim the General Staff"
 DPJ_na_trim_the_staff_desc:0 "The staff has more colonels than the army has regiments. Some of them are retired to write memoirs."
 DPJ_na_border_regiments:0 "Border Regiments"
 DPJ_na_border_regiments_desc:0 "Every frontier gets a regiment that knows the ground, the roads and the families on the other side."
 DPJ_na_air_question:0 "The Air Question"
 DPJ_na_air_question_desc:0 "The Junta spent the war looking up at other people's aircraft. It does not intend to do so again."
 DPJ_na_coastal_command:0 "Coastal Command"
 DPJ_na_coastal_command_desc:0 "A navy whose entire doctrine is that nothing large should be allowed to approach the coast unchallenged."
 DPJ_na_hedgehog:0 "The Doctrine of the Hedgehog"
 DPJ_na_hedgehog_desc:0 "No offensive plans, no grand encirclements. Every division is trained to be expensive to remove from its own soil."
 DPJ_na_envoys:0 "Envoys to Everyone"
 DPJ_na_envoys_desc:0 "Recognition is a commodity and the directorate is buying as much of it as it can afford."
 DPJ_na_neutrality_pact:0 "The Neutrality Pact"
 DPJ_na_neutrality_pact_desc:0 "A treaty with no allies in it: everybody promises not to be dragged into anybody else's war."
 DPJ_na_trade_both_sides:0 "Trade with Both Sides"
 DPJ_na_trade_both_sides_desc:0 "The directorate will sell to the Directorate of Vyratia and to its enemies in the same week, and will call that peacekeeping."
 DPJ_na_alterian_conference:0 "The Alterian Conference"
 DPJ_na_alterian_conference_desc:0 "Every crown, junta and people's committee on the continent is invited to Despria to agree that the last war was a mistake."
 DPJ_na_friends_in_the_south:0 "Friends in the South"
 DPJ_na_friends_in_the_south_desc:0 "Despria needs a port that does not freeze and neighbours who do not spy. It buys both."
 DPJ_na_armed_neutrality:0 "Armed Neutrality"
 DPJ_na_armed_neutrality_desc:0 "Neutral in speech, enormous in garrison. The directorate does not intend to be anybody's Belgium."
 DPJ_fa_national_revolution:0 "The National Revolution"
 DPJ_fa_national_revolution_desc:0 "The war is won and the Junta stops pretending to be a caretaker. There is one party now, one flag, and one man whose portrait is slightly larger than the others."
 DPJ_fa_one_party:0 "One Party, One Leader"
 DPJ_fa_one_party_desc:0 "The remaining parties are dissolved for their own protection, which is what the decree says."
 DPJ_fa_militia:0 "The Black Columns"
 DPJ_fa_militia_desc:0 "A party militia is issued rifles and a uniform that is very nearly the army's, which is the point."
 DPJ_fa_propaganda:0 "The Ministry of the Word"
 DPJ_fa_propaganda_desc:0 "Every wireless set in the country is tuned to the same station by the same decree."
 DPJ_fa_enabling_act:0 "The Enabling Act"
 DPJ_fa_enabling_act_desc:0 "The directorate is given the right to legislate without the provinces, the courts or the constitution it published last year."
 DPJ_fa_leader_cult:0 "The Leader Cult"
 DPJ_fa_leader_cult_desc:0 "Portraits in every schoolroom, a slogan on every factory wall, and a public holiday on a day nobody can quite pin down."
 DPJ_fa_corporate_state:0 "The Corporate State"
 DPJ_fa_corporate_state_desc:0 "Every trade is placed in a corporation, every corporation in a ministry, and every ministry in the party."
 DPJ_fa_autarky:0 "Autarky"
 DPJ_fa_autarky_desc:0 "Despria will grow, mine and build everything it needs, at four times the price, and call the difference sovereignty."
 DPJ_fa_conglomerates:0 "The Arms Conglomerates"
 DPJ_fa_conglomerates_desc:0 "Three families, six factories and one ministry that exists to keep the three families from shooting each other."
 DPJ_fa_labour_battalions:0 "Labour Battalions"
 DPJ_fa_labour_battalions_desc:0 "Unemployment is abolished by the simple expedient of paying nobody very much to build roads."
 DPJ_fa_synthetic:0 "Synthetic Fuel"
 DPJ_fa_synthetic_desc:0 "The empire has no oil of its own. It has coal, chemists and no patience."
 DPJ_fa_four_year:0 "The Four Year Plan"
 DPJ_fa_four_year_desc:0 "A plan drawn up by soldiers for an economy run by soldiers, with targets that are met by definition."
 DPJ_fa_war_machine:0 "The War Machine"
 DPJ_fa_war_machine_desc:0 "Everything in the country now exists to feed the army, including the parts of the country that have not been told."
 DPJ_fa_order_army:0 "The New Order Army"
 DPJ_fa_order_army_desc:0 "The army of the revolution is the old army with new colours and a much shorter list of officers."
 DPJ_fa_armoured_fist:0 "The Armoured Fist"
 DPJ_fa_armoured_fist_desc:0 "All the armour in the country is gathered into four divisions that will be used badly but with enormous confidence."
 DPJ_fa_stormtroopers:0 "Stormtroopers"
 DPJ_fa_stormtroopers_desc:0 "Young men, short training, long marches, and a doctrine that treats retreat as a rumour."
 DPJ_fa_black_air_force:0 "The Black Air Fleet"
 DPJ_fa_black_air_force_desc:0 "The party wants an air force of its own and the party usually gets what it wants."
 DPJ_fa_total_mobilisation:0 "Total Mobilisation"
 DPJ_fa_total_mobilisation_desc:0 "Every man between eighteen and forty-five is registered, and a fifth of them are told to be ready by spring."
 DPJ_fa_war_plan:0 "The War Plan"
 DPJ_fa_war_plan_desc:0 "There is a plan. It is drawn in red pencil on a map of a country that is not Despria."
 DPJ_fa_fascist_international:0 "The Fascist International"
 DPJ_fa_fascist_international_desc:0 "Despria begins writing to every party on the map that believes the same things and has the same enemies."
 DPJ_fa_snus_concord:0 "The Snus Concord"
 DPJ_fa_snus_concord_desc:0 "A nation of the far north, run by men who understand how this sort of state is supposed to work. Despria offers it an alliance in the only language that matters to either of them."
 DPJ_fa_vrettian_settlement:0 "The Vrettian Settlement"
 DPJ_fa_vrettian_settlement_desc:0 "Vrettia is told to send an ambassador who is not a general, or the next ambassador will be one."
 DPJ_fa_mortanian_claim:0 "The Mortanian Claim"
 DPJ_fa_mortanian_claim_desc:0 "The Mortanian fields fed a third of the empire before the war. The new Despria does not do requests."
 DPJ_fa_northern_pact:0 "The Northern Pact"
 DPJ_fa_northern_pact_desc:0 "The north is promised everything it wants except troops."
 DPJ_fa_iron_pact:0 "The Iron Pact"
 DPJ_fa_iron_pact_desc:0 "The Concord, the north and whatever else can be gathered are welded into one bloc with Despria at its head and a permanent war staff in its citadel."
 DES_dm_constitutional_convention:0 "The Constitutional Convention"
 DES_dm_constitutional_convention_desc:0 "The empire has been put back together with artillery. Now it is to be put back together with paper. The emperor signs before anyone asks him whether he wants to."
 DES_dm_emperor_signs:0 "The Emperor Signs"
 DES_dm_emperor_signs_desc:0 "It is a large signature, carefully practised, and it turns the empire into a monarchy that is merely allowed rather than granted."
 DES_dm_free_elections:0 "Free Elections"
 DES_dm_free_elections_desc:0 "Everyone is surprised by this, including the parties that suddenly have to produce candidates."
 DES_dm_free_press:0 "A Free Press"
 DES_dm_free_press_desc:0 "The new papers are small, badly printed and read by everyone."
 DES_dm_franchise:0 "Widen the Franchise"
 DES_dm_franchise_desc:0 "Property qualifications, removed. The landed estates are to be outnumbered in their own country."
 DES_dm_chamber:0 "The Chamber of Provinces"
 DES_dm_chamber_desc:0 "A second chamber with real powers, one seat per province, and a rule that the emperor may not appoint by-elections."
 DES_dm_crowned_republic:0 "A Crowned Republic"
 DES_dm_crowned_republic_desc:0 "The empire is now a country governed by parliaments, presided over by a king who is no longer permitted to declare anything but the harvest."
 DES_dm_markets:0 "Open the Markets"
 DES_dm_markets_desc:0 "The new government's first act is to remove the tariffs, and its second is to apologise for the individuals who took advantage of them."
 DES_dm_land_reform:0 "Land Reform"
 DES_dm_land_reform_desc:0 "The estates are broken up and sold to their tenants, which pays off the rumours of a second revolution better than any decree could."
 DES_dm_vrettian_loan:0 "The Vrettian Loan"
 DES_dm_vrettian_loan_desc:0 "Money from the Vrettian banks at a rate the previous government would have gone to war over."
 DES_dm_trade_treaties:0 "Trade Treaties"
 DES_dm_trade_treaties_desc:0 "Treaties with every nation that will sign one, and a substantial agreement with the ones that will not."
 DES_dm_merchant_marine:0 "The Merchant Marine"
 DES_dm_merchant_marine_desc:0 "A country with no colonies and one coastline has discovered that freight is cheaper than fleets."
 DES_dm_boom:0 "The Long Boom"
 DES_dm_boom_desc:0 "Six good years. Nobody in the government plans to be in power when the sixth one ends."
 DES_dm_guard:0 "The Constitutional Guard"
 DES_dm_guard_desc:0 "The army's first loyalty is now to a document, and the document is carried in a case with a lock."
 DES_dm_civilian_control:0 "Civilian Control"
 DES_dm_civilian_control_desc:0 "The war ministry is given to a lawyer who has never worn a uniform, and the general staff is asked to be patient with him."
 DES_dm_reserves:0 "The Reserves"
 DES_dm_reserves_desc:0 "The army shrinks and the reserve grows, which is cheaper, more popular, and much harder to stage a coup with."
 DES_dm_navy_first:0 "The Navy First"
 DES_dm_navy_first_desc:0 "Coastal defence and merchant protection: the two tasks the new parliament can agree on, and the only two it will pay for."
 DES_dm_air_ministry:0 "The Air Ministry"
 DES_dm_air_ministry_desc:0 "The newest service gets its own ministry, largely because it is the only one with no generals in it."
 DES_dm_defensive_doctrine:0 "The Defensive Doctrine"
 DES_dm_defensive_doctrine_desc:0 "No plan assumes Despria will start the next war. The plans are all about finishing one."
 DES_dm_neutrality:0 "Neutrality, Written Down"
 DES_dm_neutrality_desc:0 "Neutrality is put in the constitution, where it is harder to be talked out of than it was in the old emperor's letters."
 DES_dm_borders:0 "Borders on the Map"
 DES_dm_borders_desc:0 "Every border is surveyed, marked and published, which half the neighbours find reassuring and the other half find insulting."
 DES_dm_league:0 "The Alterian League"
 DES_dm_league_desc:0 "A league of the continent's smaller powers, convened in Despria, with a charter and no army whatsoever."
 DES_dm_itsany:0 "An Understanding with Itsany"
 DES_dm_itsany_desc:0 "Itsany has grain and ships; Despria has coal and neighbours. Neither wants to discuss the last war."
 DES_dm_guarantees:0 "Guarantees for the Small"
 DES_dm_guarantees_desc:0 "Despria guarantees the independence of three countries it could not defend if it tried. The gesture is what is being bought."
 DES_dm_peace_bloc:0 "The Peace Bloc"
 DES_dm_peace_bloc_desc:0 "Half the continent now signs its treaties in Despria, in a room with no portraits of soldiers in it."
 DES_cm_second_revolution:0 "The Second Revolution"
 DES_cm_second_revolution_desc:0 "The war ended, the soldiers came home to factories that had been closed for six years, and the empire discovered that it had one more revolution in it."
 DES_cm_councils:0 "The Workers' Councils"
 DES_cm_councils_desc:0 "Every factory elects a council, every council sends a delegate, and every delegate is very carefully vetted by the party."
 DES_cm_abdicate:0 "The Crown Abdicates"
 DES_cm_abdicate_desc:0 "The emperor is permitted to leave with his library. He takes four hundred crates and none of the silver."
 DES_cm_commissars:0 "The People's Commissars"
 DES_cm_commissars_desc:0 "Ministries are renamed, the men running them are not, and the country is assured that the difference is everything."
 DES_cm_congress:0 "The Party Congress"
 DES_cm_congress_desc:0 "Two thousand delegates, one agenda, and a vote that everyone already knows the result of."
 DES_cm_literacy:0 "Literacy and the Party Line"
 DES_cm_literacy_desc:0 "Reading classes in every village, and one textbook in every reading class."
 DES_cm_republic:0 "The Socialist Republic"
 DES_cm_republic_desc:0 "The empire is formally abolished and replaced by a federation of workers' republics, which will be governed from the same building as the empire."
 DES_cm_nationalise:0 "Nationalise the Estates"
 DES_cm_nationalise_desc:0 "The noble houses are compensated in bonds that will be worth nothing within the year. The bonds are not the point."
 DES_cm_collectivise:0 "Collectivise the Farms"
 DES_cm_collectivise_desc:0 "The farms are merged into collectives, the collectives into districts, and the districts into a ministry that has never grown anything."
 DES_cm_electrify:0 "Electrify the Empire"
 DES_cm_electrify_desc:0 "Every province gets a power station and a slogan about the power station."
 DES_cm_five_year:0 "The Five Year Plan"
 DES_cm_five_year_desc:0 "The targets are drawn up by men with maps, and revised by men with telephones, and announced by men with microphones."
 DES_cm_heavy_industry:0 "Heavy Industry First"
 DES_cm_heavy_industry_desc:0 "Nobody is to make a consumer good until the country can make a locomotive without asking anybody's permission."
 DES_cm_workers_state:0 "The Workers' State"
 DES_cm_workers_state_desc:0 "After six years of rationing and two revolutions, the Workers' State is finally able to announce that there will be slightly more bread."
 DES_cm_red_guard:0 "The Red Guard"
 DES_cm_red_guard_desc:0 "The party militia is folded into the army, and the army is folded into the party. The commissions are the same men either way."
 DES_cm_political_officers:0 "Commissars in the Ranks"
 DES_cm_political_officers_desc:0 "Every company gets an officer whose job is the political reliability of the officer commanding the company."
 DES_cm_militia:0 "The People's Militia"
 DES_cm_militia_desc:0 "Every worker gets a rifle and three weeks' training, and the general staff is assured that this is not what it looks like."
 DES_cm_armour:0 "Mass Armour"
 DES_cm_armour_desc:0 "Tanks built to a design that is cheap, simple, and can be assembled by a factory that has been given six weeks' warning."
 DES_cm_air:0 "The Red Air Fleet"
 DES_cm_air_desc:0 "Aircraft are produced in numbers rather than quality, and the pilots are told that ramming is a legitimate tactic."
 DES_cm_defence:0 "Defence of the Revolution"
 DES_cm_defence_desc:0 "Every plan, every doctrine and every fortification now exists to answer one question: what happens when everyone else comes."
 DES_cm_comintern:0 "The Comintern Question"
 DES_cm_comintern_desc:0 "Whether the revolution is Despria's or the world's. The argument lasts three days and is settled in favour of both."
 DES_cm_envoys:0 "Fraternal Envoys"
 DES_cm_envoys_desc:0 "Embassies are opened in every capital that will have them, staffed by men who are diplomats second and party members first."
 DES_cm_pdv:0 "The Directorate's Example"
 DES_cm_pdv_desc:0 "Vyratia made this work first, on a larger country, without a civil war. Despria sends observers and comes back with a great many notebooks."
 DES_cm_export:0 "Revolution for Export"
 DES_cm_export_desc:0 "Money, printers and rifles are made available to the parties of the working class everywhere on the map, discreetly, in crates."
 DES_cm_allies:0 "Allies of the Workers"
 DES_cm_allies_desc:0 "The republic will sign with anyone who will sign, without asking too closely what their workers think of them."
 DES_cm_east:0 "The Class War in the East"
 DES_cm_east_desc:0 "The largest country on the globe is now a workers' state. Despria intends to be a better one, and says so in every broadcast."

 DPJ_armed_neutrality:0 "Armed Neutrality"
 DPJ_armed_neutrality_desc:0 "The directorate is neutral in every forum and enormous in every garrison. It will not join anybody's war and does not intend to be caught without one of its own."
 DPJ_iron_concord:0 "The Iron Concord"
 DPJ_iron_concord_desc:0 "A bloc of like-minded states bound to Despria by treaty, ideology and the shared certainty that they will be the ones writing the next peace."
 DES_constitutional_empire:0 "The Crowned Republic"
 DES_constitutional_empire_desc:0 "An empire that has decided to be governed by argument rather than by inheritance - and has kept the crown, because it turns out to be useful when dealing with the neighbours."
 DES_workers_republic:0 "The Workers' Republic"
 DES_workers_republic_desc:0 "The estates are gone, the crown is gone, and the country is now run by councils, committees and a party that assures everyone it is only holding the ladder."
