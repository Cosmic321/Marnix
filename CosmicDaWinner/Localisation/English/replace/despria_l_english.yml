l_english:
 DES_the_young_emperor:0 "The Young Emperor"
 DES_the_young_emperor_desc:0 "He is nineteen, he has never commanded anything, and the portrait on every wall shows a boy trying not to blink. The court will rule through him, and everyone in the room knows it."
 DES_the_court_of_the_child_king:0 "The Court of the Child King"
 DES_the_court_of_the_child_king_desc:0 "Chamberlains, aunts and generals orbit the throne. Whoever holds the boy's ear holds the state."
 DES_silence_the_agitators:0 "Silence the Agitators"
 DES_silence_the_agitators_desc:0 "The communist cells in the mill towns and the liberal salons in the capital are, officially, the same problem."
 DES_the_imperial_question:0 "The Imperial Question"
 DES_the_imperial_question_desc:0 "Federation or restoration. The court has argued about it for a year; the emperor must now choose."
 DES_federate_the_empire:0 "Federate the Empire"
 DES_federate_the_empire_desc:0 "Cave to the protesters: an imperial federation with real provincial rights, and every acre of the old empire written into the constitution as core territory."
 DES_proclaim_the_restoration:0 "Proclaim the Restoration"
 DES_proclaim_the_restoration_desc:0 "Banners, a coronation, and a speech written by five different men."
 DES_purge_the_staff:0 "Purge the Rotting Staff"
 DES_purge_the_staff_desc:0 "The defeat at Vrettian hands was not the emperor's fault, but the men who lost it are still drawing salaries."
 DES_the_new_model_army:0 "The New Model Army"
 DES_the_new_model_army_desc:0 "Promotion by competence, at least on paper, and a general staff that has actually read a map."
 DES_the_vrettian_question:0 "The Vrettian Question"
 DES_the_vrettian_question_desc:0 "Vrettia swears fealty and plots anyway, and the Generalissimo grows tired of the boy on the throne."
 DES_reclaim_the_margravate:0 "Reclaim the Margravate"
 DES_reclaim_the_margravate_desc:0 "The Mortanian fields fed a third of the empire. Their loss is measured in bread prices in the capital."
 DES_requisition_the_estates:0 "Requisition the Estates"
 DES_requisition_the_estates_desc:0 "The noble houses have grain, horses and sons. The war effort requires all three."
 DES_reopen_the_pits:0 "Reopen the Northern Pits"
 DES_reopen_the_pits_desc:0 "The southern mines went with the Itsany republic. What is left is thin, deep and expensive, but it is ours."
 DES_rationalise_the_railways:0 "Rationalise the Railways"
 DES_rationalise_the_railways_desc:0 "One gauge, one timetable, one ministry. The provinces will complain about all three."
 DES_the_old_order:0 "The Old Order"
 DES_the_old_order_desc:0 "No federation and no concessions: the empire is to be restored as it was, and the whole faction bound to it."
 DES_bind_the_duchies:0 "Bind the Duchies"
 DES_bind_the_duchies_desc:0 "Strength in numbers. Every partner of the empire is given a reason to stay."
 DES_the_question_of_the_junta:0 "The Question of the Junta"
 DES_the_question_of_the_junta_desc:0 "Two years of pretending. The Junta holds ten states and calls itself a caretaker. The empire answers with artillery."
 DES_the_empire_reborn:0 "The Empire Reborn"
 DES_the_empire_reborn_desc:0 "One crown, one army, one border."
 DES_fortify_the_east:0 "Fortify the East"
 DES_fortify_the_east_desc:0 "The Directorate is the largest nation on the globe and it has not stopped looking west."
 DPJ_the_generalissimo:0 "The Generalissimo"
 DPJ_the_generalissimo_desc:0 "He has the army, the telephones and the loyalty of nine men. What he does not have is the capital."
 DPJ_martial_law:0 "Martial Law"
 DPJ_martial_law_desc:0 "The streets are patrolled, the newspapers are censored, and the curfew is announced by a man who has clearly never walked home after dark."
 DPJ_silence_the_street:0 "Silence the Street"
 DPJ_silence_the_street_desc:0 "The communist agitators and the liberal petitioners are given the same answer, and it is not an answer."
 DPJ_the_junta_army:0 "The Army of the Junta"
 DPJ_the_junta_army_desc:0 "The only institution in the country that still works. It will be the model for everything else."
 DPJ_court_the_vrettians:0 "Court the Vrettians"
 DPJ_court_the_vrettians_desc:0 "Vrettia replaced Despria as hegemon of Alteria. Hegemons are cheaper to borrow from than to fight."
 DPJ_accept_the_vrettian_offer:0 "Accept the Vrettian Offer"
 DPJ_accept_the_vrettian_offer_desc:0 "Rifles, instructors and machine tools, delivered on credit and with conditions attached."
 DPJ_the_price_of_aid:0 "The Price of Aid"
 DPJ_the_price_of_aid_desc:0 "The Junta signs. Vrettia gains a satellite; the Generalissimo gains his equipment and loses his independence."
 DPJ_refuse_the_vrettian_offer:0 "Refuse the Vrettian Offer"
 DPJ_refuse_the_vrettian_offer_desc:0 "No credit, no instructors, no conditions. The Junta will arm itself, badly, and owe nobody anything."
 DPJ_a_message_to_vrettia:0 "A Message to Vrettia"
 DPJ_a_message_to_vrettia_desc:0 "The Generalissimo does not intend to beg. He intends to be inconvenient."
 DPJ_the_empire_without_them:0 "The Empire Without Them"
 DPJ_the_empire_without_them_desc:0 "Every state the Junta holds becomes core territory: a Despria that belongs to its own people rather than to a treaty."
 DPJ_the_child_emperor:0 "The Child Emperor"
 DPJ_the_child_emperor_desc:0 "The boy is in the palace, surrounded by courtiers and entirely without an army. Something must be decided about him."
 DPJ_the_emperor_in_our_pocket:0 "The Emperor in Our Pocket"
 DPJ_the_emperor_in_our_pocket_desc:0 "He keeps the throne, the title and the ceremonial sword. The Generalissimo keeps the government."
 DPJ_the_generalissimo_crowned:0 "The Generalissimo Crowned"
 DPJ_the_generalissimo_crowned_desc:0 "The boy is retired, quietly. The Junta's commander takes the crown by right of holding the only divisions that work."
 DPJ_march_on_the_capital:0 "March on the Capital"
 DPJ_march_on_the_capital_desc:0 "Two years of interim government and the succession is still unresolved. The Junta will resolve it."
 DPJ_the_second_desprian_state:0 "The Second Desprian State"
 DPJ_the_second_desprian_state_desc:0 "The Empire is gone and the Junta has won. What it builds is a soldiers' state from the first paragraph of its constitution."
 DPJ_prepare_for_the_directorate:0 "Prepare for the Directorate"
 DPJ_prepare_for_the_directorate_desc:0 "Vyratia is the largest nation in the world and its agitators are already in the border towns."
 DES_dismembered_empire:0 "The Dismembered Empire"
 DES_dismembered_empire_desc:0 "The western farmlands are communist, the southern mines are Itsany, and the Mortanian margravate is gone. The north starves on imported grain and its factories idle for want of steel."
 DES_rotting_staff:0 "The Rotting Staff"
 DES_rotting_staff_desc:0 "The army that lost to Vrettia is still the army that exists. Its colonels bought their commissions and its logistics are a rumour."
 DES_federated_empire:0 "The Federated Empire"
 DES_federated_empire_desc:0 "An empire of provinces rather than of subjects. Uglier than the old constitution, and it works."
 DES_new_army:0 "The New Model Army"
 DES_new_army_desc:0 "A staff that plans, officers promoted for competence, and a supply system that has been read by more than one person."
 DES_vrettian_revanchism:0 "Vrettian Revanchism"
 DES_vrettian_revanchism_desc:0 "The defeat is remembered, and the men who remember it are now being handed rifles."
 DES_requisitions:0 "Requisitions"
 DES_requisitions_desc:0 "The estates are emptied into the war effort. The peasants notice, the noble houses complain, and the granaries are full."
 DES_northern_pits:0 "The Northern Pits"
 DES_northern_pits_desc:0 "Thin seams, deep shafts and coal bought at the price of men. It keeps the mills turning."
 DES_railways:0 "Rationalised Railways"
 DES_railways_desc:0 "One timetable for the whole empire, for the first time in its history."
 DES_restored_order:0 "The Old Order"
 DES_restored_order_desc:0 "The empire as it was: crown, hierarchy and obedience, with no federal nonsense to dilute any of it."
 DES_imperial_cause:0 "The Imperial Cause"
 DES_imperial_cause_desc:0 "The empire's partners have been given a stake in its restoration, and a reason to fight for it."
 DES_empire_reborn:0 "The Empire Reborn"
 DES_empire_reborn_desc:0 "One crown, one army, one border, and a staff that no longer loses wars by accident."
 DES_eastern_wall:0 "The Eastern Wall"
 DES_eastern_wall_desc:0 "Concrete, wire and dug-in guns along the Directorate border, because the Directorate is coming."
 DPJ_government_that_does_not_exist:0 "A Government That Does Not Exist"
 DPJ_government_that_does_not_exist_desc:0 "The Junta administers ten states without a constitution, a parliament or any legal basis beyond martial law and momentum."
 DPJ_junta_army:0 "The Junta's Army"
 DPJ_junta_army_desc:0 "The officer corps of the caretaker government: competent, political, and personally loyal to the Generalissimo."
 DPJ_vrettian_sponsorship:0 "Vrettian Sponsorship"
 DPJ_vrettian_sponsorship_desc:0 "Vrettian rifles and machine tools arrive on credit. The officers grumble about the strings attached, and then sign for the shipment."
 DPJ_vrettian_satellite:0 "A Vrettian Satellite"
 DPJ_vrettian_satellite_desc:0 "The Junta governs, but Vrettia decides what it may govern. The rifles are being paid for in sovereignty."
 DPJ_self_reliance:0 "Self-Reliance"
 DPJ_self_reliance_desc:0 "No credit, no instructors, no conditions. The Junta's army is small, badly equipped and entirely its own."
 DPJ_self_made_empire:0 "The Self-Made Empire"
 DPJ_self_made_empire_desc:0 "The Junta's land is legally its own, cored state by cored state, without a foreign signature on any of it."
 DPJ_puppet_emperor:0 "The Emperor in Our Pocket"
 DPJ_puppet_emperor_desc:0 "The child keeps his throne and the Junta keeps the country. The arrangement suits everyone except the emperor."
 DPJ_generalissimo_emperor:0 "The Generalissimo Crowned"
 DPJ_generalissimo_emperor_desc:0 "The boy is gone and the soldier wears the crown. Half the nation cheers and the other half starts writing letters."
 DPJ_second_state:0 "The Second Desprian State"
 DPJ_second_state_desc:0 "The Junta has won the succession, and the state it builds is a soldiers' state."
 DPJ_junta_cause:0 "The Junta's Cause"
 DPJ_junta_cause_desc:0 "The faction's partners have been given a stake in the new order and a reason to hold it."
 DPJ_eastern_watch:0 "The Eastern Watch"
 DPJ_eastern_watch_desc:0 "Dug in along the Directorate border, waiting for the largest army in the world to look west."
 VRE_desprian_client:0 "Desprian Client State"
 VRE_desprian_client_desc:0 "The Vrettian Junta has a client in the Desprian south, and the Generalissimo in Vrettia finds that very reassuring."

 DPJ_na_hub:0 "The Directorate of the Nation"
 DPJ_na_hub_desc:0 "The Junta has won and now has to become something. It chooses to become the thing that never has to apologise: a national directorate, above parties, in nobody's camp."
 DPJ_na_cost:0 "Count the Cost"
 DPJ_na_cost_desc:0 "Six years of civil war, two armies and a frontier that moved four times. The dead are counted by village, and the count is not finished."
 DPJ_na_rubble:0 "Clear the Rubble"
 DPJ_na_rubble_desc:0 "The towns that changed hands four times have nothing left standing but the walls, and the walls are full of people."
 DPJ_na_civil:0 "Houses Before Guns"
 DPJ_na_civil_desc:0 "The first budget after the war is spent on roofs, drains and tramlines. The staff college is told to wait."
 DPJ_na_civil2:0 "Feed the Cities"
 DPJ_na_civil2_desc:0 "Empty factories and full warehouses. The directorate fixes the one that is cheaper to fix."
 DPJ_na_civil3:0 "Schools and Clinics"
 DPJ_na_civil3_desc:0 "A school in every district and a doctor in every second one - the cheapest way to make a military government popular."
 DPJ_na_milit:0 "Guns Before Houses"
 DPJ_na_milit_desc:0 "The war ended in a ceasefire, not a settlement. The directorate rebuilds what it knows how to rebuild."
 DPJ_na_milit2:0 "Rebuild the Arsenals"
 DPJ_na_milit2_desc:0 "The arsenals were the last thing the Junta held. They are also the first thing it reopens."
 DPJ_na_milit3:0 "The Veterans' Levy"
 DPJ_na_milit3_desc:0 "Every man who served is given a rifle to keep at home and a place in the reserve. It is cheaper than a pension and much more visible."
 DPJ_na_works:0 "A Country That Works Again"
 DPJ_na_works_desc:0 "Streetlights, tram timetables, a post office that answers letters. Whoever is in charge, this is what they will be judged on."
 DPJ_na_armyq:0 "The Army Question"
 DPJ_na_armyq_desc:0 "The staff has two plans and no money for both. Whatever survives the argument will shape the army for the next twenty years."
 DPJ_na_armour:0 "Mechanised Columns"
 DPJ_na_armour_desc:0 "The staff wants speed: one armoured column per border, each able to be somewhere else by the second day."
 DPJ_na_armour2:0 "Tank Workshops"
 DPJ_na_armour2_desc:0 "A tank works is a tractor works with a different set of drawings, and the directorate has three tractor works."
 DPJ_na_armour3:0 "The Armoured Corps"
 DPJ_na_armour3_desc:0 "A corps of its own, with its own school, because nothing else in the army will teach it properly."
 DPJ_na_infantry:0 "Infantry and Artillery"
 DPJ_na_infantry_desc:0 "The army that won the war was made of men, guns and mules. The directorate sees no reason to argue with the result."
 DPJ_na_infantry2:0 "The Gun Foundries"
 DPJ_na_infantry2_desc:0 "Artillery is cheap, survives its own mistakes and can be built in any of the provinces."
 DPJ_na_infantry3:0 "The Mass Army"
 DPJ_na_infantry3_desc:0 "Every district a regiment, every regiment a battery. It is not elegant and it does not need to be."
 DPJ_na_newmodel:0 "The New Model Army"
 DPJ_na_newmodel_desc:0 "One doctrine, one staff college, one set of manuals - and a generation of officers who have only ever been taught the version that won."
 DPJ_na_pol1:0 "Suspend the Emergency"
 DPJ_na_pol1_desc:0 "The curfew goes, the censorship boards go, and the army is told it has won and can stop behaving as though it has not."
 DPJ_na_pol2:0 "A Constitution of Sorts"
 DPJ_na_pol2_desc:0 "Eleven articles, two of them about the army, and one that quietly makes the directorate permanent."
 DPJ_na_pol3:0 "Reconvene the Provinces"
 DPJ_na_pol3_desc:0 "The provincial councils are restored with the powers they had before the war, which is to say almost none, but they are restored."
 DPJ_na_pol4:0 "A President in Uniform"
 DPJ_na_pol4_desc:0 "The directorate needs a face, and the only face the country trusts has never been photographed without a collar."
 DPJ_na_pol5:0 "The Guarantor State"
 DPJ_na_pol5_desc:0 "The army stops being a government and becomes a guarantee: it will not rule, but it will decide who does."
 DPJ_na_for1:0 "Envoys to Everyone"
 DPJ_na_for1_desc:0 "Recognition is a commodity and the directorate is buying as much of it as it can afford."
 DPJ_na_for2:0 "The Neutrality Pact"
 DPJ_na_for2_desc:0 "A treaty with no allies in it: everybody promises not to be dragged into anybody else's war."
 DPJ_na_for3:0 "Trade with Both Sides"
 DPJ_na_for3_desc:0 "The directorate will sell to the Directorate of Vyratia and to its enemies in the same week, and will call that peacekeeping."
 DPJ_na_for4:0 "The Alterian Conference"
 DPJ_na_for4_desc:0 "Every crown, junta and people's committee on the continent is invited to Despria to agree that the last war was a mistake."
 DPJ_na_for5:0 "Friends in the South"
 DPJ_na_for5_desc:0 "Despria needs a port that does not freeze and neighbours who do not spy. It buys both."
 DPJ_na_cap:0 "Armed Neutrality"
 DPJ_na_cap_desc:0 "Neutral in speech, enormous in garrison. The directorate has no intention of being anybody's Belgium."
 DPJ_fa_hub:0 "The National Revolution"
 DPJ_fa_hub_desc:0 "The war is won and the Junta stops pretending to be a caretaker. There is one party now, one flag, and one man whose portrait is slightly larger than the others."
 DPJ_fa_cost:0 "Count the Cost"
 DPJ_fa_cost_desc:0 "The war is over and the state has to explain what it was for. The files on the dead are organised; the dead are not."
 DPJ_fa_rubble:0 "Clear the Rubble"
 DPJ_fa_rubble_desc:0 "The towns that changed hands four times have nothing left standing but the walls, and the walls are full of people."
 DPJ_fa_civil:0 "Bread Before Battleships"
 DPJ_fa_civil_desc:0 "The party has promised that nobody will starve under the new order, and the new order has to deliver before the novelty wears off."
 DPJ_fa_civil2:0 "The Party Ration"
 DPJ_fa_civil2_desc:0 "Ration cards are issued by the party, not by the state, which is either efficiency or the whole point."
 DPJ_fa_civil3:0 "Strength Through Joy"
 DPJ_fa_civil3_desc:0 "Cinemas, holiday trains and a sports stadium in the capital, all of them very cheap and all of them very well photographed."
 DPJ_fa_milit:0 "Battleships Before Bread"
 DPJ_fa_milit_desc:0 "The next war is a matter of when. The next war is won with steel, not with bakeries."
 DPJ_fa_milit2:0 "Rebuild the Arsenals"
 DPJ_fa_milit2_desc:0 "Three shifts, no holidays, and a bonus for every barrel that leaves the gate ahead of schedule."
 DPJ_fa_milit3:0 "The Standing Levy"
 DPJ_fa_milit3_desc:0 "Two years in uniform for every young man, whatever his family thinks about it."
 DPJ_fa_works:0 "A Country That Works Again"
 DPJ_fa_works_desc:0 "Streetlights, tram timetables, a post office that answers letters. Whoever is in charge, this is what they will be judged on."
 DPJ_fa_armyq:0 "The Army Question"
 DPJ_fa_armyq_desc:0 "The staff has two plans and no money for both. Whatever survives the argument will shape the army for the next twenty years."
 DPJ_fa_armour:0 "The Armoured Fist"
 DPJ_fa_armour_desc:0 "All the armour in the country gathered into four divisions, to be used badly but with enormous confidence."
 DPJ_fa_armour2:0 "The Panzer Schools"
 DPJ_fa_armour2_desc:0 "A school for officers who will fight from inside a tank rather than from behind a desk."
 DPJ_fa_armour3:0 "The Armoured Corps"
 DPJ_fa_armour3_desc:0 "A corps with its own flag, its own march and a standing rivalry with the infantry that the party finds useful."
 DPJ_fa_infantry:0 "The Mass Infantry"
 DPJ_fa_infantry_desc:0 "The revolution is defended by men with rifles, and there are a great many men with rifles."
 DPJ_fa_infantry2:0 "Infantry Guns"
 DPJ_fa_infantry2_desc:0 "Every regiment a battery of light guns, towed by whatever the farms can spare."
 DPJ_fa_infantry3:0 "The Nation in Arms"
 DPJ_fa_infantry3_desc:0 "Every district a regiment, every regiment a party cell, every cell a report."
 DPJ_fa_newmodel:0 "The New Model Army"
 DPJ_fa_newmodel_desc:0 "One doctrine, one staff college, one set of manuals - and a generation of officers who have only ever been taught the version that won."
 DPJ_fa_pol1:0 "One Party, One Leader"
 DPJ_fa_pol1_desc:0 "The remaining parties are dissolved for their own protection, which is what the decree says."
 DPJ_fa_pol2:0 "The Black Columns"
 DPJ_fa_pol2_desc:0 "A party militia is issued rifles and a uniform very nearly the army's, which is the point."
 DPJ_fa_pol3:0 "The Ministry of the Word"
 DPJ_fa_pol3_desc:0 "Every wireless set in the country is tuned to the same station by the same decree."
 DPJ_fa_pol4:0 "The Enabling Act"
 DPJ_fa_pol4_desc:0 "The directorate may legislate without the provinces, the courts or the constitution it published last year."
 DPJ_fa_pol5:0 "The Corporate State"
 DPJ_fa_pol5_desc:0 "Every trade is placed in a corporation, every corporation in a ministry, and every ministry in the party."
 DPJ_fa_for1:0 "The Party Abroad"
 DPJ_fa_for1_desc:0 "Despria begins writing to every movement on the map that believes the same things and has the same enemies."
 DPJ_fa_for2:0 "Cells and Printers"
 DPJ_fa_for2_desc:0 "Printing presses, couriers and money travel in diplomatic bags, which is what diplomatic bags are for."
 DPJ_fa_for3:0 "Brothers in the North"
 DPJ_fa_for3_desc:0 "The northern parties are invited to Despria for a congress that is not quite a congress and not quite a command."
 DPJ_fa_for4:0 "The Revolutionary War"
 DPJ_fa_for4_desc:0 "Where the ballot is refused, the column is sent. Despria has decided that it is entitled to finish other countries' arguments."
 DPJ_fa_for5:0 "The Fascist International"
 DPJ_fa_for5_desc:0 "A permanent secretariat in the capital, delegates from six movements, and one agenda written by one man."
 DPJ_fa_cap:0 "The Iron Concord"
 DPJ_fa_cap_desc:0 "A bloc of like-minded states bound to Despria by treaty, ideology and the shared certainty that they will be writing the next peace."
 DES_dm_hub:0 "The Constitutional Convention"
 DES_dm_hub_desc:0 "The empire has been put back together with artillery. Now it is to be put back together with paper. The emperor signs before anybody asks him whether he wants to."
 DES_dm_cost:0 "Count the Cost"
 DES_dm_cost_desc:0 "The empire is whole again on paper. The provinces have to be persuaded that this is a good thing, one ration card at a time."
 DES_dm_rubble:0 "Clear the Rubble"
 DES_dm_rubble_desc:0 "The towns that changed hands four times have nothing left standing but the walls, and the walls are full of people."
 DES_dm_civil:0 "Houses Before Guns"
 DES_dm_civil_desc:0 "The first democratic budget is spent on housing, and the opposition calls it the end of the empire. The housing is very popular."
 DES_dm_civil2:0 "The Reconstruction Ministry"
 DES_dm_civil2_desc:0 "One ministry, four thousand clerks and a rule that no province may be rebuilt twice before every province has been rebuilt once."
 DES_dm_civil3:0 "Schools, Clinics and Pensions"
 DES_dm_civil3_desc:0 "The three things a new parliament can actually deliver, in the order in which they win votes."
 DES_dm_milit:0 "Guns Before Houses"
 DES_dm_milit_desc:0 "The army that won the war is not to be left holding a treaty and nothing else. The general staff makes this clear in writing."
 DES_dm_milit2:0 "The Arsenals Reopen"
 DES_dm_milit2_desc:0 "The state arsenals are reopened under civilian management, which is the compromise that lets everybody vote for it."
 DES_dm_milit3:0 "The Reserves"
 DES_dm_milit3_desc:0 "A smaller standing army and a much larger reserve: cheaper, more popular, and much harder to stage a coup with."
 DES_dm_works:0 "A Country That Works Again"
 DES_dm_works_desc:0 "Streetlights, tram timetables, a post office that answers letters. Whoever is in charge, this is what they will be judged on."
 DES_dm_armyq:0 "The Army Question"
 DES_dm_armyq_desc:0 "The staff has two plans and no money for both. Whatever survives the argument will shape the army for the next twenty years."
 DES_dm_armour:0 "The Armoured Column"
 DES_dm_armour_desc:0 "A small, expensive, professional armoured force, on the theory that the next war will be short."
 DES_dm_armour2:0 "The Tank Works"
 DES_dm_armour2_desc:0 "One works, one design, one very long argument about whether the engine should be built in the capital or the provinces."
 DES_dm_armour3:0 "The Armoured Corps"
 DES_dm_armour3_desc:0 "A corps with a proper staff and a budget that the parliament renews every year, grudgingly."
 DES_dm_infantry:0 "Infantry and Artillery"
 DES_dm_infantry_desc:0 "The mass army that won the last war, kept on and made cheaper. Every province gets a regiment and a battery."
 DES_dm_infantry2:0 "The Gun Foundries"
 DES_dm_infantry2_desc:0 "Artillery built to one pattern in four provinces, so that no single closure can disarm the country."
 DES_dm_infantry3:0 "The Territorial Army"
 DES_dm_infantry3_desc:0 "Every district a battalion, every battalion a drill hall, every drill hall a very long lease."
 DES_dm_newmodel:0 "The New Model Army"
 DES_dm_newmodel_desc:0 "One doctrine, one staff college, one set of manuals - and a generation of officers who have only ever been taught the version that won."
 DES_dm_pol1:0 "The Emperor Signs"
 DES_dm_pol1_desc:0 "It is a large signature, carefully practised, and it turns the empire into a monarchy that is merely allowed rather than granted."
 DES_dm_pol2:0 "Free Elections"
 DES_dm_pol2_desc:0 "Everyone is surprised by this, including the parties that suddenly have to produce candidates."
 DES_dm_pol3:0 "A Free Press"
 DES_dm_pol3_desc:0 "The new papers are small, badly printed and read by everyone."
 DES_dm_pol4:0 "Widen the Franchise"
 DES_dm_pol4_desc:0 "Property qualifications, removed. The landed estates are to be outnumbered in their own country."
 DES_dm_pol5:0 "The Chamber of Provinces"
 DES_dm_pol5_desc:0 "A second chamber with real powers, one seat per province, and a rule that the emperor may not appoint by-elections."
 DES_dm_for1:0 "Neutrality, Written Down"
 DES_dm_for1_desc:0 "Neutrality is put in the constitution, where it is harder to be talked out of than it was in the old emperor's letters."
 DES_dm_for2:0 "Borders on the Map"
 DES_dm_for2_desc:0 "Every border is surveyed, marked and published, which half the neighbours find reassuring and the other half find insulting."
 DES_dm_for3:0 "The Alterian League"
 DES_dm_for3_desc:0 "A league of the continent's smaller powers, convened in Despria, with a charter and no army whatsoever."
 DES_dm_for4:0 "An Understanding with Itsany"
 DES_dm_for4_desc:0 "Itsany has grain and ships; Despria has coal and neighbours. Neither wants to discuss the last war."
 DES_dm_for5:0 "Guarantees for the Small"
 DES_dm_for5_desc:0 "Despria guarantees the independence of three countries it could not defend if it tried. The gesture is what is being bought."
 DES_dm_cap:0 "The Crowned Republic"
 DES_dm_cap_desc:0 "An empire that has decided to be governed by argument rather than by inheritance - and has kept the crown, because it turns out to be useful when dealing with the neighbours."
 DES_cm_hub:0 "The Second Revolution"
 DES_cm_hub_desc:0 "The war ended, the soldiers came home to factories that had been closed for six years, and the empire discovered that it had one more revolution in it."
 DES_cm_cost:0 "Count the Cost"
 DES_cm_cost_desc:0 "The revolution has won and inherited a country that cannot feed itself, and every promise made in the last six years now has a due date."
 DES_cm_rubble:0 "Clear the Rubble"
 DES_cm_rubble_desc:0 "The towns that changed hands four times have nothing left standing but the walls, and the walls are full of people."
 DES_cm_civil:0 "Bread Before Battleships"
 DES_cm_civil_desc:0 "The first decree of the workers' republic is a bread ration that is actually honoured, which is more than the empire ever managed."
 DES_cm_civil2:0 "The Housing Commune"
 DES_cm_civil2_desc:0 "Empty palaces, empty barracks and a great many families. The communes are given the keys and told to work it out."
 DES_cm_civil3:0 "Clinics in Every District"
 DES_cm_civil3_desc:0 "Free clinics, staffed by doctors who are told that their patients now outrank them."
 DES_cm_milit:0 "Steel Before Bread"
 DES_cm_milit_desc:0 "The revolution is surrounded. The revolution needs guns before it needs bakeries, and the party says so out loud."
 DES_cm_milit2:0 "The Workers' Arsenals"
 DES_cm_milit2_desc:0 "Factories are handed over to the committees that run them, with production targets that are met by definition."
 DES_cm_milit3:0 "The Militia Levy"
 DES_cm_milit3_desc:0 "Every worker is given a rifle and three weeks' training, and the general staff is assured this is not what it looks like."
 DES_cm_works:0 "A Country That Works Again"
 DES_cm_works_desc:0 "Streetlights, tram timetables, a post office that answers letters. Whoever is in charge, this is what they will be judged on."
 DES_cm_armyq:0 "The Army Question"
 DES_cm_armyq_desc:0 "The staff has two plans and no money for both. Whatever survives the argument will shape the army for the next twenty years."
 DES_cm_armour:0 "Mass Armour"
 DES_cm_armour_desc:0 "Tanks built cheap, simple and in enormous numbers by factories given six weeks' notice."
 DES_cm_armour2:0 "The Tractor Works"
 DES_cm_armour2_desc:0 "The same plant builds tractors in peace and hulls in war. The party considers this the purest form of planning."
 DES_cm_armour3:0 "The Armoured Brigades"
 DES_cm_armour3_desc:0 "Brigades rather than divisions, so that no single commander ever has enough armour to become interesting."
 DES_cm_infantry:0 "The People's Infantry"
 DES_cm_infantry_desc:0 "A rifle in every household and a commissar in every company: the cheapest army ever fielded and the hardest to surrender."
 DES_cm_infantry2:0 "The Gun Collectives"
 DES_cm_infantry2_desc:0 "Artillery produced by collectives, to a design that any of them can build without a specialist."
 DES_cm_infantry3:0 "The Mass Levy"
 DES_cm_infantry3_desc:0 "Every district a battalion, every factory a company, every village a section."
 DES_cm_newmodel:0 "The New Model Army"
 DES_cm_newmodel_desc:0 "One doctrine, one staff college, one set of manuals - and a generation of officers who have only ever been taught the version that won."
 DES_cm_pol1:0 "The Workers' Councils"
 DES_cm_pol1_desc:0 "Every factory elects a council, every council sends a delegate, and every delegate is very carefully vetted by the party."
 DES_cm_pol2:0 "The Crown Abdicates"
 DES_cm_pol2_desc:0 "The emperor is permitted to leave with his library. He takes four hundred crates and none of the silver."
 DES_cm_pol3:0 "The People's Commissars"
 DES_cm_pol3_desc:0 "Ministries are renamed, the men running them are not, and the country is assured that the difference is everything."
 DES_cm_pol4:0 "The Party Congress"
 DES_cm_pol4_desc:0 "Two thousand delegates, one agenda, and a vote that everyone already knows the result of."
 DES_cm_pol5:0 "The Socialist Republic"
 DES_cm_pol5_desc:0 "The empire is formally abolished and replaced by a federation of workers' republics, governed from the same building as the empire."
 DES_cm_for1:0 "The Comintern Question"
 DES_cm_for1_desc:0 "Whether the revolution is Despria's or the world's. The argument lasts three days and is settled in favour of both."
 DES_cm_for2:0 "Fraternal Envoys"
 DES_cm_for2_desc:0 "Embassies staffed by men who are diplomats second and party members first."
 DES_cm_for3:0 "Printers for the World"
 DES_cm_for3_desc:0 "Presses, paper and couriers are shipped to every party on the map that has the same enemies as Despria."
 DES_cm_for4:0 "The Revolutionary War"
 DES_cm_for4_desc:0 "Where the workers are not permitted to win, the republic will win for them and explain afterwards."
 DES_cm_for5:0 "Allies of the Workers"
 DES_cm_for5_desc:0 "The republic will sign with anyone who will sign, without asking too closely what their workers think of them."
 DES_cm_cap:0 "The Workers' Republic"
 DES_cm_cap_desc:0 "The estates are gone, the crown is gone, and the country is now run by councils, committees and a party that assures everyone it is only holding the ladder."
 DPJ_armed_neutrality:0 "Armed Neutrality"
 DPJ_armed_neutrality_desc:0 "The directorate is neutral in every forum and enormous in every garrison. It will not join anybody's war and does not intend to be caught without one of its own."
 DPJ_iron_concord:0 "The Iron Concord"
 DPJ_iron_concord_desc:0 "A bloc of like-minded states bound to Despria by treaty, ideology and the shared certainty that they will be the ones writing the next peace."
 DES_constitutional_empire:0 "The Crowned Republic"
 DES_constitutional_empire_desc:0 "An empire that has decided to be governed by argument rather than by inheritance - and has kept the crown, because it turns out to be useful when dealing with the neighbours."
 DES_workers_republic:0 "The Workers' Republic"
 DES_workers_republic_desc:0 "The estates are gone, the crown is gone, and the country is now run by councils, committees and a party that assures everyone it is only holding the ladder."
