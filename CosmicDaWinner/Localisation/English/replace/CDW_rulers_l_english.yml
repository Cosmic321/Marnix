 RIT_ruler:0 "Fatolini"
 RIT_ruler_desc:0 "Fatolini has run the Itsany Republic for as long as anyone can remember, and the Republic has stopped asking what, exactly, he runs it with. The trains run on time, the press runs on him, and the army has been issued very good hats."
