 DPJ_ruler_neutral:0 "Marshal Berthold Kessler"
 DPJ_ruler_neutral_desc:0 "Kessler commanded the southern army group, signed the armistice, and has spent every year since insisting that soldiers have no business in politics while being the only person in the country with a say in them. He governs through committees he appoints and resigns from them whenever a decision turns out badly."
 DES_ruler_democratic:0 "Matthias Kern"
 DES_ruler_democratic_desc:0 "Kern was the empire's best constitutional lawyer before he was its first elected head of government, and he has the lawyer's faith that a badly drafted clause is a greater danger than a foreign army. He has drafted the crown's powers down to the point where the emperor's signature is decorative, and both he and the emperor are quietly relieved about it."
 DES_ruler_communist:0 "Rosa Feldt"
 DES_ruler_communist_desc:0 "Feldt spent the war printing pamphlets on a press she built herself and the peace organising the factory councils that eventually took the country. She is the only member of the new government who is genuinely uninterested in the old nobility, which the old nobility finds more frightening than hatred."
